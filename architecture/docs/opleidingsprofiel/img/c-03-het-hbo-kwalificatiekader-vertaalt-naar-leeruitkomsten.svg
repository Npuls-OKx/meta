<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 644" width="1015" height="644"><rect x="0.5" y="0.5" width="1014" height="643" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">C-03 - Het hbo-kwalificatiekader vertaalt naar leeruitkomsten</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="467" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(675,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwalificatiekader vertalen naar leeruitkomsten</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="365" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(383,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Beroepsprofiel</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">beroepenveld Technische Natuurkunde</text><rect x="40" y="188" width="421" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(439,193)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Landelijk opleidingsprofiel</text><text x="50" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Hbo-bachelor Technische Natuurkunde, 2016</text><rect x="40" y="264" width="282" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(300,269)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Competentie</text><text x="50" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Experimenteren, niveau III</text><rect x="40" y="340" width="282" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(300,345)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Eindkwalificatie</text><text x="50" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">in de OER van de opleiding</text><rect x="40" y="416" width="643" height="99" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(661,421)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert experimenten uit volgens een zelf opgestelde opzet (NLQF 6)</text><text x="50" y="469" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Beroepsprofiel wordt ook vertaald naar deze</text><text x="50" y="486" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Landelijk opleidingsprofiel wordt ook vertaald naar deze</text><text x="50" y="503" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Competentie wordt ook vertaald naar deze</text><path d="M100 160V188" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 188l-4 -8h8z" fill="#444"/><text x="108" y="178" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voedt</text><path d="M100 236V264" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 236l-5 7l5 7l5 -7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="108" y="254" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">bestaat uit</text><path d="M100 312V340" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 312l-4 8h8z" fill="#444"/><text x="108" y="330" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">verwezenlijkt een selectie uit</text><path d="M100 388V416" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 416l-4 -8h8z" fill="#444"/><text x="108" y="406" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Wordt vertaald naar</text><text x="12" y="537" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het hbo komt langs zijn eigen weg tot competenties: een beroepsprofiel voedt het landelijk opleidingsprofiel, dat</text><text x="12" y="556" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">bestaat uit competenties, waaruit de instelling haar eindkwalificaties verwezenlijkt. Hoe die weg loopt is aan de</text><text x="12" y="575" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">sector. Wat OKx vastlegt is dat elk van die objecten vertaalt naar een leeruitkomst, in dezelfde vorm als in het mbo.</text><text x="12" y="594" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Voluit luidt de leeruitkomst hieronder: voert experimenten uit volgens een zelf opgestelde opzet, met aantoonbaar</text><text x="12" y="613" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">betrouwbare en reproduceerbare resultaten, in een laboratoriumomgeving waarin methode en apparatuur zelfstandig worden</text><text x="12" y="632" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">gekozen (hbo-bachelor Technische Natuurkunde, NLQF 6, competentie Experimenteren niveau III).</text></svg>