  /leveringen/{leveringId}:
    get:
      summary: De uitkomst van een levering opvragen
      operationId: get-leveringen-leveringId
      x-okx-stroom: IS-OA-01
      x-okx-herkomst:
      - IS-OA-01-O5
      x-okx-stand: voorstel
      x-okx-stand-kwalificatie: de bewaartermijn van een afgehandelde levering staat open
      x-okx-werkbrieven:
      - IS-OA-01 W1
      - IS-OA-01 W17
      parameters:
      - name: leveringId
        in: path
        required: true
        description: Het leveringId dat de catalogus bij de aanname toekende en stabiel houdt over elke
          uitkomst van die levering.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'De huidige toestand van de levering. De uitkomst blijft opvraagbaar zolang de
            catalogus de levering bewaart.


            Hier staat iets open: Geen voorbeeldpayload bij deze operatie; de specificatie toont dezelfde
            vorm op de melding verwerkingsstatus.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/intake-outcome'
        '404':
          description: Een onbekend leveringId.
      description: 'Stand: voorstel, de bewaartermijn van een afgehandelde levering staat open.


        Werkbrief: IS-OA-01 W1, IS-OA-01 W17.


        Foutgedrag: 200 draagt de huidige toestand van de levering, 404 volgt bij een onbekend leveringId.
        Notify then pull (U4) legt deze weg vast, zodat een gemiste melding alsnog te halen is.


        Dienst: verwerkingsstatus.


        Herkomst: IS-OA-01-O5.'
  /onderwijsspecificaties:
    get:
      summary: Herbruikbare specificaties zoeken
      operationId: get-onderwijsspecificaties
      x-okx-stroom: IS-OA-01, IS-OA-03
      x-okx-herkomst:
      - IS-OA-01-O1
      - IS-OA-03-O5
      x-okx-stand: vastgelegd
      x-okx-stand-kwalificatie: 'de parameter leeruitkomstId staat op voorstel


        de paginering staat op voorstel'
      x-okx-werkbrieven:
      - IS-OA-01 W3
      - IS-OA-03 W14
      parameters:
      - name: status
        in: query
        required: false
        description: 'De status waarop de lijst filtert; zonder deze parameter geldt gepubliceerd.


          Hier staat iets open: De operatietabel noemt de standaardwaarde en niet de volledige waardenlijst,
          dus blijft de parameter een vrije string.'
        schema:
          type: string
          default: gepubliceerd
      - name: gewijzigdSinds
        in: query
        required: false
        description: Een tijdstempel; de lijst draagt wat sindsdien wijzigde. Bedoeld voor herstel na
          een gemiste melding.
        schema:
          type: string
          format: date-time
      - name: leeruitkomstId
        in: query
        required: false
        description: 'De leeruitkomst waarop de lijst filtert.


          Stand: voorstel. Werkbrief: IS-OA-01 W3.'
        schema:
          type: string
          format: uuid
        x-okx-stand: voorstel
        x-okx-werkbrieven:
        - IS-OA-01 W3
      responses:
        '200':
          description: 'De herbruikbare specificaties, elk als referentie met haar laatste versie binnen
            de gevraagde status; O2 levert de structuur per id.


            Hier staat iets open: Een array zonder omhulling draagt geen vervolgverwijzing en geen totaal,
            waarmee de paginering uit W14 van IS-OA-03 op een omhullend object uitkomt; signalering S22
            van de leeswijzer draagt dat punt.


