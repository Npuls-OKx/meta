openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Onderwijscatalogus, koppelvlak onderwijsaanbod
  version: 0.0.1
  summary: 'Het koppelvlak van de onderwijscatalogus: de operaties die dit component serveert en de meldingen
    die het verstuurt, uit de interactiespecificatie ontwerpen en ontsluiten van onderwijsaanbod.'
  description: 'Dit document is afgeleid en wordt niet onderhouden: het komt uit operaties.json van de
    interactiespecificatie, met scripts/genereer-oas.py. Een wijziging hoort in de specificatie, waarna
    dit document opnieuw wordt gegenereerd.


    Elke stroom waarin de onderwijscatalogus voorkomt staat in dit bestand: IS-OA-01 met de curriculum
    ontwerptool, IS-OA-03 en IS-OA-04 met het planningssysteem, IS-OA-05 met de kernregistratie. IS-OA-04
    draagt alleen operaties op het planningssysteem plus een melding die de catalogus ontvangt.


    Wat deze specificatie als voorstel draagt, draagt dat ook hier: elke operatie, parameter en respons
    noemt haar stand in haar beschrijving en in x-okx-stand, met de kwalificatie erbij waar de stand een
    onderdeel van de operatie betreft.'
servers:
- url: '{basis}'
  description: Plaatshouder. De interactiespecificatie legt geen basis-URL vast. De plaatshouder hieronder
    zegt dat de keuze openstaat; hij wijst naar het gereserveerde topniveaudomein .invalid (RFC 2606),
    zodat niemand hem voor een werkend adres houdt.
  variables:
    basis:
      default: https://component.invalid/okx
      description: Het adres waarop de instelling dit component ontsluit.
security:
- okxClientCredentials: []
paths:
  /aanmeldbaar-aanbod:
    get:
      summary: Het aanmeldbare aanbod opsommen
      operationId: get-aanmeldbaar-aanbod
      x-okx-stroom: IS-OA-05
      x-okx-herkomst:
      - IS-OA-05-O6
      x-okx-stand: voorstel
      x-okx-werkbrieven:
      - IS-OA-05 W3
      - IS-OA-05 W8
      parameters:
      - name: cohort
        in: query
        required: false
        description: Het cohort waarop de lijst filtert.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: De status waarop de lijst filtert; zonder deze parameter geldt aanmeldbaar.
        schema:
          type: string
          default: aanmeldbaar
      - name: gewijzigdSinds
        in: query
        required: false
        description: Een tijdstempel; bedoeld voor herstel na een gemist bericht.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: 'De aanmeldbare instanties met hun laatste versie, elk als referentie.


            Hier staat iets open: De specificatie noemt de referentie per aanbod en geen schema voor de
            lijst eromheen; de array is hier afgeleid uit de zin die de respons beschrijft.


            Stand: voorstel. Werkbrief: IS-OA-05 W8.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/offering-reference'
          x-okx-stand: voorstel
          x-okx-werkbrieven:
          - IS-OA-05 W8
        '400':
          description: Een onbekende parameterwaarde.
      description: 'Stand: voorstel.


        Werkbrief: IS-OA-05 W3, IS-OA-05 W8.


        Foutgedrag: 400 bij een onbekende parameterwaarde. Alleen-lezen.


        Herkomst: IS-OA-05-O6.'
  /aanmeldbaar-aanbod/{id}:
    get:
      summary: Een aanmeldbaar aanbod ophalen
      operationId: get-aanmeldbaar-aanbod-id
      x-okx-stroom: IS-OA-05
      x-okx-herkomst:
      - IS-OA-05-O2
      x-okx-stand: voorstel
      x-okx-werkbrieven:
      - IS-OA-05 W2
      - IS-OA-05 W3
      parameters:
      - name: id
        in: path
        required: true
        description: Het Opleidingsprogramma aanbod.
        schema:
          type: string
          format: uuid
      - name: versie
        in: query
        required: false
        description: De versie die de respons draagt; zonder deze parameter de laatst gepubliceerde.
        schema:
          type: string
      responses:
        '200':
          description: De aanmeldbare snede, met de instanties in offeringInstances naast locations en
            organisationUnits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/offering-open-for-application'
              examples:
                voorbeeld-1:
                  summary: Uit stroom-is-oa-05.md:216
                  value:
                    offeringInstances:
                    - id: 7aa6609f-1d1b-471a-a0f8-beae490d31b5
                      offeringType: opleidingsaanbod
                      version: 0.1.0
