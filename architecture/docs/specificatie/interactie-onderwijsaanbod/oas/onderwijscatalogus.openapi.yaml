      title: Specification status changed
      DutchName: Specificatie-status-gewijzigd
      $comment: Alfa en indicatief. Deze vorm onderbouwt welke velden het koppelvlak nodig heeft en kan
        wijzigen zolang de payload niet is vastgesteld. Status-lifecycle volgt de lifecycle-uitwerking,
        §3.
      type: object
      required:
      - objectId
      - oldStatus
      - newStatus
      properties:
        objectId:
          type: string
          format: uuid
          DutchName: objectId
        oldStatus:
          enum:
          - concept
          - vastgesteld
          - gepubliceerd
          - gedeactiveerd
          - gearchiveerd
          - vervallen
          DutchName: oudeStatus
        newStatus:
          enum:
          - concept
          - vastgesteld
          - gepubliceerd
          - gedeactiveerd
          - gearchiveerd
          - vervallen
          DutchName: nieuweStatus
    student-choice-rule:
      title: Student choice rule
      DutchName: Student keuze regel
      $comment: 'Voorstel van de interactiespecificatie onderwijsaanbod, eenheid IS-OA-01 (werkbrief W9).
        rule-set/alfa draagt de regelset en laat het regelobject vrij als een object zonder eigenschappen;
        daarmee staat elke sleutel binnen een regel buiten elk schema. Dit is een overlay op rule-set/alfa:
        het typeert dat regelobject en laat de regelset zelf onaangeroerd. Een payload met regelsets valideert
        tegen het dragende schema en tegen deze overlay. De overlay hangt aan de array ruleSets, die education-specification/alfa
        en result-structure/alfa beide dragen. De sleutels volgen de tabel in paragraaf 4.6 van IS-OA-01,
        met de grond per sleutel erbij. Zolang dit schema voorstel is eindigt de $id op /voorstel.'
      type: object
      properties:
        ruleSets:
          type: array
          items:
            $ref: '#/components/schemas/student-choice-rule/$defs/typedRuleSet'
          $comment: dezelfde array die education-specification/alfa en result-structure/alfa dragen
          DutchName: regelsets
      $defs:
        typedRuleSet:
          title: Typed rule set
          DutchName: Regelset met getypeerde regels
          $comment: rule-set/alfa houdt id, versie, naam, omschrijving en vanToepassingOp, dus is hier
            alleen id verplicht.
          type: object
          required:
          - id
          properties:
            id:
              type: string
              format: uuid
              DutchName: id
            rules:
              type: array
              items:
                $ref: '#/components/schemas/student-choice-rule/$defs/rule'
              $comment: dezelfde array die rule-set/alfa draagt, daar als object zonder eigenschappen
              DutchName: regels
        rule:
          title: Rule
          DutchName: Regel
          $comment: 'Objecttype Student keuze regelset, dat zijn regels zelf draagt. Elk regeltype vult
            een eigen deel van deze sleutels: kiesbaar werkt met bereik, keuzedeel en voorwaardeVooraf,
            minimaleStudielast met waarde, eenheid en bronSpecificatieId, en resultaatEis met bereik en
            eis.'
          type: object
          required:
          - type
          properties:
            type:
              enum:
              - kiesbaar
              - minimaleStudielast
              - resultaatEis
              $comment: de gesloten en uitbreidbare set uit regelset-payload.md. Die uitwerking voert
                vier Nederlandse typen (kiesbaarheid, deelnamevoorwaarde, keuzeomvang, beschikbaarheid);
                deze drie zijn de typen die de keten van IS-OA-01 naar IS-OA-03 nodig heeft, en het gelijktrekken
                van beide reeksen hoort bij werkbrief W9
              DutchName: type
            scope:
              type: string
              $comment: 'waar de regel over gaat, als benoemd bereik: een opsomming van specificaties,
                of een selectie op een attribuut van een specificatie zoals electiveUnitClass. regelset-payload.md
                draagt het bereik als eigen object met bereikId; zolang die vorm voorstel is draagt deze
                sleutel de aanduiding als tekst'
              DutchName: bereik
            electiveUnit:
              type: string
              format: uuid
              $comment: het keuzedeel waarop de regel slaat; het informatiemodel verbindt Student keuze
                regelset met Keuzedeel
              DutchName: keuzedeel
            precondition:
              type: array
              items:
                $ref: '#/components/schemas/student-choice-rule/$defs/precondition'
              $comment: de deelnamevoorwaarde; regels.md drukt een voorwaarde uit in behaalde leeruitkomsten
                en niet in doorlopen specificaties
              DutchName: voorwaardeVooraf
            value:
              type: number
              $comment: de maat bij een omvangregel, de vorm van value in volume/alfa
              DutchName: waarde
            unit:
              enum:
              - SBU
              - EC
              $comment: dezelfde eenheden als unit in volume/alfa; ADR 0004 belegt SBU en EC als logistieke
                containergrootte
              DutchName: eenheid
            requirement:
              type: string
              $comment: het resultaat dat de regel verlangt, een waarde op de schaal uit result-model/alfa,
                in deze casus voldoende op de schaal voldoende-onvoldoende
              DutchName: eis
            sourceSpecificationId:
              type: string
              format: uuid
              $comment: de specificatie waaruit de maat komt, in deze casus de keuzedeelruimte met haar
                studyLoad in education-specification/alfa
              DutchName: bronSpecificatieId
        precondition:
          title: Precondition
          DutchName: Voorwaarde vooraf
          $comment: 'Objecttype Leeruitkomst als voorwaarde op Student keuze regelset. De status blijft
            behaald: de voorwaarde rust op een vastgesteld onderwijsresultaat op die leeruitkomst (ADR
            0022).'
          type: object
          required:
          - requiredLearningOutcomeId
          - status
          properties:
            requiredLearningOutcomeId:
              type: string
              format: uuid
              DutchName: vereisteLeeruitkomstId
            status:
              enum:
              - behaald
              DutchName: status
    subscription:
      title: Subscription
      DutchName: Abonnement
      $comment: Alfa en indicatief. Deze vorm onderbouwt welke velden het koppelvlak nodig heeft en kan
        wijzigen zolang de payload niet is vastgesteld. `id` is afwezig in het verzoek en door de server
        toegekend in de respons.
      type: object
      required:
      - callbackUrl
      - events
      properties:
        id:
          type: string
          format: uuid
          DutchName: id
        callbackUrl:
          type: string
          format: uri
          DutchName: callbackUrl
        events:
          type: array
          items:
            enum:
            - specificatie-planbaar
            - specificatie-gewijzigd
            - specificatie-status-gewijzigd
            - verwerkingsstatus
          DutchName: events
    volume:
      title: Volume
      DutchName: Omvang
      $comment: Alfa en indicatief. Deze vorm onderbouwt welke velden het koppelvlak nodig heeft en kan
        wijzigen zolang de payload niet is vastgesteld.
      type: object
      required:
      - value
      - unit
      properties:
        value:
          type: number
          DutchName: waarde
        unit:
          enum:
          - SBU
          - EC
          DutchName: eenheid
x-okx-ontvangen-meldingen:
- melding: inrichtingsstatus
  melder: kernregistratie
  description: 'De inrichtingsstatus terugmelden


    De uitkomst van het inrichten: bij ingericht en verwerkt staat arrangementReference gevuld, bij afgekeurd,
    nietIngericht en nietVerwerkt staat reason gevuld.


    Stand: vastgelegd, vastgelegd als meldpatroon, het payloadschema staat op voorstel. Werkbrief: IS-OA-05
    W4, IS-OA-05 W6.


    Deze melding komt aan op het afleveradres dat dit component bij de melder registreert, en dat adres
    is een inrichtingskeuze in plaats van een pad in dit document. Haar vorm staat onder `webhooks` in
    het document van de melder, en haar payloadschema staat hieronder.'
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/arrangement-status'
      examples:
        voorbeeld-1:
          summary: Uit stroom-is-oa-05.md:283
          value:
            status: gestart
            offeringReference:
              offeringId: 8c494250-b67a-4666-a762-6f9ec1e70aff
              version: 0.1.0
            specificationReference:
              specificationId: 7ae25c1e-ee27-43a2-a001-761ee39ea5c7
              version: 0.1.0
        voorbeeld-2:
          summary: Uit stroom-is-oa-05.md:293
          value:
            status: nietIngericht
            offeringReference:
              offeringId: 8c494250-b67a-4666-a762-6f9ec1e70aff
              version: 0.1.0
            specificationReference:
              specificationId: 7ae25c1e-ee27-43a2-a001-761ee39ea5c7
              version: 0.1.0
            reason: De resultaatstructuur achter specificatie 7ae25c1e staat bij de kernregistratie nog
              niet ingericht
  x-okx-herkomst:
  - IS-OA-05-O4
  x-okx-stand: vastgelegd
  x-okx-stand-kwalificatie: vastgelegd als meldpatroon, het payloadschema staat op voorstel
  x-okx-werkbrieven:
  - IS-OA-05 W4
  - IS-OA-05 W6
- melding: verwerkingsstatus
  melder: planningssysteem
  description: 'De ontvangst en de afkeur terugmelden (I3)


    De verwerkingsstatus met de waarden ontvangen, gestart of afgekeurd. Bij gelukt draagt programmeOfferingId
    het opleidingsaanbod, en daarmee de overgang naar IS-OA-04.


    Stand: vastgelegd, het veld voor de validatiefout staat op voorstel. Werkbrief: IS-OA-03 W8.


    Deze melding komt aan op het afleveradres dat dit component bij de melder registreert, en dat adres
    is een inrichtingskeuze in plaats van een pad in dit document. Haar vorm staat onder `webhooks` in
    het document van de melder, en haar payloadschema staat hieronder.'
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/processing-status'
  x-okx-herkomst:
  - IS-OA-03-O4
  x-okx-stand: vastgelegd
  x-okx-stand-kwalificatie: het veld voor de validatiefout staat op voorstel
  x-okx-werkbrieven:
  - IS-OA-03 W8
