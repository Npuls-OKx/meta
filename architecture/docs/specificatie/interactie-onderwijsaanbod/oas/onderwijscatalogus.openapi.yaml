    offering-open-for-application:
      title: Offering open for application
      DutchName: Aanmeldbaar aanbod voor centraal aanmelden
      $comment: 'Voorstel van de interactiespecificatie onderwijsaanbod: de snede van education-offering/alfa
        waarmee een afnemer een opleiding aanmeldbaar toont en een aspirant-student een startmoment kiest.
        Twee aanbodlagen, met het aanmeldvenster, de uiterste inschrijfdatum en de herkomst in het kwalificatiekader
        erbij; IS-OA-06 vult daar de leerweg, de doelgroep en de aanbieder bij aan voor een voorziening
        die meer instellingen dient. De sloten (additionalProperties false) drukken de snede uit: groups
        (groepen), bottlenecks (knelpunten) en de lagen eronder blijven bij de instelling. IS-OA-05 draagt
        dit schema op de koppeling van de onderwijscatalogus naar de kernregistratie (W2 daar), IS-OA-06
        op die naar de voorziening voor centraal aanmelden (W11 daar); welke lagen en statuswaarden per
        koppeling reizen staat in het gebruiksprofiel van die koppeling. De afstemming met AII staat open
        als Npuls-OKx/Public#112. Verwijzingen naar andere schema''s gaan via hun $id.'
      type: object
      required:
      - offeringInstances
      properties:
        offeringInstances:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - id
            - offeringType
            - version
            - parentOfferingId
            - specificationReference
            - name
            - status
            properties:
              id:
                type: string
                format: uuid
                DutchName: id
              offeringType:
                enum:
                - opleidingsaanbod
                - opleidingsprogramma-aanbod
                DutchName: aanbodType
                $comment: De opleidingslaag groepeert, de programmalaag draagt het startmoment waarop
                  de aanmelding ontstaat. De lagen onderwijseenheid-aanbod en leergelegenheid uit education-offering/alfa
                  blijven buiten deze snede.
              version:
                type: string
                pattern: ^\d+\.\d+\.\d+$
                DutchName: versie
              parentOfferingId:
                type:
                - string
                - 'null'
                format: uuid
                DutchName: bovenliggendAanbodId
                $comment: De programmalaag hangt hiermee onder de opleidingslaag, zodat de startmomenten
                  van een opleiding bij elkaar staan.
              specificationReference:
                $ref: '#/components/schemas/specification-reference'
                DutchName: specificatieVerwijzing
              name:
                type: string
                DutchName: naam
              status:
                enum:
                - aanmeldbaar
                - geannuleerd
                DutchName: status
                $comment: 'Voorstel: de waarde aanmeldbaar naast de vier waarden van status in education-offering/alfa.
                  Deze snede draagt de twee waarden die de voorziening voor centraal aanmelden aangaan:
                  aanmeldbaar zet het aanbod in de etalage, geannuleerd haalt het eruit.'
              cohort:
                type: string
                DutchName: cohort
              period:
                $ref: '#/components/schemas/period'
                DutchName: periode
                $comment: start draagt het startmoment dat de aspirant-student kiest, end de verwachte
                  einddatum.
              applicationWindow:
                $ref: '#/components/schemas/period'
                DutchName: aanmeldvenster
                $comment: 'Voorstel: de termijn waarin aanmelden op dit startmoment openstaat, in de vorm
                  van period/alfa. W2 van IS-OA-05 en W10 van IS-OA-06 vragen dezelfde sleutel op education-offering/alfa,
                  zodat een vorm beide koppelingen dekt.'
              enrolmentDeadline:
                type: string
                format: date
                DutchName: uitersteInschrijfdatum
                $comment: 'Voorstel: de uiterste inschrijfdatum, die het conceptueel gegevensoverzicht
                  van leerroute 1 op de opleidingslaag legt, naast de opleidingsspecificatie.'
              learningPathway:
                enum:
                - BOL
                - BBL
                DutchName: leerweg
                $comment: 'Voorstel: de leerweg, met de sleutel en de waarden die learningPathway in education-specification/alfa
                  draagt op de programmalaag leerweg.'
              targetGroup:
                type: string
                DutchName: doelgroep
                $comment: 'Voorstel: open lijst met de sleutel die targetGroup in education-specification/alfa
                  draagt op de programmalaag doelgroep: regulier, zijinstromer, hybride, organisatiespecifiek.'
              source:
                type: array
                items:
                  $ref: '#/components/schemas/source'
                DutchName: bron
                $comment: 'Voorstel: de herkomst in het kwalificatiekader, zodat het crebo-dossier en
                  de kwalificatie meekomen zonder de leeruitkomstboom. source/alfa staat vandaag als enkel
                  object op learning-outcome/alfa; W2 van IS-OA-06 maakt er een array van op de aanbodinstantie.'
              providerId:
                type: string
                format: uuid
                DutchName: aanbiederId
                $comment: 'Voorstel: de onderwijsaanbieder uit de definitie van Opleiding aanbod, op de
                  opleidingslaag, op te lossen in organisationUnits.'
              minStudentCount:
                type: integer
                minimum: 0
                DutchName: minAantalStudenten
              maxStudentCount:
                type: integer
                minimum: 0
                DutchName: maxAantalStudenten
                $comment: De capaciteit instroom die het conceptueel gegevensoverzicht van leerroute 1
                  op de opleidingslaag legt.
              locationId:
                type: string
                format: uuid
                DutchName: locatieId
                $comment: Op te lossen in locations.
              executingTeamId:
                type: string
                format: uuid
                DutchName: uitvoerendTeamId
                $comment: Op te lossen in organisationUnits.
            additionalProperties: false
            allOf:
            - $comment: Een aanmeldbaar startmoment draagt het venster waarin aanmelden openstaat.
              if:
                properties:
                  offeringType:
                    const: opleidingsprogramma-aanbod
                  status:
                    const: aanmeldbaar
                required:
                - offeringType
                - status
              then:
                required:
                - applicationWindow
                - period
          DutchName: aanbodInstanties
        locations:
          type: array
          items:
            $ref: '#/components/schemas/location'
          DutchName: locaties
          $comment: codes draagt de vestigingscode, de sleutel waarop een sectorale partij de locatie
            terugvindt.
        organisationUnits:
          type: array
          items:
            $ref: '#/components/schemas/organisation-unit'
          DutchName: organisatieEenheden
      additionalProperties: false
    offering-reference:
      title: Offering reference
      DutchName: Aanbod-referentie
      $comment: Voorstel. Het label voorstel in de $id houdt dit schema apart van de alfa-schema's die
        Npuls-OKx/Public draagt; werkbrief W8 van IS-OA-05 laat het daar landen. Dezelfde vorm als specification-reference/alfa,
        met het aanbod als onderwerp. arrangement-status/voorstel en offering-processing-status/voorstel
        wijzen er beide naar.
      type: object
      required:
      - offeringId
      - version
      properties:
        offeringId:
          type: string
          format: uuid
          DutchName: aanbodId
        version:
          type: string
          pattern: ^\d+\.\d+\.\d+$
          DutchName: versie
      additionalProperties: false
    offering-request:
      title: Offering request
      DutchName: Verzoek tot aanbod
      $comment: 'Voorstel van de interactiespecificatie onderwijsaanbod, eenheid IS-OA-03 (werkbrief W1).
        Het objecttype Verzoek tot Aanbod / Intekening op specificatie reist vandaag mee als de specificatie-referentie
        van de melding specificatie-planbaar, waarmee de planopgave zelf geen identiteit heeft en de catalogus
        haar aanvraag niet kan terugvinden. Dit schema geeft haar die identiteit: specification-reference/alfa
        als verwijzing naar de planbare specificatie, met het verzoek-id, het aangevraagde cohort, het
        aanvraagmoment en de verwachte instroom eromheen. Beeld F2-02 en F2-03 van voorbeeld-lr1-regels.json
        dragen de instantie. Een document dat tegen dit schema valideert draagt dezelfde verwijzing als
        de melding van vandaag, dus blijft die melding leesbaar voor een ontvanger die alleen specification-reference/alfa
        kent. Werkbrief W13 beslist waar het eventId voor een herhaalde aflevering landt. Verwijzingen
        naar andere schema''s gaan via hun $id.'
      type: object
      required:
      - requestId
      - specificationReference
      - cohort
      properties:
        requestId:
          type: string
          format: uuid
          $comment: de onderwijscatalogus kent dit id toe bij het verzoek en houdt het stabiel, zodat
            de verwerkingsstatus en het geplande aanbod naar dezelfde planopgave terugwijzen
          DutchName: verzoekId
        specificationReference:
          $ref: '#/components/schemas/specification-reference'
          $comment: de planbare specificatie met haar versie, de lading die de melding specificatie-planbaar
            vandaag draagt
          DutchName: specificatieVerwijzing
        name:
          type: string
          $comment: 'de naam van de planopgave, beeld F2-02: Planopgave Apothekersassistent, cohort 2026'
          DutchName: naam
        cohort:
          type: string
          $comment: het cohort waarvoor het aanbod wordt gevraagd; dezelfde sleutel draagt het cohort
            in education-specification/alfa en education-offering/alfa
          DutchName: cohort
        requestedAt:
          type: string
          format: date
          $comment: het moment waarop de catalogus het verzoek aanbiedt, in de datumvorm die de schema's
            in Npuls-OKx/Public aanhouden
          DutchName: aanvraagmoment
        expectedIntake:
          type: integer
          minimum: 0
          $comment: de instroom die de catalogus verwacht, waartegen planning haar capaciteit zet in minStudentCount
            en maxStudentCount van education-offering/alfa
          DutchName: verwachteInstroom
      additionalProperties: false
    offering-status-changed:
      title: Offering status changed
      DutchName: Aanbod-status-gewijzigd
      $comment: 'Voorstel van de interactiespecificatie onderwijsaanbod (IS-OA-06): het payloadschema
        van de melding dat een onderwijsaanbod van status wisselt, bijvoorbeeld van gepland naar aanmeldbaar.
        De vorm volgt specification-status-changed/alfa, met het aanbod als onderwerp en de statuswaarden
        van education-offering/alfa. De melding draagt de aanleiding en laat de inhoud bij de bezitter
        (U4, melden en dan ophalen). Welke overgangen over een koppeling reizen staat in het gebruiksprofiel
        van die koppeling: IS-OA-05 meldt op aanbod-aanmeldbaar aan de kernregistratie, IS-OA-06 op aanmeldbaar-aanbod-beschikbaar
        aan de voorziening voor centraal aanmelden. Werkbrief W1 van IS-OA-05 en W5 van IS-OA-06 laten
        dit schema in Npuls-OKx/Public landen; de afstemming met AII staat open als Npuls-OKx/Public#112.
        Verwijzingen naar andere schema''s gaan via hun $id.'
      type: object
      required:
      - offeringId
      - version
      - offeringType
      - specificationReference
      - oldStatus
      - newStatus
      properties:
        offeringId:
          type: string
          format: uuid
          DutchName: aanbodId
          $comment: De sleutel id uit education-offering/alfa, met de naam die offering-reference/voorstel
            draagt. specification-status-changed/alfa noemt dezelfde plek objectId.
        version:
          type: string
          pattern: ^\d+\.\d+\.\d+$
          DutchName: versie
        offeringType:
          enum:
          - opleidingsaanbod
          - opleidingsprogramma-aanbod
          - onderwijseenheid-aanbod
          - leergelegenheid
          DutchName: aanbodType
          $comment: De vier lagen van offeringType in education-offering/alfa. Welke lagen een koppeling
            meldt staat in haar gebruiksprofiel.
        specificationReference:
          $ref: '#/components/schemas/specification-reference'
          DutchName: specificatieVerwijzing
        oldStatus:
          enum:
          - inPlanning
          - gepland
          - nietRealiseerbaar
          - geannuleerd
          - aanmeldbaar
          DutchName: oudeStatus
          $comment: 'Voorstel: de vier waarden van status in education-offering/alfa plus aanmeldbaar.'
        newStatus:
          enum:
          - inPlanning
          - gepland
          - nietRealiseerbaar
          - geannuleerd
          - aanmeldbaar
          DutchName: nieuweStatus
          $comment: 'Voorstel: dezelfde lijst als oldStatus. De koppeling van de kernregistratie naar
            de voorziening voor centraal aanmelden meldt op de overgangen naar aanmeldbaar en naar geannuleerd.'
        cohort:
          type: string
          DutchName: cohort
          $comment: Het cohort waarop de afnemer zijn opvraag filtert, zoals parameter cohort van GET
            /aanmeldbaar-aanbod.
        eventId:
          type: string
          format: uuid
          DutchName: eventId
          $comment: 'Voorstel: het stabiele id waarop de ontvanger een herhaalde aflevering herkent, dat
            U5 vraagt (W8).'
    organisation-unit:
