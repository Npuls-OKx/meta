        '400':
          description: Een onbruikbare parameterwaarde.
        '404':
          description: Een onbekend aanbod-id of een onbekende versie.
      description: 'Stand: voorstel.


        Werkbrief: IS-OA-05 W2, IS-OA-05 W3.


        Foutgedrag: 404 bij een onbekend aanbod-id of een onbekende versie. Alleen-lezen, dus herhalen
        geeft hetzelfde antwoord.


        Herkomst: IS-OA-05-O2.'
  /aanmeldbaar-aanbod/{id}/delta:
    get:
      summary: De wijziging op een aanmeldbaar aanbod ophalen
      operationId: get-aanmeldbaar-aanbod-id-delta
      x-okx-stroom: IS-OA-05
      x-okx-herkomst:
      - IS-OA-05-O3
      x-okx-stand: voorstel
      x-okx-werkbrieven:
      - IS-OA-05 W7
      parameters:
      - name: id
        in: path
        required: true
        description: Het Opleidingsprogramma aanbod.
        schema:
          type: string
          format: uuid
      - name: van
        in: query
        required: true
        description: De versie waarvan de wijziging vertrekt; de kernregistratie kent de versie waarop
          zij staat.
        schema:
          type: string
      - name: naar
        in: query
        required: true
        description: De versie waarop de wijziging uitkomt.
        schema:
          type: string
      responses:
        '200':
          description: De wijziging tussen de twee versies, als JSON Patch (RFC 6902).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/education-offering-delta'
              examples:
                voorbeeld-1:
                  summary: Uit stroom-is-oa-05.md:304
                  value:
                  - op: replace
                    path: /offeringInstances/1/applicationWindow/end
                    value: '2026-06-01'
                  - op: replace
                    path: /offeringInstances/1/version
                    value: 0.2.0
        '400':
          description: Een versiebereik dat de catalogus niet kan samenstellen.
        '404':
          description: Een onbekend aanbod-id.
      description: 'Stand: voorstel.


        Werkbrief: IS-OA-05 W7.


        Foutgedrag: 400 bij een versiebereik dat de catalogus niet kan samenstellen, 404 bij een onbekend
        aanbod-id.


        Herkomst: IS-OA-05-O3.'
  /abonnementen:
    post:
      summary: Het afleveradres vastleggen
      operationId: post-abonnementen
      x-okx-stroom: IS-OA-01, IS-OA-03, IS-OA-05
      x-okx-herkomst:
      - IS-OA-01-O8
      - IS-OA-03-O6
      - IS-OA-05-O5
      x-okx-stand: vastgelegd
      x-okx-stand-kwalificatie: 'vastgelegd bij de onderwijscatalogus, op voorstel bij de curriculum ontwerptool


        vastgelegd als pad, de meldingssoorten aanbod-aanmeldbaar en inrichtingsstatus staan op voorstel'
      x-okx-werkbrieven:
      - IS-OA-01 W2
      - IS-OA-05 W5
      requestBody:
        required: true
        description: 'Het afleveradres met de meldingssoorten waarop de partij zich abonneert. Dit bericht
          richt het kanaal in en vervalt zodra de aflevering over een bus of broker loopt (U5).


          Hier staat iets open: Geen voorbeeldpayload bij deze operatie, in geen van de drie stromen die
          haar dragen.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subscription'
      responses:
        '201':
          description: 'Het abonnement is vastgelegd, met het toegekende id.


            Stand: vastgelegd, de operatietabel noemt geen antwoordlichaam; bericht 4 van IS-OA-03 zegt
            dat het id in de respons wordt toegekend, en daaruit volgt dit lichaam.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
          x-okx-stand: vastgelegd
          x-okx-stand-kwalificatie: de operatietabel noemt geen antwoordlichaam; bericht 4 van IS-OA-03
            zegt dat het id in de respons wordt toegekend, en daaruit volgt dit lichaam
        '400':
          description: Een onbruikbaar afleveradres of een onbekende meldingssoort.
      description: 'Stand: vastgelegd, vastgelegd bij de onderwijscatalogus, op voorstel bij de curriculum
        ontwerptool (IS-OA-01); vastgelegd als pad, de meldingssoorten aanbod-aanmeldbaar en inrichtingsstatus
        staan op voorstel (IS-OA-05).


        Werkbrief: IS-OA-01 W2, IS-OA-05 W5.


        Foutgedrag: Herhaalbaar zonder extra effect (idempotent) op afleveradres plus soort melding: een
        herhaalde registratie overschrijft de vorige. HTTP-foutcode. Herhaalbaar zonder extra effect (idempotent)
        op callbackUrl plus event-type: herregistratie overschrijft de vorige. HTTP-foutcodes. Herregistratie
        overschrijft op de combinatie afleveradres plus meldingssoort.


        Dienst: afleverabonnement-aanbieder.


        Herkomst: IS-OA-01-O8, IS-OA-03-O6, IS-OA-05-O5.'
  /examenplanspecificaties:
    post:
      summary: De resultaatstructuur aanleveren
