                  version: 0.1.0
        x-okx-voorstel-vorm:
          description: 'De vorm die werkbrief W1 voorstelt: dezelfde referentie met de planopgave eromheen,
            zodat het verzoek een eigen identiteit draagt. Twee verzoeken op dezelfde specificatieversie
            zien er in de vastgelegde vorm gelijk uit.


            Stand: voorstel. Werkbrief: IS-OA-03 W1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/offering-request'
              examples:
                voorbeeld-1:
                  summary: Uit stroom-is-oa-03.md:207
                  value:
                    requestId: 7ec74caa-0b5a-4de7-bf69-04415a02f214
                    specificationReference:
                      specificationId: 79736830-1c5c-470f-b2c2-005029c96733
                      version: 0.1.0
                    name: Planopgave Apothekersassistent, cohort 2026
                    cohort: '2026'
                    requestedAt: '2025-04-01'
                    expectedIntake: 48
          x-okx-stand: voorstel
          x-okx-werkbrieven:
          - IS-OA-03 W1
      responses:
        '200':
          description: 'Het planningssysteem bevestigt de aflevering.


            De bevestiging draagt geen lichaam: de specificatie vraagt op deze melding alleen de statuscode.'
      x-okx-ontvanger: planningssysteem
      security:
      - okxAfleverCredentials: []
      description: 'Stand: vastgelegd, het verzoek tot aanbod eromheen staat op voorstel, en het eventId
        ook.


        Werkbrief: IS-OA-03 W1, IS-OA-03 W13.


        Foutgedrag: Blijft de bevestiging uit, dan opnieuw aanbieden met oplopende wachttijd (backoff)
        en daarna de wachtrij voor onbestelbare berichten (dead letter channel). Een tweede aflevering
        van dezelfde specificationId en version wijst hetzelfde verzoek aan.


        Herkomst: IS-OA-03-O1.'
  specificatie-status-gewijzigd:
    post:
      summary: Een statuswijziging melden
      operationId: melding-specificatie-status-gewijzigd
      x-okx-stroom: IS-OA-01
      x-okx-herkomst:
      - IS-OA-01-O7
      x-okx-stand: vastgelegd
      x-okx-stand-kwalificatie: de melding, haar schema en haar eventwaarde staan vastgelegd, het endpoint
        bij de curriculum ontwerptool staat op voorstel
      x-okx-werkbrieven:
      - IS-OA-01 W2
      - IS-OA-01 W12
      requestBody:
        required: true
        description: 'De overgang van vastgesteld naar gepubliceerd op de wortel van de opgenomen structuur.
          Het publicatiebesluit ligt bij de catalogus (ADR 0020).


          Hier staat iets open: Geen voorbeeldpayload bij deze melding.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/specification-status-changed'
      responses:
        '200':
          description: 'De ontvanger bevestigt de aflevering.


            De bevestiging draagt geen lichaam: de specificatie vraagt op deze melding alleen de statuscode.'
      x-okx-ontvanger: curriculum-ontwerptool
      security:
      - okxAfleverCredentials: []
      description: 'Stand: vastgelegd, de melding, haar schema en haar eventwaarde staan vastgelegd, het
        endpoint bij de curriculum ontwerptool staat op voorstel.


        Werkbrief: IS-OA-01 W2, IS-OA-01 W12.


        Foutgedrag: Als de melding verwerkingsstatus: herhalen met oplopende wachttijd en daarna de wachtrij
        voor onbestelbare berichten, en herhaalbaar zonder extra effect op het eventId.


        Dienst: onderwijsspecificatiestructuur-aanbieder.


        Herkomst: IS-OA-01-O7.'
  verwerkingsstatus:
    post:
      summary: De uitkomst van de inname melden
      operationId: melding-verwerkingsstatus
      x-okx-stroom: IS-OA-01
      x-okx-herkomst:
      - IS-OA-01-O6
      x-okx-stand: vastgelegd
      x-okx-stand-kwalificatie: de melding en haar schema staan vastgelegd, de sleutels deliveryId en
        findings erbij staan op voorstel, en het endpoint bij de curriculum ontwerptool staat op voorstel
      x-okx-werkbrieven:
      - IS-OA-01 W2
      - IS-OA-01 W12
      - IS-OA-01 W14
      requestBody:
        required: true
        description: 'De toestand van de levering: ontvangen, gestart, afgekeurd, gelukt of nietGelukt.
          Bij gelukt staan de toegekende identiteit en versie in specificationReference, bij een afkeuring
          staan de bevindingen in findings.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/intake-outcome'
            examples:
              voorbeeld-1:
                summary: Uit stroom-is-oa-01.md:210
                value:
                  deliveryId: d6d15731-fb31-4627-b51f-090a1e01be7b
                  status: gelukt
                  specificationReference:
                    specificationId: 79736830-1c5c-470f-b2c2-005029c96733
                    version: 0.1.0
                  eventId: e432bfdb-b64f-4f0c-b56c-4b1a87ba2a7d
              voorbeeld-2:
                summary: Uit stroom-is-oa-01.md:249
                value:
                  deliveryId: d6d15731-fb31-4627-b51f-090a1e01be7b
                  status: afgekeurd
                  specificationReference:
                    specificationId: 79736830-1c5c-470f-b2c2-005029c96733
                    version: 0.1.0
                  findings:
                  - code: studielastTeltNietOp
                    description: De onderdelen van Blok B1-K1 tellen op naar 600 SBU, terwijl de eenheid
                      2000 SBU draagt.
                    location: /educationSpecifications/3/studyLoad
                    involvedSpecificationIds:
                    - 402c2342-d897-4df4-a667-7fc5bd930944
                    - 327c8263-3516-4b5a-8d57-c16241ec008d
                    expectedValue: 2000 SBU
                    foundValue: 600 SBU
                  eventId: e432bfdb-b64f-4f0c-b56c-4b1a87ba2a7d
      responses:
        '200':
          description: 'De ontvanger bevestigt de aflevering.


            De bevestiging draagt geen lichaam: de specificatie vraagt op deze melding alleen de statuscode.'
      x-okx-ontvanger: curriculum-ontwerptool
      security:
      - okxAfleverCredentials: []
      description: 'Stand: vastgelegd, de melding en haar schema staan vastgelegd, de sleutels deliveryId
        en findings erbij staan op voorstel, en het endpoint bij de curriculum ontwerptool staat op voorstel.


        Werkbrief: IS-OA-01 W2, IS-OA-01 W12, IS-OA-01 W14.


        Foutgedrag: Zonder bevestiging herhaalt de melder met oplopende wachttijd (backoff) en daarna
        via de wachtrij voor onbestelbare berichten (dead letter channel). Een herhaald bericht heeft
        geen extra effect: de ontvanger herkent het eventId.


        Dienst: verwerkingsuitkomst-aanbieder.


        Herkomst: IS-OA-01-O6.'
components:
  securitySchemes:
    okxClientCredentials:
      type: oauth2
      description: 'auth-standaard.md in Npuls-OKx/Public legt OAuth 2.0 Client Credentials repo-breed
        vast, met een token-endpoint per serverend component en zonder centrale autorisatieserver, en
        past diezelfde regel omgekeerd toe op de aflevering van een melding.


        Vindplaats: https://github.com/Npuls-OKx/Public/blob/dev/Koppelvlakspecificaties/auth-standaard.md


        Hier staat iets open: De tokenUrl per component staat open: de auth-standaard legt het mechanisme
        vast en laat het adres aan de inrichting van instelling en leverancier.'
      flows:
        clientCredentials:
          tokenUrl: https://component.invalid/okx/token
          scopes: {}
    okxAfleverCredentials:
      type: oauth2
      description: 'Voor de aflevering van een melding geldt dezelfde regel omgekeerd: de melder haalt
        een token bij de token-endpoint van de ontvanger, met de gegevens die bij de registratie van het
        abonnement zijn afgesproken.


        Vindplaats: https://github.com/Npuls-OKx/Public/blob/dev/Koppelvlakspecificaties/auth-standaard.md


        Hier staat iets open: de token-endpoint van de ontvanger staat per abonnement open.'
      flows:
        clientCredentials:
          tokenUrl: https://ontvanger.invalid/okx/token
          scopes: {}
  schemas:
    address:
      title: Address
      DutchName: Adres
      $comment: Alfa en indicatief. Deze vorm onderbouwt welke velden het koppelvlak nodig heeft en kan
        wijzigen zolang de payload niet is vastgesteld.
      type: object
      properties:
        street:
          type: string
          DutchName: straat
        houseNumber:
          type: string
          DutchName: huisnummer
        postcode:
          type: string
          DutchName: postcode
        city:
          type: string
          DutchName: plaats
        country:
          type: string
          DutchName: land
    arrangement-status:
      title: Arrangement status
      DutchName: Inrichtingsstatus
      $comment: Voorstel. Het label voorstel in de $id houdt dit schema apart van de alfa-schema's die
        Npuls-OKx/Public draagt; werkbrief W4 van IS-OA-05 laat het daar landen. De dienstpagina van de
        onderwijscatalogus draagt het meldpatroon inrichtingsstatus en kondigt dit payloadschema aan.
        De statuswaarden komen uit interactie S4 van het interactiepatroon onderwijscatalogus naar studentinformatiesysteem.
        De vorm volgt processing-status/alfa, met het aanbod als onderwerp. Een eigenschap met een eigen
        $comment voorstel staat in geen schema van Public.
      type: object
      required:
      - status
      - offeringReference
      - specificationReference
      properties:
        eventId:
          type: string
          format: uuid
          $comment: 'voorstel: U5 vraagt een stabiel id waarop de ontvanger een herhaalde aflevering herkent'
          DutchName: eventId
        status:
          enum:
          - ontvangen
          - gestart
          - afgekeurd
          - ingericht
          - nietIngericht
          - verwerkt
          - nietVerwerkt
          $comment: ontvangen en gestart melden de aanname, afgekeurd een validatiefout op het bericht,
            ingericht en nietIngericht de uitkomst van het inrichten. Interactie S4 noemt deze vijf; de
            acceptatietoets bij een nieuwe versie voegt verwerkt en nietVerwerkt toe
          DutchName: status
        offeringReference:
          $ref: '#/components/schemas/offering-reference'
          $comment: 'voorstel: het aanbod waarover de melding gaat. processing-status/alfa draagt programmeOfferingId
            (opleidingsaanbodId) als losse sleutel en sleutelt op de specificatie'
          DutchName: aanbodVerwijzing
        specificationReference:
          $ref: '#/components/schemas/specification-reference'
          $comment: de specificatie-id en versie die de dienstpagina van de onderwijscatalogus in deze
            payload vraagt, en die processing-status/alfa verplicht
          DutchName: specificatieVerwijzing
        arrangementReference:
          type: string
          format: uuid
          $comment: 'voorstel: de referentie naar de inrichting bij de afnemer, die de dienstpagina van
            de onderwijscatalogus op dit meldpatroon vraagt. De kernregistratie kent haar toe bij het
            inrichten'
          DutchName: inrichtingReferentie
        reason:
          type: string
          $comment: 'voorstel: de reden achter afgekeurd, nietIngericht en nietVerwerkt, in leesbare tekst
            voor de beheerder van de catalogus'
          DutchName: reden
      additionalProperties: false
      allOf:
      - $comment: een uitkomst die inrichting meldt, draagt de referentie naar die inrichting
        if:
          properties:
            status:
              enum:
              - ingericht
              - verwerkt
          required:
          - status
        then:
          required:
          - arrangementReference
      - $comment: een uitkomst die afwijzing meldt, draagt de reden
        if:
          properties:
            status:
              enum:
              - afgekeurd
              - nietIngericht
              - nietVerwerkt
          required:
          - status
        then:
          required:
          - reason
    code:
      title: Code
      DutchName: Code
      $comment: Alfa en indicatief. Externe identificatie, bijvoorbeeld een vestigingscode. Deze vorm
        onderbouwt welke velden het koppelvlak nodig heeft en kan wijzigen zolang de payload niet is vastgesteld.
      type: object
      properties:
        codeType:
          type: string
          DutchName: codeType
        code:
          type: string
          DutchName: code
    education-offering-delta:
      title: Education offering delta
      DutchName: Onderwijsaanbod-delta
      $comment: Voorstel. Het label voorstel in de $id houdt dit schema apart van de alfa-schema's die
        Npuls-OKx/Public draagt; werkbrief W7 van IS-OA-05 laat het daar landen. JSON Patch (RFC 6902)
        tussen twee versies van een aanbodstructuur, de deltavorm die U11 naast de volledige structuur
        vraagt. RFC 6902 is de normatieve definitie van de operatievorm, dit schema legt vast dat de respons
        daaraan voldoet. De vorm volgt education-specification-delta/alfa.
      type: array
      items:
        type: object
        required:
        - op
        - path
        properties:
          op:
            enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
            DutchName: op
          path:
            type: string
            DutchName: path
          from:
            type: string
            DutchName: from
          value:
            DutchName: value
    education-specification:
      title: Education specification
      DutchName: Onderwijsspecificatie
      $comment: Alfa en indicatief. Deze vorm onderbouwt welke velden het koppelvlak nodig heeft en kan
        wijzigen zolang de payload niet is vastgesteld.
      type: object
      required:
      - educationSpecifications
      $comment_required: Alleen onderwijsspecificaties is altijd aanwezig. Of leeruitkomsten en regelsets
        meekomen bepaalt het gebruiksprofiel van de koppeling; binnen onderwijscatalogus naar planning
        en roostering blijven leeruitkomsten weg ([ADR 0023](../../Referentiemateriaal/adr/0023-leeruitkomsten-als-opaque-sleutels-in-koppeling-oc-p-en-r.md)).
      properties:
        learningOutcomes:
          type: array
          items:
            $ref: '#/components/schemas/learning-outcome'
          DutchName: leeruitkomsten
        educationSpecifications:
          type: array
          items:
            type: object
            required:
            - id
            - specificationType
            - version
            - parentSpecificationId
            - name
            - studyLoad
            properties:
              id:
                type: string
                format: uuid
                DutchName: id
              specificationType:
                enum:
                - opleidingsspecificatie
                - opleidingsprogrammaspecificatie
                - onderwijseenheidspecificatie
                - leeronderdeelspecificatie
                - keuzedeelruimtespecificatie
                - toetsonderdeelspecificatie
                - examenplanspecificatie
                - resultaateenheidspecificatie
                DutchName: specificatieType
              version:
                type: string
                pattern: ^\d+\.\d+\.\d+$
                DutchName: versie
              parentSpecificationId:
                type:
                - string
                - 'null'
                format: uuid
                DutchName: bovenliggendSpecificatieId
              learningOutcomeId:
                type: string
                format: uuid
                DutchName: leeruitkomstId
              name:
                type: string
                DutchName: naam
              description:
                type: string
                DutchName: omschrijving
              status:
                enum:
                - concept
                - vastgesteld
                - gepubliceerd
                - gedeactiveerd
                - vervallen
                - gearchiveerd
                DutchName: status
              studyLoad:
                $ref: '#/components/schemas/volume'
                DutchName: studielast
              curriculumType:
                enum:
                - nominaal
                - hybride
                - flexibel
                DutchName: curriculumtype
              programmeType:
                type: string
                $comment: 'open lijst: diplomaprogramma, keuzedeelprogramma, certificaatprogramma'
                DutchName: programmatype
              programmeLayer:
                enum:
                - leerweg
                - doelgroep
                DutchName: programmaLaag
              learningPathway:
                enum:
                - BOL
                - BBL
                DutchName: leerweg
              targetGroup:
                type: string
                $comment: 'open lijst: regulier, zijinstromer, hybride, organisatiespecifiek'
                DutchName: doelgroep
              electiveUnitClass:
                type: string
                $comment: 'open lijst: algemeen-verbredend, beroepsspecifiek-verdiepend'
                DutchName: keuzedeelKlasse
              organisation:
                $ref: '#/components/schemas/organisation-unit'
                $comment: de organisatie waarvoor deze variant geldt, bijvoorbeeld een leerbedrijf
                DutchName: organisatie
              cohort:
                type: string
                DutchName: cohort
              startDate:
                type: string
                format: date
                DutchName: startdatum
              validFrom:
                type: string
                format: date
                DutchName: geldigVanaf
              validUntil:
                type:
                - string
                - 'null'
                format: date
                DutchName: geldigTot
              timeDistribution:
                type: string
                $comment: 'open lijst: BOT (begeleide onderwijstijd), OOT (overige onderwijstijd), BPV'
                DutchName: tijdsverdeling
              explanation:
                type: string
                DutchName: toelichting
              ruleSetReferences:
                type: array
                items:
                  type: string
                  format: uuid
                DutchName: regelsetVerwijzingen
              manifest:
                type: array
                items:
                  $ref: '#/components/schemas/manifest-item'
                DutchName: manifest
          DutchName: onderwijsspecificaties
        ruleSets:
          type: array
          items:
            $ref: '#/components/schemas/rule-set'
          DutchName: regelsets
    education-specification-delta:
      title: Education specification delta
      DutchName: Onderwijsspecificatie-delta
      $comment: Alfa en indicatief. JSON Patch (RFC 6902) tussen twee versies van de onderwijsspecificatiestructuur;
        RFC 6902 is de normatieve definitie van de operatievorm, dit schema legt vast dat de respons daaraan
        voldoet.
      type: array
      items:
        type: object
        required:
        - op
        - path
        properties:
          op:
            enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
            DutchName: op
          path:
            type: string
            DutchName: path
          from:
            type: string
            DutchName: from
          value:
            DutchName: value
    geolocation:
      title: Geolocation
      DutchName: Geolocatie
      $comment: Alfa en indicatief. Deze vorm onderbouwt welke velden het koppelvlak nodig heeft en kan
        wijzigen zolang de payload niet is vastgesteld.
      type: object
      properties:
        latitude:
          type: number
          DutchName: breedtegraad
        longitude:
          type: number
          DutchName: lengtegraad
    intake-finding:
      title: Intake finding
      DutchName: Innamebevinding
      $comment: Voorstel vanuit de interactiespecificatie onderwijsaanbod, eenheid IS-OA-01. Een bevinding
        zegt op welke grond de onderwijscatalogus een aanlevering afkeurt. De vorm volgt bottleneck/alfa,
        de codelijst volgt de invarianten uit regels.md.
      type: object
      required:
      - code
      - description
      properties:
        code:
          DutchName: code
          enum:
          - vormFout
          - studielastTeltNietOp
          - leeruitkomstOnbekend
          - ouderOnbekend
          - verwijzingOnbekend
          - manifestMismatch
          - versieConflict
          - statusNietVastgesteld
        description:
          type: string
          DutchName: omschrijving
        location:
          type: string
          DutchName: locatie
          $comment: JSON Pointer (RFC 6901) naar het element in de aangeleverde lading, bijvoorbeeld /educationSpecifications/3/studyLoad
        involvedSpecificationIds:
          type: array
          items:
            type: string
            format: uuid
          DutchName: betrokkenSpecificatieIds
        expectedValue:
          type: string
          DutchName: verwachteWaarde
        foundValue:
          type: string
          DutchName: aangetroffenWaarde
    intake-outcome:
      title: Intake outcome
      DutchName: Innameuitkomst
      $comment: 'Voorstel vanuit de interactiespecificatie onderwijsaanbod, eenheid IS-OA-01. De toestand
        van een levering, als antwoord op de aanlevering (HTTP 202), als melding verwerkingsstatus en
        als opvraag op /leveringen/{leveringId}. Dit is processing-status/alfa met twee sleutels erbij:
        leveringId voor de correlatie en bevindingen voor de grond bij een afkeuring. Elk document dat
        tegen dit schema valideert en een specificatieVerwijzing draagt, valideert ook tegen processing-status/alfa.
        Waar de meldingen van de andere eenheden hun reden als leesbare tekst dragen, draagt de inname
        haar grond als bevinding met een code. Verwijzingen naar andere schema''s gaan via hun $id.'
      type: object
      required:
      - deliveryId
      - status
      properties:
        deliveryId:
          type: string
          format: uuid
          $comment: de onderwijscatalogus kent dit id toe bij aanname en houdt het stabiel over elke uitkomst
            van dezelfde levering
          DutchName: leveringId
        status:
          enum:
          - ontvangen
          - gestart
          - afgekeurd
          - gelukt
          - nietGelukt
          DutchName: status
        specificationReference:
          $ref: '#/components/schemas/specification-reference'
          $comment: de identiteit en de versie die de onderwijscatalogus aan de opgenomen wortel toekent
          DutchName: specificatieVerwijzing
        findings:
          type: array
          items:
            $ref: '#/components/schemas/intake-finding'
          $comment: gevuld bij afgekeurd en bij nietGelukt
          DutchName: bevindingen
        eventId:
          type: string
          format: uuid
          $comment: stabiel per melding, waarop de ontvanger een herhaald bericht herkent
          DutchName: eventId
      allOf:
      - $comment: op gelukt staat de toegekende identiteit en versie in de uitkomst
        if:
          type: object
          required:
          - status
          properties:
            status:
              const: gelukt
        then:
          required:
          - specificationReference
      - $comment: een afkeuring draagt haar grond
        if:
          type: object
          required:
          - status
          properties:
            status:
              enum:
              - afgekeurd
              - nietGelukt
        then:
          required:
          - findings
          properties:
            findings:
              minItems: 1
    intake-rejection:
      title: Intake rejection
      DutchName: Innameafkeuring
      $comment: 'Voorstel vanuit de interactiespecificatie onderwijsaanbod, eenheid IS-OA-01. Het antwoordlichaam
        waarmee de onderwijscatalogus een aanlevering bij de poort houdt (HTTP 400, 404 of 409): er komt
        geen levering en de aanleverende partij herstelt de lading. Een afkeuring na aanname komt als
        innameuitkomst met status afgekeurd. Verwijzingen naar andere schema''s gaan via hun $id.'
      type: object
      required:
      - findings
      properties:
        findings:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/intake-finding'
          DutchName: bevindingen
        specificationReference:
          $ref: '#/components/schemas/specification-reference'
          $comment: de wortel van de aangeleverde lading, zodra die te lezen is
          DutchName: specificatieVerwijzing
    learning-outcome:
      title: Learning outcome
      DutchName: Leeruitkomst
      $comment: Alfa en indicatief. Deze vorm onderbouwt welke velden het koppelvlak nodig heeft en kan
