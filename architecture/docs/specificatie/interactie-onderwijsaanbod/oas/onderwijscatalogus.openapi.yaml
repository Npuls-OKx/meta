    waarheid. De vervolgstap laat de operatietabel uit dit bestand komen, zoals het OpenAPI-document er
    nu uit komt. Relateert aan: #374'
  dekking: 'De stromen IS-OA-01, IS-OA-03 en IS-OA-05 staan er volledig in: samen vormen zij het koppelvlak
    van de onderwijscatalogus. IS-OA-02, IS-OA-04 en IS-OA-06 staan er nog niet in, en daarmee zijn de
    drie andere componenten onvolledig.'
