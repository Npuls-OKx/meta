<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 910" width="1015" height="910"><rect x="0.5" y="0.5" width="1014" height="909" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">C-01 - Van expertise naar vlekkenplan</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="319" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(439,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Ruimte beleggen bij een domein</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="251" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(269,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Persoon</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Nienke, docent</text><rect x="54" y="154" width="227" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(259,159)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="172" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Expertise</text><text x="64" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">verpleegkundige zorg</text><rect x="347" y="112" width="328" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(653,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="357" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Organisatie-eenheid</text><text x="357" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">domein Gezondheid en Verzorging</text><rect x="347" y="188" width="301" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(626,193)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="357" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="357" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Farmaceutische patientenzorg</text><rect x="347" y="264" width="208" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(533,269)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="357" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijsvorm</text><text x="357" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieonderwijs</text><rect x="347" y="340" width="264" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(589,345)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="357" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Lokaaltype</text><text x="357" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatielokaal apotheek</text><rect x="347" y="416" width="153" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(478,421)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="357" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Ruimte</text><text x="357" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">lokaal B-214</text><rect x="347" y="492" width="199" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(524,497)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="357" y="510" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Locatie</text><text x="357" y="528" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vestiging Heerlen</text><rect x="347" y="568" width="258" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(583,573)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="357" y="586" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Ruimte</text><text x="357" y="604" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">lokaal B-215</text><text x="357" y="621" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is ook van het type Lokaaltype</text><rect x="347" y="661" width="190" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(515,666)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="357" y="679" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Locatie</text><text x="357" y="697" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vestiging Veghel</text><rect x="347" y="737" width="412" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(736,742)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="357" y="755" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Vlekkenplan</text><text x="357" y="773" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vlek Zorg: B-214 Heerlen en B-215 Veghel</text><text x="357" y="790" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is de verzameling van beide als Ruimte</text><text x="357" y="807" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toegewezen aan het domein als Organisatie-eenheid</text><path d="M291 136H347" stroke="#444" stroke-width="1.3" fill="none"/><path d="M347 136l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="319" y="131" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="middle">bestaat uit</text><path d="M407 160V188" stroke="#444" stroke-width="1.3" fill="none"/><path d="M407 188l-4 -8h8z" fill="#444"/><text x="415" y="178" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voert uit</text><path d="M407 236V264" stroke="#444" stroke-width="1.3" fill="none"/><path d="M407 264l-4 -8h8z" fill="#444"/><text x="415" y="254" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">gebruikt</text><path d="M407 312V340" stroke="#444" stroke-width="1.3" fill="none"/><path d="M407 340l-4 -8h8z" fill="#444"/><text x="415" y="330" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">vraagt</text><path d="M407 388V416" stroke="#444" stroke-width="1.3" fill="none"/><path d="M407 388l-4 8h8z" fill="#444"/><text x="415" y="406" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">is van het type</text><path d="M407 464V492" stroke="#444" stroke-width="1.3" fill="none"/><path d="M407 492l-4 -8h8z" fill="#444"/><text x="415" y="482" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">bevindt zich op</text><path d="M407 633V661" stroke="#444" stroke-width="1.3" fill="none"/><path d="M407 661l-4 -8h8z" fill="#444"/><text x="415" y="651" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">bevindt zich op</text><text x="12" y="841" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Een persoon draagt een expertise; die bepaalt onder welk domein zij valt. Het domein voert de onderwijsuitvoering van</text><text x="12" y="860" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">specificaties uit, die een onderwijsvorm gebruiken. Die vorm vraagt een lokaaltype, en daarmee ligt vast welke ruimtes</text><text x="12" y="879" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het domein nodig heeft. Die ruimtes staan op meerdere locaties; de verzameling die aan het domein wordt toegewezen is</text><text x="12" y="898" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het vlekkenplan.</text></svg>