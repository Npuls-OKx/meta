<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1020" width="1024" height="1020"><rect x="0.5" y="0.5" width="1023" height="1019" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">C-01 - Van expertise naar vlekkenplan</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="319" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(439,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Ruimte beleggen bij een domein</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="301" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(319,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Farmaceutische patientenzorg</text><rect x="397" y="112" width="393" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(768,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="407" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Expertise</text><text x="407" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">verpleegkundige zorg, gevraagd profiel</text><rect x="397" y="188" width="171" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(546,193)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="407" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Persoon</text><text x="407" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Nienke, docent</text><rect x="397" y="264" width="373" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(748,269)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="407" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Organisatie-eenheid</text><text x="407" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">domein Gezondheid en Verzorging</text><text x="407" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">voert daarom uit Onderwijseenheid specificatie</text><rect x="397" y="357" width="352" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(726,362)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="407" y="375" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijsvorm</text><text x="407" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieonderwijs</text><text x="407" y="410" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie gebruikt deze</text><rect x="397" y="450" width="264" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(638,455)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="407" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Lokaaltype</text><text x="407" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatielokaal apotheek</text><rect x="397" y="526" width="153" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(528,531)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="407" y="544" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Ruimte</text><text x="407" y="562" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">lokaal B-214</text><rect x="397" y="602" width="199" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(574,607)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="407" y="620" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Locatie</text><text x="407" y="638" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vestiging Heerlen</text><rect x="397" y="678" width="258" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(633,683)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="407" y="696" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Ruimte</text><text x="407" y="714" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">lokaal B-215</text><text x="407" y="731" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is ook van het type Lokaaltype</text><rect x="397" y="771" width="190" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(565,776)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="407" y="789" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Locatie</text><text x="407" y="807" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vestiging Veghel</text><rect x="397" y="847" width="412" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(786,852)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="407" y="865" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Vlekkenplan</text><text x="407" y="883" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vlek Zorg: B-214 Heerlen en B-215 Veghel</text><text x="407" y="900" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is de verzameling van beide als Ruimte</text><text x="407" y="917" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toegewezen aan het domein als Organisatie-eenheid</text><path d="M341 136H397" stroke="#444" stroke-width="1.3" fill="none"/><path d="M397 136l-8 -4v8z" fill="#444"/><text x="369" y="131" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="middle">vraagt</text><path d="M457 160V188" stroke="#444" stroke-width="1.3" fill="none"/><path d="M457 160l-4 8h8z" fill="#444"/><text x="465" y="178" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">heeft</text><path d="M457 236V264" stroke="#444" stroke-width="1.3" fill="none"/><path d="M457 264l-5 -7l5 -7l5 7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="465" y="254" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">bestaat uit</text><path d="M457 422V450" stroke="#444" stroke-width="1.3" fill="none"/><path d="M457 450l-4 -8h8z" fill="#444"/><text x="465" y="440" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">vraagt</text><path d="M457 498V526" stroke="#444" stroke-width="1.3" fill="none"/><path d="M457 498l-4 8h8z" fill="#444"/><text x="465" y="516" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">is van het type</text><path d="M457 574V602" stroke="#444" stroke-width="1.3" fill="none"/><path d="M457 602l-4 -8h8z" fill="#444"/><text x="465" y="592" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">bevindt zich op</text><path d="M457 743V771" stroke="#444" stroke-width="1.3" fill="none"/><path d="M457 771l-4 -8h8z" fill="#444"/><text x="465" y="761" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">bevindt zich op</text><text x="12" y="951" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Een specificatie vraagt een competentieprofiel: de expertise die een docent ervoor moet hebben. Een domein groepeert</text><text x="12" y="970" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">juist de mensen met die expertise, en voert de specificatie daarom uit. De specificatie gebruikt ook een onderwijsvorm,</text><text x="12" y="989" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">die een lokaaltype vraagt; daarmee ligt vast welke ruimtes het domein nodig heeft. Die ruimtes staan verspreid over</text><text x="12" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">locaties, en de verzameling die aan het domein wordt toegewezen is het vlekkenplan.</text></svg>