ill="#5a5a2a" text-anchor="start">Organisatie-eenheid</text><text x="527" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">domein Gezondheid en Verzorging</text><text x="527" y="241" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">bevat ook een Organisatie-eenheid</text><rect x="517" y="281" width="195" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(690,286)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="527" y="299" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Expertise</text><text x="527" y="317" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">rekenen</text><rect x="531" y="323" width="171" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(680,328)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="541" y="341" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Vaardigheid</text><text x="541" y="359" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">rekendidactiek</text><rect x="517" y="409" width="120" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(615,414)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="527" y="427" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Expertise</text><text x="527" y="445" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">techniek</text><rect x="517" y="485" width="308" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(803,490)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="527" y="503" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Persoon</text><text x="527" y="521" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Youssef, docent</text><text x="527" y="538" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">heeft daarnaast rekenen als Expertise</text><rect x="517" y="578" width="287" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(782,583)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="527" y="596" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Organisatie-eenheid</text><text x="527" y="614" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">team Generieke vakken</text><text x="527" y="631" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">groepeert op rekenen als Expertise</text><rect x="517" y="671" width="294" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(789,676)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="527" y="689" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Organisatie-eenheid</text><text x="527" y="707" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">domein Techniek</text><text x="527" y="724" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">bestaat ook uit Youssef als Persoon</text><text x="527" y="741" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">groepeert op techniek als Expertise</text><rect x="517" y="781" width="481" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(976,786)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="527" y="799" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="527" y="817" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Rekenen voor verpleegkundigen</text><text x="527" y="834" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Organisatie-eenheid domein Gezondheid en Verzorging voert uit</text><text x="527" y="851" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Persoon Youssef geeft deze, zonder bij dat domein te horen</text><path d="M461 136H517" stroke="#444" stroke-width="1.3" fill="none"/><path d="M461 136l8 -4v8z" fill="#444"/><text x="489" y="131" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="middle">heeft</text><path d="M577 160V188" stroke="#444" stroke-width="1.3" fill="none"/><path d="M577 188l-5 -7l5 -7l5 7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="585" y="178" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">bestaat uit</text><path d="M577 457V485" stroke="#444" stroke-width="1.3" fill="none"/><path d="M577 457l-4 8h8z" fill="#444"/><text x="585" y="475" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">heeft</text><path d="M577 550V578" stroke="#444" stroke-width="1.3" fill="none"/><path d="M577 578l-5 -7l5 -7l5 7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="585" y="568" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">bestaat uit</text><text x="12" y="885" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Een expertise bundelt vaardigheden en skills die het model al kent. Nienke draagt er een en hoort bij een eenheid.</text><text x="12" y="904" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Youssef draagt rekenen en techniek, en hoort daarmee bij twee eenheden; met zijn rekenexpertise geeft hij les binnen</text><text x="12" y="923" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het domein Zorg, waar hij zelf niet onder valt. Een eenheid kan eenheden bevatten, en bestaat op elk niveau uit</text><text x="12" y="942" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">personen.</text></svg>