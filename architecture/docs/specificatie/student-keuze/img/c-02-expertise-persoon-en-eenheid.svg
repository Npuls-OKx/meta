ent. Een persoon kan meerdere expertises dragen en valt</text><text x="12" y="753" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">daarmee onder meerdere eenheden. Een eenheid kan eenheden bevatten, en bestaat op elk niveau uit personen.</text></svg>