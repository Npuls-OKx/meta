<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1005 458" width="1005" height="458"><rect x="0.5" y="0.5" width="1004" height="457" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-02 - Examenplan, eerste resultaatstructuur en cohort</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="227" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(435,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examenplan opstellen</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="439" height="48" rx="0" fill="#e8e8e8" stroke="#9a9a9a" stroke-dasharray="5 3"/><g transform="translate(457,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Examenplan</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examenplan Apothekersassistent, cohort 2026</text><rect x="535" y="112" width="439" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(953,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="545" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatieve resultaat structuur</text><text x="545" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Eerste opzet: kerntaken en keuzedelen, alle</text><text x="545" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">voldoende</text><rect x="535" y="206" width="157" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(671,211)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="545" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Cohort / periode</text><text x="545" y="242" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Cohort 2026</text><rect x="535" y="282" width="458" height="66" rx="0" fill="#e8e8e8" stroke="#9a9a9a" stroke-dasharray="5 3"/><g transform="translate(971,287)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="545" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Examenplan</text><text x="545" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeeleis: 720 SBU, waarvan een verdiepend</text><text x="545" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">keuzedeel</text><path d="M479 136H535" stroke="#444" stroke-width="1.3" fill="none"/><path d="M535 136l-8 -4v8z" fill="#444"/><text x="507" y="131" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="middle">kent</text><path d="M595 178V206" stroke="#444" stroke-width="1.3" fill="none"/><path d="M595 178l-4 8h8z" fill="#444"/><text x="603" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Groepeert Studenten op toepasbare</text><text x="12" y="370" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De onderwijsontwerper ontwikkelt het examenplan en de eerste resultaatstructuur; de examencommissie stelt ze vast.</text><text x="12" y="389" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het examenplan draagt ook de keuzedeeleis: hoeveel keuzedeel de student moet doen en van welk type. In de praktijk</text><text x="12" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">wijzigt een vastgesteld examenplan soms nog voor de start van het schooljaar, omdat het beheer van het</text><text x="12" y="427" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">studentvolgsysteem de aangeboden structuur of de zak-slaagregeling niet kan verwerken. Idealiter bewaakt de</text><text x="12" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">catalogus dat voordat de structuur naar het volgsysteem gaat.</text></svg>