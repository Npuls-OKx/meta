<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1756 156" width="1756" height="156"><rect x="0.5" y="0.5" width="1755" height="155" rx="10" fill="#ffffff" stroke="#d8ddda"/><rect x="12" y="10" width="196" height="46" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(186,15)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="27" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="218" y="10" width="454" height="46" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(650,15)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="228" y="27" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a5a2a" text-anchor="start">processtap</text><text x="228" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwalificatiedossier vertalen naar leeruitkomsten</text><text x="678" y="40" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5b6663" text-anchor="start">→</text><rect x="698" y="10" width="915" height="112" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(1592,15)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="708" y="27" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="708" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Biedt farmaceutische patiëntenzorg in een levensechte apotheekomgeving (kerntaakniveau)</text><rect x="712" y="66" width="891" height="46" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(1582,71)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="722" y="83" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="1576" y="83" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="end">R1-009</text><text x="722" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert baliegesprek en triage uit in de simulatieapotheek, onderbouwd met theorie (werkprocesniveau)</text><text x="1586" y="27" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="end">R1-008</text><text x="708" y="60" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Kerntaak Wordt vertaald naar</text><text x="12" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Het dossier zegt wat de beroepsbeoefenaar kan; de leeruitkomst is de invulling van de instelling: waar en hoe de student dat laat zien. Hier: leren door te simuleren in een levensechte omgeving, met een klein deel theorie.</text></svg>