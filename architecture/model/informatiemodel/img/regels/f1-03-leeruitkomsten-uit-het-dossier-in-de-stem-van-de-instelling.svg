<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1033 282" width="1033" height="282"><rect x="0.5" y="0.5" width="1032" height="281" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-03 - Leeruitkomsten uit het dossier, in de stem van de instelling</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="486" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(694,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwalificatiedossier vertalen naar leeruitkomsten</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="981" height="117" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(999,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Biedt farmaceutische patiëntenzorg in een levensechte apotheekomgeving (kerntaakniveau)</text><rect x="54" y="171" width="957" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(989,176)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="64" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert baliegesprek en triage uit in de simulatieapotheek, onderbouwd met theorie (werkprocesniveau)</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Kerntaak Wordt vertaald naar</text><text x="12" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het dossier zegt wat de beroepsbeoefenaar kan; de leeruitkomst is de invulling van de instelling: waar en hoe de student</text><text x="12" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">dat laat zien. Hier: leren door te simuleren in een levensechte omgeving, met een klein deel theorie.</text></svg>