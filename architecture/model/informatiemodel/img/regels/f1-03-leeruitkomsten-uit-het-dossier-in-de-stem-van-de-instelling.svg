<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 697 763" width="697" height="763"><rect x="0.5" y="0.5" width="696" height="762" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-03 - Leeruitkomsten uit het dossier, in de stem van de instelling</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="347" height="66" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(555,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwalificatiedossier vertalen naar</text><text x="240" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">leeruitkomsten</text><path d="M64 106 V126" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 120 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="130" width="592" height="278" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(610,135)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><rect x="54" y="261" width="568" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(600,266)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="279" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="64" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert een baliegesprek met triage uit, volgens</text><text x="64" y="315" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">het triageprotocol en met een onderbouwd</text><text x="64" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">advies of doorverwijzing, in de</text><text x="64" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieapotheek (apothekersassistent NLQF 4,</text><text x="64" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkproces B1-K1-W1)</text><text x="64" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Werkproces Wordt vertaald naar: B1-K1-W1 Voert baliegesprek en triage uit</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Verleent farmaceutische patiëntenzorg, volgens</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">de vigerende protocollen en met navolgbare</text><text x="50" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vastlegging, in een levensechte</text><text x="50" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">apotheekomgeving (apothekersassistent NLQF 4,</text><text x="50" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kerntaak B1-K1)</text><text x="50" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Kerntaak Wordt vertaald naar</text><rect x="40" y="436" width="458" height="84" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(476,441)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="454" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijskundige taxonomie</text><text x="50" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Romiszowski: de kerntaakuitkomst is cognitief</text><text x="50" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">en productief, de werkprocesuitkomsten volgen</text><text x="50" y="508" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">een protocol en zijn reproductief</text><path d="M100 408V436" stroke="#444" stroke-width="1.3" fill="none"/><text x="12" y="542" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het dossier zegt wat de beroepsbeoefenaar kan; de leeruitkomst is de</text><text x="12" y="561" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">invulling van de instelling: waar en hoe de student dat laat zien. De</text><text x="12" y="580" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">kerntaak levert de leeruitkomst op kerntaakniveau, elk werkproces een</text><text x="12" y="599" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeruitkomst eronder: een gelaagde structuur. De instelling formuleert</text><text x="12" y="618" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">elke leeruitkomst met vijf vaste onderdelen: een actief werkwoord, het</text><text x="12" y="637" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">type waarvoor zij geldt, het onderwerp, de standaard waaraan het moet</text><text x="12" y="656" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">voldoen en de context waarin de student het laat zien. De standaard</text><text x="12" y="675" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">draagt wat de instelling zelf belangrijk vindt en maakt de leeruitkomst</text><text x="12" y="694" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">toetsbaar. Daarna plaatst de instelling haar in een onderwijskundige</text><text x="12" y="713" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">taxonomie, zodat het niveau van het handelen vastligt naast het</text><text x="12" y="732" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">NLQF-niveau van de kwalificatie. De plaat kent die taxonomie nog niet;</text><text x="12" y="751" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">zij staat hier gestippeld.</text></svg>