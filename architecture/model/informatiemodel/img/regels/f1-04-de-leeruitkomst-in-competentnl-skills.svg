<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 589 828" width="589" height="828"><rect x="0.5" y="0.5" width="588" height="827" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-04 - De leeruitkomst in CompetentNL-skills</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="347" height="83" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(555,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwalificatiedossier vertalen naar</text><text x="240" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">leeruitkomsten</text><text x="240" y="111" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: leeruitkomst naar skills</text><path d="M64 123 V143" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 137 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="147" width="491" height="278" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(509,152)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><rect x="54" y="278" width="467" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(499,283)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="296" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="64" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert een baliegesprek met triage uit, volgens</text><text x="64" y="332" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">het triageprotocol en met een onderbouwd</text><text x="64" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">advies of doorverwijzing, in de</text><text x="64" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieapotheek (apothekersassistent NLQF 4,</text><text x="64" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkproces B1-K1-W1)</text><text x="64" y="403" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: vertaald naar skills</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Verleent farmaceutische patiëntenzorg, volgens</text><text x="50" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">de vigerende protocollen en met navolgbare</text><text x="50" y="219" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vastlegging, in een levensechte</text><text x="50" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">apotheekomgeving (apothekersassistent NLQF 4,</text><text x="50" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kerntaak B1-K1)</text><text x="50" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: vertaald naar skills</text><rect x="40" y="453" width="482" height="284" rx="0" fill="#e8e8e8" stroke="#9a9a9a" stroke-dasharray="5 3"/><g transform="translate(500,458)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="471" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Competenties / Skills</text><rect x="54" y="513" width="458" height="66" rx="0" fill="#e8e8e8" stroke="#9a9a9a" stroke-dasharray="5 3"/><g transform="translate(490,518)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="531" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Vaardigheid</text><text x="64" y="549" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Communicatieve vaardigheden (CompetentNL laag</text><text x="64" y="567" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">2)</text><rect x="54" y="587" width="458" height="66" rx="0" fill="#e8e8e8" stroke="#9a9a9a" stroke-dasharray="5 3"/><g transform="translate(490,592)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="605" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Kennis</text><text x="64" y="623" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Farmacie (CompetentNL kennisgebied op ISCED-F</text><text x="64" y="641" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">0916)</text><rect x="54" y="661" width="458" height="66" rx="0" fill="#e8e8e8" stroke="#9a9a9a" stroke-dasharray="5 3"/><g transform="translate(490,666)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="679" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Inzicht</text><text x="64" y="697" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Werking en risico van een geneesmiddel bij de</text><text x="64" y="715" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vraag aan de balie</text><text x="50" y="489" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Vaardigheden bij deze leeruitkomst</text><text x="50" y="507" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">(CompetentNL)</text><path d="M100 425V453" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 453l-6 -10h12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="12" y="759" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Verdieping: dezelfde leeruitkomst in CompetentNL-termen:</text><text x="12" y="778" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">vaardigheden in drie lagen (hier laag 2), kennisgebieden op</text><text x="12" y="797" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">ISCED-F, en het inzicht dat de plaat apart benoemt. Hoe</text><text x="12" y="816" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">fijnmaziger, hoe scherper wat Jochem moet leren.</text></svg>