h d="M2 6.5h12"/></g><text x="50" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><text x="50" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="222" width="846" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(864,227)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Biedt farmaceutische patiëntenzorg in een levensechte apotheekomgeving (kerntaakniveau)</text><text x="50" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="315" width="957" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(975,320)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="333" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert baliegesprek en triage uit in de simulatieapotheek, onderbouwd met theorie (werkprocesniveau)</text><text x="50" y="368" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="408" width="632" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(650,413)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101</text><text x="50" y="461" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="478" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie bevat: Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><rect x="40" y="518" width="632" height="99" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(650,523)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="536" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Triage: theorie en protocollen</text><text x="50" y="571" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="588" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst</text><text x="50" y="605" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie bevat: Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><rect x="40" y="645" width="809" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(827,650)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="663" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="681" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert medicatiebewaking uit onder begeleiding in de leerapotheek (werkprocesniveau)</text><text x="50" y="698" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="715" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">bevat Leeruitkomst</text><rect x="40" y="755" width="632" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(650,760)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="773" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="791" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking in de leerapotheek</text><text x="50" y="808" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="825" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie bevat: Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><path d="M100 194V222" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 287V315" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 287l-5 7l5 7l5 -7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M100 380V408" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 727V755" stroke="#444" stroke-width="1.3" fill="none"/><text x="12" y="859" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Verdieping: de leeruitkomst zit niet in de eenheid, zij staat ernaast. De onderwijseenheid draagt de toetsbare</text><text x="12" y="878" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">uitkomsten, de leeronderdelen dragen het onderwijskundige antwoord op hoe de student daar komt. Die twee verdiepingen</text><text x="12" y="897" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lopen niet gelijk op: een werkproces is een summatieve verdieping van een kerntaak, een leeronderdeel een</text><text x="12" y="916" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">ontwikkelingsgerichte. Daarom hangen hier twee leeronderdelen aan een werkproces-leeruitkomst, en draagt geen</text><text x="12" y="935" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeronderdeel een werkproces-code als naam.</text></svg>