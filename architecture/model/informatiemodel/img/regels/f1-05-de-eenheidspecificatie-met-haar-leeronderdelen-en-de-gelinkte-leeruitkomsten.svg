<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 1219" width="856" height="1219"><rect x="0.5" y="0.5" width="855" height="1218" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-05 - De eenheidspecificatie met haar leeronderdelen en de gelinkte leeruitkomsten</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="438" height="83" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(646,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwalificatiedossier vertalen naar</text><text x="240" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">leeruitkomsten</text><text x="240" y="111" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: van kerntaak naar eenheid en leeronderdelen</text><path d="M64 123 V143" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 137 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="147" width="458" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,152)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><text x="50" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="240" width="467" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(485,245)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Verleent farmaceutische patiëntenzorg, volgens</text><text x="50" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">de vigerende protocollen en met navolgbare</text><text x="50" y="312" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vastlegging, in een levensechte</text><text x="50" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">apotheekomgeving (apothekersassistent NLQF 4,</text><text x="50" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kerntaak B1-K1)</text><text x="50" y="365" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="405" width="467" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(485,410)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="423" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="441" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert een baliegesprek met triage uit, volgens</text><text x="50" y="459" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">het triageprotocol en met een onderbouwd</text><text x="50" y="477" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">advies of doorverwijzing, in de</text><text x="50" y="495" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieapotheek (apothekersassistent NLQF 4,</text><text x="50" y="513" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkproces B1-K1-W1)</text><text x="50" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="570" width="632" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(650,575)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="588" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101</text><text x="50" y="623" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="640" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie bevat: Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><rect x="40" y="680" width="632" height="99" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(650,685)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="698" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="716" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Triage: theorie en protocollen</text><text x="50" y="733" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="750" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst</text><text x="50" y="767" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie bevat: Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><rect x="40" y="807" width="467" height="154" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(485,812)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="825" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="843" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert medicatiebewaking uit op signalen uit</text><text x="50" y="861" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">het apotheeksysteem, volgens het</text><text x="50" y="879" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">bewakingsprotocol en met overleg bij twijfel,</text><text x="50" y="897" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">in de leerapotheek onder begeleiding</text><text x="50" y="915" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">(apothekersassistent NLQF 4, werkprocesniveau)</text><text x="50" y="932" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="949" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">bevat Leeruitkomst</text><rect x="40" y="989" width="632" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(650,994)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="1025" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking in de leerapotheek</text><text x="50" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="1059" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie bevat: Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><path d="M100 212V240" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 377V405" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 377l-5 7l5 7l5 -7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M100 542V570" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 961V989" stroke="#444" stroke-width="1.3" fill="none"/><text x="12" y="1093" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Verdieping: de leeruitkomst zit niet in de eenheid, zij staat ernaast. De</text><text x="12" y="1112" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">onderwijseenheid draagt de toetsbare uitkomsten, de leeronderdelen dragen het</text><text x="12" y="1131" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">onderwijskundige antwoord op hoe de student daar komt. Die twee verdiepingen</text><text x="12" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lopen niet gelijk op: een werkproces is een summatieve verdieping van een</text><text x="12" y="1169" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">kerntaak, een leeronderdeel een ontwikkelingsgerichte. Daarom hangen hier twee</text><text x="12" y="1188" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeronderdelen aan een werkproces-leeruitkomst, en draagt geen leeronderdeel</text><text x="12" y="1207" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">een werkproces-code als naam.</text></svg>