<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 1153" width="856" height="1153"><rect x="0.5" y="0.5" width="855" height="1152" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-05 - De eenheidspecificatie met haar leeronderdelen en de gelinkte leeruitkomsten</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="438" height="83" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(646,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwalificatiedossier vertalen naar</text><text x="240" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">leeruitkomsten</text><text x="240" y="111" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: van kerntaak naar eenheid en leeronderdelen</text><path d="M64 123 V143" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 137 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="147" width="458" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,152)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><text x="50" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="240" width="467" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(485,245)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Verleent farmaceutische patiëntenzorg, volgens</text><text x="50" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">de vigerende protocollen en met navolgbare</text><text x="50" y="312" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vastlegging, in een levensechte</text><text x="50" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">apotheekomgeving (apothekersassistent NLQF 4,</text><text x="50" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kerntaak B1-K1)</text><text x="50" y="365" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="405" width="467" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(485,410)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="423" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="441" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert een baliegesprek met triage uit, volgens</text><text x="50" y="459" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">het triageprotocol en met een onderbouwd</text><text x="50" y="477" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">advies of doorverwijzing, in de</text><text x="50" y="495" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieapotheek (apothekersassistent NLQF 4,</text><text x="50" y="513" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkproces B1-K1-W1)</text><text x="50" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="570" width="287" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(305,575)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="588" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101</text><text x="50" y="623" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="663" width="319" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(337,668)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="681" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Triage: theorie en protocollen</text><text x="50" y="716" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="756" width="467" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(485,761)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="774" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="792" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert medicatiebewaking uit op signalen uit</text><text x="50" y="810" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">het apotheeksysteem, volgens het</text><text x="50" y="828" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">bewakingsprotocol en met overleg bij twijfel,</text><text x="50" y="846" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">in de leerapotheek onder begeleiding</text><text x="50" y="864" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">(apothekersassistent NLQF 4, werkprocesniveau)</text><text x="50" y="881" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="921" width="375" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(393,926)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="939" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="957" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking in de leerapotheek</text><text x="50" y="974" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><path d="M100 212V240" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 377V405" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 377l-5 7l5 7l5 -7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M100 542V570" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 893V921" stroke="#444" stroke-width="1.3" fill="none"/><path d="M507 780H529V780H507" stroke="#444" stroke-width="1.3" fill="none"/><path d="M507 780l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M359 701H543V794H507" stroke="#444" stroke-width="1.3" fill="none"/><path d="M327 594H557V171H498" stroke="#444" stroke-width="1.3" fill="none"/><path d="M498 171l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M359 687H571V185H561A4 4 0 0 0 553 185H498" stroke="#444" stroke-width="1.3" fill="none"/><path d="M498 185l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M415 945H585V199H575A4 4 0 0 0 567 199H561A4 4 0 0 0 553 199H498" stroke="#444" stroke-width="1.3" fill="none"/><path d="M498 199l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="12" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Verdieping: de leeruitkomst zit niet in de eenheid, zij staat</text><text x="12" y="1027" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">ernaast. De onderwijseenheid draagt de toetsbare uitkomsten, de</text><text x="12" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeronderdelen dragen het onderwijskundige antwoord op hoe de student</text><text x="12" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">daar komt. Die twee verdiepingen lopen niet gelijk op: een werkproces</text><text x="12" y="1084" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">is een summatieve verdieping van een kerntaak, een leeronderdeel een</text><text x="12" y="1103" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">ontwikkelingsgerichte. Daarom hangen hier twee leeronderdelen aan een</text><text x="12" y="1122" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">werkproces-leeruitkomst, en draagt geen leeronderdeel een</text><text x="12" y="1141" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">werkproces-code als naam.</text></svg>