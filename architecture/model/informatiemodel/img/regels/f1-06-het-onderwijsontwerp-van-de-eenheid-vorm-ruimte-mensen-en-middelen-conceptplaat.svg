ontwerp</text><text x="369" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Verdieping: rond de eenheid legt de instelling haar onderwijsontwerp vast.</text><text x="369" y="1049" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De gewenste leeromgeving is een ruimteprofiel, geen lokaal: zij zegt welke</text><text x="369" y="1068" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">ruimte past en sorteert daarmee voor op een onderwijslocatie met dat</text><text x="369" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lokaaltype. De leermiddelen staan apart en hangen aan het leeronderdeel.</text></svg>