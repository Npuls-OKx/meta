<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1027 1509" width="1027" height="1509"><rect x="0.5" y="0.5" width="1026" height="1508" rx="10" fill="#ffffff" stroke="#d8ddda" stroke-dasharray="6 4"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-06 - Het onderwijsontwerp van de eenheid: vorm, ruimte, mensen en middelen (conceptplaat)</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="486" height="65" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(694,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwalificatiedossier vertalen naar leeruitkomsten</text><text x="240" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: onderwijsontwerp met ruimte en middelen</text><path d="M64 105 V125" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 119 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="129" width="680" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(698,134)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Leervormstrategie</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Leren door te doen in een levensechte omgeving, theorie ondersteunend</text><rect x="40" y="205" width="899" height="82" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(917,210)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Leerdoel</text><text x="50" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zelfstandig farmaceutische patiëntenzorg bieden in een levensechte setting</text><text x="50" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Kerntaak Word onderwijskundig vertaald tot: B1-K1</text><text x="50" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Heeft één of meer Leeruitkomst: Biedt farmaceutische patiëntenzorg in een levensechte apotheekomgeving (kerntaakniveau)</text><rect x="40" y="315" width="513" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(531,320)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="333" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Onderwijsvorm specificatie</text><text x="50" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Simulatie in de leerapotheek, theorie ondersteunend</text><text x="50" y="368" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeruitkomst hangt aan</text><rect x="40" y="408" width="763" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(781,413)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Gewenste Onderwijskundige Leeromgeving</text><text x="50" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Simulatiegeschikte praktijkruimte voor 24 studenten, balie-opstelling mogelijk</text><rect x="40" y="484" width="460" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(478,489)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="502" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Onderwijsruimte type</text><text x="50" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijkruimte met baliesimulatie</text><text x="50" y="537" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Lokaal: het concrete lokaal volgt pas bij roosteren</text><rect x="40" y="577" width="482" height="100" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(500,582)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="595" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Onderwijs locatie</text><text x="50" y="613" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Vestiging Zuid</text><rect x="54" y="619" width="458" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(490,624)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="637" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Lokaaltypes</text><text x="64" y="655" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijklokalen met servicebalie, 24 plaatsen</text><rect x="40" y="705" width="975" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(993,710)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="723" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Gewenst medewerker competentieprofiel</text><text x="50" y="741" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Apothekersassistent-docent: didactisch en communicatief (CompetentNL laag 2), farmacie (ISCED-F 0916)</text><text x="50" y="758" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Onderwijsvorm specificatie</text><rect x="40" y="798" width="522" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(540,803)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="816" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Medewerker Type / Expertise Profiel</text><text x="50" y="834" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent farmacie met baliepraktijk (expertiseprofiel)</text><rect x="40" y="874" width="726" height="156" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(744,879)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="892" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Competenties / skills</text><text x="50" y="910" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Profiel docent farmacie: de skills die de instelling bij dit type verwacht</text><rect x="54" y="916" width="624" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(656,921)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="934" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Vaardigheid</text><text x="64" y="952" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Didactische en communicatieve vaardigheden (CompetentNL laag 2)</text><rect x="54" y="972" width="255" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(287,977)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="990" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Kennis</text><text x="64" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Farmacie (ISCED-F 0916)</text><rect x="40" y="1058" width="632" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(650,1063)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1076" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Collectie van Medewerkertypes</text><text x="50" y="1094" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent farmacie en praktijkbegeleider</text><text x="50" y="1111" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel / Leeractiviteit specificatie bevat: B1-K1-W1 Baliegesprek en triage</text><rect x="40" y="1151" width="416" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(434,1156)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1169" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Studiebelasting en begeleide onderwijstijd indicatie</text><text x="50" y="1187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">BOT 50 / OOT 50 SBU</text><text x="50" y="1204" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Onderwijsvorm specificatie</text><rect x="40" y="1244" width="632" height="117" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(650,1249)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Collectie van Leermiddelgroepen</text><text x="50" y="1280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Leermiddelen voor de baliesimulatie</text><rect x="54" y="1303" width="606" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(638,1308)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="1321" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Leermiddelgroep</text><text x="64" y="1339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Apotheekbalie-opstelling, receptenlijnsysteem, oefenmedicatie</text><text x="50" y="1297" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel / Leeractiviteit specificatie bevat: B1-K1-W1 Baliegesprek en triage</text><path d="M100 380V408" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 456V484" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 484l-6 -10h12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M100 770V798" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 770l-4 8h8z" fill="#444"/><text x="108" y="788" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Heeft meerdere</text><rect x="12" y="1369" width="347" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="1383" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">conceptplaat: Informatiemodel Onderwijsontwerp</text><text x="369" y="1383" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Verdieping: rond de eenheid legt de instelling haar onderwijsontwerp vast.</text><text x="369" y="1402" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De gewenste leeromgeving is een ruimteprofiel, geen lokaal: zij zegt welke</text><text x="369" y="1421" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">ruimte past en sorteert voor op een onderwijslocatie met dat lokaaltype. Het</text><text x="369" y="1440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">docentprofiel werkt net zo: het beschrijft de gevraagde expertise, die de</text><text x="369" y="1459" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">instelling als medewerkertype in haar organisatie herkent; de persoon zelf</text><text x="369" y="1478" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">volgt bij plannen. De leermiddelen staan apart en hangen aan het</text><text x="369" y="1497" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeronderdeel.</text></svg>