iëntenzorg</text><text x="78" y="267" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patiëntenzorg (kerntaakniveau)</text><text x="64" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">BOL voltijd, diplomaprogramma</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Apothekersassistent, versie 2026.1</text><rect x="40" y="414" width="384" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(402,419)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="432" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeelruimte</text><text x="50" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">720 SBU, mbo-4: te vullen met 480 SBU</text><text x="50" y="468" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">verdiepend en 240 SBU generiek</text><rect x="40" y="508" width="449" height="102" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(467,513)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="526" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student keuze regelset</text><text x="50" y="544" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kiesbare keuzedelen: K0037 Farmaceutische</text><text x="50" y="562" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Patientenzorg (480 SBU, verdiepend) of K0