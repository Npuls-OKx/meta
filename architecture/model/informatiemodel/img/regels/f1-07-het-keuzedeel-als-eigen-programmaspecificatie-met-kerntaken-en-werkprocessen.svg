<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1046 800" width="1046" height="800"><rect x="0.5" y="0.5" width="1045" height="799" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-07 - Het keuzedeel als eigen programmaspecificatie, met kerntaken en werkprocessen</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="513" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(722,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeelprogramma als eigen specificatie vormgeven</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="994" height="134" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(1012,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Draagt bij aan kwaliteitszorg en arbeidsomstandigheden op de eigen werkplek (kerntaakniveau, keuzedeel)</text><rect x="54" y="171" width="938" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(970,176)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="64" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Levert een bijdrage aan de inrichting van het kwaliteitszorgsysteem (werkprocesniveau, keuzedeel)</text><text x="64" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Werkproces Wordt vertaald naar: D1-K1-W1 Levert een bijdrage aan de inrichting van het kwaliteitszorgsysteem</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Kerntaak Wordt vertaald naar: D1-K1 Draagt bij aan kwaliteitszorg en arbeidsomstandigheden</text><rect x="40" y="274" width="882" height="435" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(900,279)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel</text><text x="50" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0262 ARBO, kwaliteitszorg en hulpverlening geschikt voor niveau 3 (240 SBU)</text><rect x="54" y="350" width="858" height="207" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(890,355)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="368" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="64" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1 Draagt bij aan kwaliteitszorg en arbeidsomstandigheden</text><rect x="68" y="409" width="834" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(880,414)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="427" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="445" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1-W1 Bijdrage aan de inrichting van het kwaliteitszorgsysteem</text><text x="78" y="462" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Levert een bijdrage aan de inrichting van het kwaliteitszorgsysteem (werkprocesniveau)</text><rect x="68" y="482" width="690" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(736,487)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1-W2 Risico-inventarisatie en -evaluatie</text><text x="78" y="535" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert een RI&amp;E uit en realiseert verbeterpunten (werkprocesniveau)</text><text x="64" y="403" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Draagt bij aan kwaliteitszorg en arbeidsomstandigheden (kerntaakniveau, keuzedeel)</text><rect x="54" y="565" width="697" height="134" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(729,570)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="583" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="64" y="601" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K2 Verleent EHBO en BHV</text><rect x="68" y="624" width="568" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(614,629)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="642" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="660" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K2-W1 Hulp bij calamiteiten</text><text x="78" y="677" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Verleent hulp bij calamiteiten (werkprocesniveau)</text><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Verleent EHBO en BHV bij een calamiteit (kerntaakniveau, keuzedeel)</text><text x="50" y="327" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><text x="50" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Student keuze regelset hangt aan</text><text x="12" y="731" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Een keuzedeel is zelf een programmaspecificatie, gelijksoortig vormgegeven maar los van Jochems opleiding. Het kent</text><text x="12" y="750" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">dezelfde opbouw als een kwalificatie: kerntaken met werkprocessen eronder, die de instelling vertaalt naar leeruitkomsten</text><text x="12" y="769" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">en vormgeeft als onderwijseenheid- en leeronderdeelspecificaties. Welk keuzedeel de ruimte vult, bepaalt het</text><text x="12" y="788" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">studentkeuzesysteem later met de regelset.</text></svg>