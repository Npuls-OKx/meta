<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1522 122" width="1522" height="122"><rect x="0.5" y="0.5" width="1521" height="121" rx="10" fill="#ffffff" stroke="#d8ddda"/><rect x="12" y="10" width="196" height="46" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(186,15)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="27" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="218" y="10" width="480" height="46" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(676,15)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="228" y="27" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a5a2a" text-anchor="start">processtap</text><text x="228" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeelprogramma als eigen specificatie vormgeven</text><text x="704" y="40" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5b6663" text-anchor="start">→</text><rect x="724" y="10" width="299" height="78" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1001,15)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="734" y="27" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a5a2a" text-anchor="start">Keuzedeel</text><text x="995" y="27" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="end">R1-046</text><text x="734" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Ondernemerschap in de zorg</text><text x="734" y="60" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><text x="734" y="76" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Student keuze regelset hangt aan</text><text x="12" y="110" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Een keuzedeel is zelf een programmaspecificatie, gelijksoortig vormgegeven maar los van Jochems opleiding; welk keuzedeel de ruimte vult, bepaalt het studentkeuzesysteem later met de regelset.</text></svg>