.5h12"/></g><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><rect x="54" y="261" width="820" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(852,266)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="279" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="64" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Levert een bijdrage aan de inrichting van het</text><text x="64" y="315" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kwaliteitszorgsysteem, toetsbaar aan de normen</text><text x="64" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">uit het kwaliteitshandboek, in de eigen</text><text x="64" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">apotheek (keuzedeel K0262 NLQF 3,</text><text x="64" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkprocesniveau)</text><text x="64" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Werkproces Wordt vertaald naar: D1-K1-W1 Levert een bijdrage aan de inrichting van het kwaliteitszorgsysteem</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Draagt bij aan kwaliteitszorg en</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">arbeidsomstandigheden, volgens de</text><text x="50" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">RI&amp;E-systematiek en het kwaliteitshandboek van</text><text x="50" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">de apotheek, op de eigen werkplek (keuzedeel</text><text x="50" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0262 NLQF 3, kerntaakniveau)</text><text x="50" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Kerntaak Wordt vertaald naar: D1-K1 Draagt bij aan kwaliteitszorg en arbeidsomstandigheden</text><rect x="40" y="436" width="882" height="471" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(900,441)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="454" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel</text><rect x="54" y="530" width="858" height="225" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(890,535)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="68" y="607" width="834" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(880,612)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="625" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="643" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwaliteitszorg in de eigen praktijk</text><text x="78" y="660" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Levert een bijdrage aan de inrichting van het kwaliteitszorgsysteem (werkprocesniveau)</text><rect x="68" y="680" width="690" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(736,685)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="698" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="716" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">RI&amp;E van begin tot eind</text><text x="78" y="733" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert een RI&amp;E uit en realiseert verbeterpunten (werkprocesniveau)</text><text x="64" y="566" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1 Draagt bij aan kwaliteitszorg en</text><text x="64" y="584" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">arbeidsomstandigheden</text><text x="64" y="601" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Draagt bij aan kwaliteitszorg en arbeidsomstandigheden (kerntaakniveau, keuzedeel)</text><rect x="54" y="763" width="697" height="134" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(729,768)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="781" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="68" y="822" width="568" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(614,827)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="840" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="858" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Handelen bij calamiteiten</text><text x="78" y="875" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Verleent hulp bij calamiteiten (werkprocesniveau)</text><text x="64" y="799" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K2 Verleent EHBO en BHV</text><text x="64" y="816" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Verleent EHBO en BHV bij een calamiteit (kerntaakniveau, keuzedeel)</text><text x="50" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0262 ARBO, kwaliteitszorg en hulpverlening</text><text x="50" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">geschikt voor niveau 3 (240 SBU)</text><text x="50" y="507" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><text x="50" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Student keuze regelset hangt aan</text><rect x="40" y="935" width="908" height="311" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(926,940)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="953" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel</text><rect x="54" y="1029" width="884" height="207" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(916,1034)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="1047" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="68" y="1088" width="589" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(635,1093)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="1106" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="1124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Het medicatieoverzicht opstellen</text><text x="78" y="1141" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Zorgt voor een medicatieoverzicht (werkprocesniveau)</text><rect x="68" y="1161" width="791" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(837,1166)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="1179" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="1197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zorg aan specifieke doelgroepen</text><text x="78" y="1214" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patientenzorg aan specifieke doelgroepen (werkprocesniveau)</text><text x="64" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1 Voert farmaceutische patientenzorg uit</text><text x="64" y="1082" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert farmaceutische patientenzorg uit bij specifieke doelgroepen (kerntaakniveau, keuzedeel)</text><text x="50" y="971" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg (480 SBU,</text><text x="50" y="989" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">verdiepend)</text><text x="50" y="1006" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><text x="50" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Student keuze regelset hangt aan</text><text x="12" y="1268" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Een keuzedeel is zelf een programmaspecificatie, gelijksoortig vormgegeven maar los van Jochems opleiding. Het</text><text x="12" y="1287" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">landelijke keuzedeel komt van SBB en levert kerntaken en werkprocessen; de instelling vertaalt die naar</text><text x="12" y="1306" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeruitkomsten en geeft ze vorm als onderwijseenheid- en leeronderdeelspecificaties. Ook hier lopen beide</text><text x="12" y="1325" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verdiepingen niet gelijk op: een werkproces zegt wat summatief moet blijken, een leeronderdeel hoe de student</text><text x="12" y="1344" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">daar komt. Twee keuzedelen vullen samen de ruimte van 720 SBU.</text></svg>