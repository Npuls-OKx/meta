<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1018 1818" width="1018" height="1818"><rect x="0.5" y="0.5" width="1017" height="1817" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-08 - Kiesbaar onderwijsprogrammaonderdeel: keuzedelen en minor</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="421" height="66" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(629,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeelprogramma als eigen specificatie</text><text x="240" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vormgeven</text><path d="M64 106 V126" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 120 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="130" width="844" height="278" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(862,135)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><rect x="54" y="261" width="820" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(852,266)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="279" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="64" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Levert een bijdrage aan de inrichting van het</text><text x="64" y="315" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kwaliteitszorgsysteem, toetsbaar aan de normen</text><text x="64" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">uit het kwaliteitshandboek, in de eigen</text><text x="64" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">apotheek (keuzedeel K0262 NLQF 3,</text><text x="64" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkprocesniveau)</text><text x="64" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Werkproces Wordt vertaald naar: D1-K1-W1 Levert een bijdrage aan de inrichting van het kwaliteitszorgsysteem</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Draagt bij aan kwaliteitszorg en</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">arbeidsomstandigheden, volgens de</text><text x="50" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">RI&amp;E-systematiek en het kwaliteitshandboek van</text><text x="50" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">de apotheek, op de eigen werkplek (keuzedeel</text><text x="50" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0262 NLQF 3, kerntaakniveau)</text><text x="50" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Kerntaak Wordt vertaald naar: D1-K1 Draagt bij aan kwaliteitszorg en arbeidsomstandigheden</text><rect x="40" y="436" width="721" height="364" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(739,441)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="454" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel</text><rect x="54" y="530" width="652" height="118" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(684,535)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="68" y="590" width="365" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(411,595)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="626" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwaliteitszorg in de eigen praktijk</text><rect x="441" y="590" width="255" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(674,595)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="451" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="451" y="626" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">RI&amp;E van begin tot eind</text><text x="64" y="566" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1 Draagt bij aan kwaliteitszorg en</text><text x="64" y="584" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">arbeidsomstandigheden</text><rect x="54" y="656" width="697" height="134" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(729,661)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="674" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="68" y="715" width="568" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(614,720)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="733" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="751" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Handelen bij calamiteiten</text><text x="78" y="768" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Verleent hulp bij calamiteiten (werkprocesniveau)</text><text x="64" y="692" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K2 Verleent EHBO en BHV</text><text x="64" y="709" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Verleent EHBO en BHV bij een calamiteit (kerntaakniveau, keuzedeel)</text><text x="50" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0262 ARBO, kwaliteitszorg en hulpverlening</text><text x="50" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">geschikt voor niveau 3 (240 SBU)</text><text x="50" y="507" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><text x="50" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Student keuze regelset hangt aan</text><rect x="40" y="828" width="473" height="262" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(491,833)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="846" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><rect x="54" y="960" width="449" height="120" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(481,965)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="978" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="64" y="996" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Stelt een medicatieoverzicht op, volgens de</text><text x="64" y="1014" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">richtlijn medicatieoverzicht en geverifieerd</text><text x="64" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">bij patiënt en voorschrijver, in de</text><text x="64" y="1050" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">leerapotheek (keuzedeel K0037 NLQF 4,</text><text x="64" y="1068" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkprocesniveau)</text><text x="50" y="864" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert verdiepende farmaceutische patiëntenzorg</text><text x="50" y="882" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">uit, volgens de richtlijn farmaceutische</text><text x="50" y="900" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">patiëntenzorg en met een onderbouwd advies,</text><text x="50" y="918" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">bij patiënten met meervoudig</text><text x="50" y="936" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">geneesmiddelgebruik (keuzedeel K0037 NLQF 4,</text><text x="50" y="954" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kerntaakniveau)</text><rect x="40" y="1118" width="908" height="311" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(926,1123)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1136" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel</text><rect x="54" y="1212" width="884" height="207" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(916,1217)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="1230" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="68" y="1271" width="589" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(635,1276)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="1289" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="1307" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Het medicatieoverzicht opstellen</text><text x="78" y="1324" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Zorgt voor een medicatieoverzicht (werkprocesniveau)</text><rect x="68" y="1344" width="791" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(837,1349)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="1362" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="1380" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zorg aan specifieke doelgroepen</text><text x="78" y="1397" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patientenzorg aan specifieke doelgroepen (werkprocesniveau)</text><text x="64" y="1248" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1 Voert farmaceutische patientenzorg uit</text><text x="64" y="1265" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert farmaceutische patientenzorg uit bij specifieke doelgroepen (kerntaakniveau, keuzedeel)</text><text x="50" y="1154" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg (480 SBU,</text><text x="50" y="1172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">verdiepend)</text><text x="50" y="1189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><text x="50" y="1206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Student keuze regelset hangt aan</text><rect x="40" y="1457" width="439" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(457,1462)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1475" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Minor</text><text x="50" y="1493" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Farmacotherapie en patiëntveiligheid, 30 EC</text><text x="50" y="1511" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">(hbo-bachelor NLQF 6)</text><text x="50" y="1528" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><rect x="40" y="1568" width="449" height="102" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(467,1573)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1586" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="1604" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Beoordeelt farmacotherapie op</text><text x="50" y="1622" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">patiëntveiligheid, volgens de vigerende</text><text x="50" y="1640" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">richtlijnen en onderbouwd met literatuur, in</text><text x="50" y="1658" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">een multidisciplinair overleg (minor NLQF 6)</text><path d="M513 880H970V1592H489" stroke="#1f6fb2" stroke-width="1.3" fill="none"/><path d="M513 866H984V1606H489" stroke="#b5651d" stroke-width="1.3" fill="none"/><path d="M513 852H998V1620H489" stroke="#11776b" stroke-width="1.3" fill="none"/><text x="12" y="1692" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Een keuzedeel is zelf een programmaspecificatie, gelijksoortig vormgegeven maar los van Jochems opleiding. Het</text><text x="12" y="1711" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">landelijke keuzedeel komt van SBB, met de K-code als verwijzing naar het erkende keuzedeel, en levert kerntaken en</text><text x="12" y="1730" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">werkprocessen; de instelling vertaalt die naar leeruitkomsten en geeft ze vorm als onderwijseenheid- en</text><text x="12" y="1749" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeronderdeelspecificaties. Ook hier lopen beide verdiepingen niet gelijk op: een werkproces zegt wat summatief moet</text><text x="12" y="1768" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">blijken, een leeronderdeel hoe de student daar komt. Twee keuzedelen vullen samen de ruimte van 720 SBU. In het hoger</text><text x="12" y="1787" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">onderwijs vult een minor dezelfde ruimte op dezelfde manier, met eigen leeruitkomsten op haar eigen niveau. De plaat</text><text x="12" y="1806" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">draagt het objecttype minor nog niet; het staat hier gestippeld.</text></svg>