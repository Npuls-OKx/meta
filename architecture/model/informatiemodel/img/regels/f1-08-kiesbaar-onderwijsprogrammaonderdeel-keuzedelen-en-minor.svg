<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 926 1696" width="926" height="1696"><rect x="0.5" y="0.5" width="925" height="1695" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-08 - Kiesbaar onderwijsprogrammaonderdeel: keuzedelen en minor</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="421" height="66" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(629,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeelprogramma als eigen specificatie</text><text x="240" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vormgeven</text><path d="M64 106 V126" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 120 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="130" width="844" height="278" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(862,135)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><rect x="54" y="261" width="820" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(852,266)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="279" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="64" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Levert een bijdrage aan de inrichting van het</text><text x="64" y="315" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kwaliteitszorgsysteem, toetsbaar aan de normen</text><text x="64" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">uit het kwaliteitshandboek, in de eigen</text><text x="64" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">apotheek (keuzedeel K0262 NLQF 3,</text><text x="64" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkprocesniveau)</text><text x="64" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Werkproces Wordt vertaald naar: D1-K1-W1 Levert een bijdrage aan de inrichting van het kwaliteitszorgsysteem</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Draagt bij aan kwaliteitszorg en</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">arbeidsomstandigheden, volgens de</text><text x="50" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">RI&amp;E-systematiek en het kwaliteitshandboek van</text><text x="50" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">de apotheek, op de eigen werkplek (keuzedeel</text><text x="50" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0262 NLQF 3, kerntaakniveau)</text><text x="50" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Kerntaak Wordt vertaald naar: D1-K1 Draagt bij aan kwaliteitszorg en arbeidsomstandigheden</text><rect x="40" y="436" width="676" height="330" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(694,441)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="454" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel</text><rect x="54" y="530" width="652" height="118" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(684,535)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="68" y="590" width="365" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(411,595)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="626" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwaliteitszorg in de eigen praktijk</text><rect x="441" y="590" width="255" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(674,595)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="451" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="451" y="626" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">RI&amp;E van begin tot eind</text><text x="64" y="566" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1 Draagt bij aan kwaliteitszorg en</text><text x="64" y="584" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">arbeidsomstandigheden</text><rect x="54" y="656" width="297" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(329,661)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="674" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="68" y="698" width="273" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(319,703)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="716" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="734" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Handelen bij calamiteiten</text><text x="64" y="692" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K2 Verleent EHBO en BHV</text><text x="50" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0262 ARBO, kwaliteitszorg en hulpverlening</text><text x="50" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">geschikt voor niveau 3 (240 SBU)</text><text x="50" y="507" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><text x="50" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Student keuze regelset hangt aan</text><rect x="40" y="794" width="473" height="262" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(491,799)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="812" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><rect x="54" y="926" width="449" height="120" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(481,931)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="944" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="64" y="962" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Stelt een medicatieoverzicht op, volgens de</text><text x="64" y="980" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">richtlijn medicatieoverzicht en geverifieerd</text><text x="64" y="998" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">bij patiënt en voorschrijver, in de</text><text x="64" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">leerapotheek (keuzedeel K0037 NLQF 4,</text><text x="64" y="1034" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkprocesniveau)</text><text x="50" y="830" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert verdiepende farmaceutische patiëntenzorg</text><text x="50" y="848" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">uit, volgens de richtlijn farmaceutische</text><text x="50" y="866" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">patiëntenzorg en met een onderbouwd advies,</text><text x="50" y="884" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">bij patiënten met meervoudig</text><text x="50" y="902" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">geneesmiddelgebruik (keuzedeel K0037 NLQF 4,</text><text x="50" y="920" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kerntaakniveau)</text><rect x="40" y="1084" width="722" height="204" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(740,1089)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1102" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel</text><rect x="54" y="1178" width="698" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(730,1183)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="1196" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="68" y="1220" width="338" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(384,1225)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="1238" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="1256" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Het medicatieoverzicht opstellen</text><rect x="414" y="1220" width="328" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(720,1225)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="424" y="1238" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="424" y="1256" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zorg aan specifieke doelgroepen</text><text x="64" y="1214" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1 Voert farmaceutische patientenzorg uit</text><text x="50" y="1120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg (480 SBU,</text><text x="50" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">verdiepend)</text><text x="50" y="1155" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><text x="50" y="1172" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Student keuze regelset hangt aan</text><rect x="40" y="1316" width="439" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(457,1321)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1334" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Minor</text><text x="50" y="1352" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Farmacotherapie en patiëntveiligheid, 30 EC</text><text x="50" y="1370" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">(hbo-bachelor NLQF 6)</text><text x="50" y="1387" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><rect x="40" y="1427" width="449" height="102" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(467,1432)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1445" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="1463" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Beoordeelt farmacotherapie op</text><text x="50" y="1481" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">patiëntveiligheid, volgens de vigerende</text><text x="50" y="1499" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">richtlijnen en onderbouwd met literatuur, in</text><text x="50" y="1517" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">een multidisciplinair overleg (minor NLQF 6)</text><path d="M513 818H906V1451H489" stroke="#444" stroke-width="1.3" fill="none"/><path d="M513 832H906V1451H489" stroke="#444" stroke-width="1.3" fill="none"/><path d="M513 846H906V1451H489" stroke="#444" stroke-width="1.3" fill="none"/><path d="M513 860H906V1451H489" stroke="#444" stroke-width="1.3" fill="none"/><path d="M513 874H906V1451H489" stroke="#444" stroke-width="1.3" fill="none"/><path d="M479 1340H906V1451H489" stroke="#444" stroke-width="1.3" fill="none"/><path d="M479 1354H906V1451H489" stroke="#444" stroke-width="1.3" fill="none"/><path d="M479 1368H906V1451H489" stroke="#444" stroke-width="1.3" fill="none"/><text x="12" y="1551" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Een keuzedeel is zelf een programmaspecificatie, gelijksoortig vormgegeven maar los van Jochems opleiding.</text><text x="12" y="1570" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het landelijke keuzedeel komt van SBB, met de K-code als verwijzing naar het erkende keuzedeel, en levert</text><text x="12" y="1589" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">kerntaken en werkprocessen; de instelling vertaalt die naar leeruitkomsten en geeft ze vorm als</text><text x="12" y="1608" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">onderwijseenheid- en leeronderdeelspecificaties. Ook hier lopen beide verdiepingen niet gelijk op: een</text><text x="12" y="1627" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">werkproces zegt wat summatief moet blijken, een leeronderdeel hoe de student daar komt. Twee keuzedelen</text><text x="12" y="1646" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">vullen samen de ruimte van 720 SBU. In het hoger onderwijs vult een minor dezelfde ruimte op dezelfde</text><text x="12" y="1665" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">manier, met eigen leeruitkomsten op haar eigen niveau. De plaat draagt het objecttype minor nog niet; het</text><text x="12" y="1684" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">staat hier gestippeld.</text></svg>