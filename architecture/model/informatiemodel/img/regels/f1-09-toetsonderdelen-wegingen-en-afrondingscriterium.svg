<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 998" width="700" height="998"><rect x="0.5" y="0.5" width="699" height="997" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-09 - Toetsonderdelen, wegingen en afrondingscriterium</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="458" height="66" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(666,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Toetsonderdelen en resultaatstructuur uit het</text><text x="240" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">examenplan afleiden</text><path d="M64 106 V126" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 120 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="130" width="606" height="279" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(624,135)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatieve resultaat structuur</text><rect x="54" y="224" width="582" height="119" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(614,229)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsonderdeel specificatie</text><text x="64" y="260" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijktoets baliegesprek (OSCE), summatief:</text><text x="64" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">schaal 1,0 tot 10,0 met een decimaal, afname</text><text x="64" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">in de simulatieapotheek, 30 minuten, geen</text><text x="64" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">hulpmiddelen, twee pogingen</text><text x="64" y="331" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><rect x="54" y="351" width="393" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(425,356)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="369" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examenonderdeel weging</text><text x="64" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid B1-K1: weging 2</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Resultaatstructuur Apothekersassistent, alle</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderdelen voldoende</text><text x="50" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: uitgewerkt</text><text x="50" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patiëntenzorg (kerntaakniveau)</text><rect x="40" y="437" width="582" height="119" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(600,442)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="455" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examenonderdeelspecificatie</text><text x="50" y="473" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid B1-K1: schaal</text><text x="50" y="491" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onvoldoende, voldoende of goed, afname op de</text><text x="50" y="509" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">bpv-werkplek, 120 minuten, eigen</text><text x="50" y="527" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">protocollenmap toegestaan, twee pogingen</text><text x="50" y="544" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patiëntenzorg (kerntaakniveau)</text><rect x="40" y="584" width="458" height="101" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,589)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="602" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examenonderdeelspecificatie</text><text x="50" y="620" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Centraal examen Nederlands 3F: schaal 1,0 tot</text><text x="50" y="638" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">10,0 met een decimaal, digitale afname op een</text><text x="50" y="656" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">examengelegenheid, 120 minuten, twee pogingen</text><text x="50" y="673" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Toetsonderdeel specificatie</text><rect x="40" y="713" width="458" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,718)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="731" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatief Afrondingscriterium</text><text x="50" y="749" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Alle kerntaken voldoende, de keuzedeelruimte</text><text x="50" y="767" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">gevuld en afgerond, en het basisdeel behaald:</text><text x="50" y="785" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Nederlands en rekenen op 2F of 3F met een</text><text x="50" y="803" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">eigen regeling, Engels en loopbaan en</text><text x="50" y="821" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">burgerschap voldaan</text><text x="50" y="838" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Summatieve resultaat structuur hangt aan</text><path d="M100 409V437" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 409l-6 10h12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="12" y="872" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De ontwerper leidt uit het examenplan de toets- en examenonderdelen af en</text><text x="12" y="891" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">hangt ze aan de resultaatstructuur, met de weging en het</text><text x="12" y="910" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">afrondingscriterium. Elk onderdeel draagt zijn schaal, afnamevorm, duur,</text><text x="12" y="929" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">toegestane hulpmiddelen en het aantal pogingen, want zonder die kenmerken</text><text x="12" y="948" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">kan een studentvolgsysteem een resultaat niet interpreteren. Formatieve en</text><text x="12" y="967" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">summatieve onderdelen bestaan naast elkaar: een examen telt ook als toets,</text><text x="12" y="986" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">en het volgsysteem onderscheidt ze op unieke codering.</text></svg>