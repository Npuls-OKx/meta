<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 935 1207" width="935" height="1207"><rect x="0.5" y="0.5" width="934" height="1206" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-10 - De examenonderdeelspecificatie met haar toetsvorm, instrumenten, materiaal en ruimte</text><rect x="12" y="40" width="181" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(171,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">examencommissie</text><rect x="203" y="40" width="395" height="83" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(575,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="213" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="213" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Exameninstrumenten bepalen, inkopen of</text><text x="213" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">construeren</text><text x="213" y="111" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: examenvorm, instrument en beoordelaar</text><path d="M64 123 V143" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 137 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="147" width="582" height="117" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(600,152)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examenonderdeelspecificatie</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid B1-K1, met vorm,</text><text x="50" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">instrumenten en ruimte</text><text x="50" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: uitgewerkt</text><text x="50" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patientenzorg (kerntaakniveau)</text><text x="50" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Toetsonderdeel specificatie</text><rect x="40" y="292" width="712" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(730,297)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Toetsvormspecificatie</text><text x="50" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid in de simulatieapotheek</text><text x="50" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Onderwijsvorm specificatie: dezelfde vorm als het onderwijsontwerp, nu voor het examen</text><rect x="40" y="385" width="449" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(467,390)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="403" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Toetsvorm</text><text x="50" y="421" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijkbeoordeling aan de balie, 45 minuten</text><rect x="40" y="461" width="755" height="83" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(773,466)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="479" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Toetsinstrument</text><text x="50" y="497" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Beoordelingsformulier met rubric, ingekocht</text><text x="50" y="515" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">bij de branche</text><text x="50" y="532" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Collectie van Leermiddelgroepen: het materiaal bij de toets: ingekocht of zelf geconstrueerd</text><rect x="40" y="572" width="827" height="83" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(845,577)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="590" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Leermiddelgroep</text><text x="50" y="608" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examenmateriaal: oefenrecepten, casuskaarten,</text><text x="50" y="626" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">baliemateriaal</text><text x="50" y="643" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Collectie van Leermiddelgroepen bevat: het toetsinstrument is zo&#x27;n collectie: ingekocht of zelf geconstrueerd</text><rect x="40" y="683" width="467" height="83" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(485,688)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="701" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Onderwijsruimte type</text><text x="50" y="719" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijkruimte met baliesimulatie, afsluitbaar</text><text x="50" y="737" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">voor examinering</text><text x="50" y="754" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Les specificatie / toets specificatie bevat</text><rect x="40" y="794" width="611" height="83" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(629,799)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="812" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Gewenst medewerker competentieprofiel</text><text x="50" y="830" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examinator met baliepraktijk en</text><text x="50" y="848" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">toetsbekwaamheid</text><text x="50" y="865" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Toetsvormspecificatie: Proeve van bekwaamheid in de simulatieapotheek</text><rect x="40" y="905" width="491" height="192" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(509,910)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="923" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Competenties / skills</text><rect x="54" y="965" width="467" height="66" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(499,970)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="983" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Vaardigheid</text><text x="64" y="1001" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Beoordelen en feedback geven (CompetentNL laag</text><text x="64" y="1019" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">2)</text><rect x="54" y="1039" width="365" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(397,1044)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Kennis</text><text x="64" y="1075" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Farmacie en toetsing (ISCED-F 0916)</text><text x="50" y="941" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Profiel examinator: de skills die de</text><text x="50" y="959" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">instelling bij dit type verwacht</text><path d="M100 357V385" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 385l-6 -10h12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M100 433V461" stroke="#444" stroke-width="1.3" fill="none"/><text x="12" y="1119" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De examencommissie werkt de examenonderdeelspecificatie uit zoals de onderwijsontwerper de eenheid:</text><text x="12" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">alles hieronder wordt er onderdeel van. De toetsvorm zegt hoe er wordt geexamineerd, het instrument</text><text x="12" y="1157" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">en het materiaal waarmee, het ruimtetype waar het goed af te nemen is, en het profiel wie mag</text><text x="12" y="1176" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">beoordelen, met de skills die daarbij horen. De specificatie zelf verwijst naar de leeruitkomst die</text><text x="12" y="1195" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het examen aftikt; de afname volgt in fase 2 als examenmoment met instrument.</text></svg>