<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003 900" width="1003" height="900"><rect x="0.5" y="0.5" width="1002" height="899" rx="10" fill="#ffffff" stroke="#d8ddda" stroke-dasharray="6 4"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-10 - De examenspecificatie: toetsvorm, instrument en beoordelaar (conceptplaat)</text><rect x="12" y="40" width="181" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(171,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">examencommissie</text><rect x="203" y="40" width="504" height="65" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(685,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="213" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="213" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Exameninstrumenten bepalen, inkopen of construeren</text><text x="213" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: examenvorm, instrument en beoordelaar</text><path d="M64 105 V125" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 119 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="129" width="712" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(730,134)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Toetsvormspecificatie</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid in de simulatieapotheek</text><text x="50" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Onderwijsvorm specificatie: dezelfde vorm als het onderwijsontwerp, nu voor het examen</text><rect x="40" y="222" width="449" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(467,227)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Toetsvorm</text><text x="50" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijkbeoordeling aan de balie, 45 minuten</text><rect x="40" y="298" width="582" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(600,303)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Toets</text><text x="50" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprek met triage, beoordeeld op de leeruitkomst</text><text x="50" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><rect x="40" y="391" width="755" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(773,396)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="409" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Toetsinstrument</text><text x="50" y="427" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Beoordelingsformulier met rubric, ingekocht bij de branche</text><text x="50" y="444" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Collectie van Leermiddelgroepen: het materiaal bij de toets: ingekocht of zelf geconstrueerd</text><rect x="40" y="484" width="589" height="99" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(607,489)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="502" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Examen</text><text x="50" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid B1-K1</text><text x="50" y="537" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Examenplan is uitgewekt in: Examenplan Apothekersassistent, cohort 2026</text><text x="50" y="554" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Collectie van leeruitkomsten: de leeruitkomsten van kerntaak B1-K1</text><text x="50" y="571" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Functionele koppeling aan Summatieve resultaat structuur</text><rect x="40" y="611" width="476" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(494,616)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="629" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Examen instrument</text><text x="50" y="647" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Beoordelingsformulier proeve B1-K1, vastgesteld</text><rect x="40" y="687" width="611" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(629,692)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="705" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Gewenst medewerker competentieprofiel</text><text x="50" y="723" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examinator met baliepraktijk en toetsbekwaamheid</text><text x="50" y="740" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Toetsvormspecificatie: Proeve van bekwaamheid in de simulatieapotheek</text><path d="M100 194V222" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 222l-6 -10h12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M100 270V298" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 298l-4 -8h8z" fill="#444"/><text x="108" y="288" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">heeft een</text><path d="M100 363V391" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 583V611" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 583l-4 8h8z" fill="#444"/><text x="108" y="601" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Wordt afgenomen door middel van</text><rect x="12" y="760" width="347" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="774" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">conceptplaat: Informatiemodel Onderwijsontwerp</text><text x="369" y="774" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De examencommissie legt het examen op dezelfde manier vast als de</text><text x="369" y="793" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">onderwijsontwerper de eenheid: de toetsvormspecificatie is op de</text><text x="369" y="812" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">conceptplaat een onderwijsvormspecificatie. Zij bepaalt de toetsvorm, het</text><text x="369" y="831" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">instrument en het materiaal, besluit inkopen of construeren, en legt vast</text><text x="369" y="850" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">welke beoordelaar nodig is. De toets verwijst naar de leeruitkomst die zij</text><text x="369" y="869" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">aftikt, het examen naar de collectie leeruitkomsten en naar de</text><text x="369" y="888" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">resultaatstructuur.</text></svg>