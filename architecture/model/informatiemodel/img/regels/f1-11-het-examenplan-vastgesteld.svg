<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 959 267" width="959" height="267"><rect x="0.5" y="0.5" width="958" height="266" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-11 - Het examenplan vastgesteld</text><rect x="12" y="40" width="181" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(171,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">examencommissie</text><rect x="203" y="40" width="245" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(426,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="213" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="213" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examenplan vaststellen</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="449" height="83" rx="0" fill="#e8e8e8" stroke="#9a9a9a" stroke-dasharray="5 3"/><g transform="translate(467,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Examenplan</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examenplan Apothekersassistent, cohort 2026:</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vastgesteld</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: vastgesteld</text><rect x="545" y="112" width="402" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(925,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="555" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatieve resultaat structuur</text><text x="555" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Resultaatstructuur Apothekersassistent:</text><text x="555" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vastgesteld</text><text x="555" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: vastgesteld</text><path d="M489 136H545" stroke="#444" stroke-width="1.3" fill="none"/><path d="M545 136l-8 -4v8z" fill="#444"/><text x="517" y="131" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="middle">kent</text><text x="12" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De examencommissie stelt het examenplan vast, nu de toetsonderdelen, de wegingen en de exameninstrumenten erin</text><text x="12" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">staan. Vaststellen is een eigen stap met een eigen rol: ontwikkelen doet de ontwerper, vaststellen de</text><text x="12" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">commissie. Pas een vastgesteld plan gaat mee naar de catalogus.</text></svg>