et triageprotocol en met een onderbouwd</text><text x="64" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">advies of doorverwijzing, in de</text><text x="64" y="326" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieapotheek (apothekersassistent NLQF 4,</text><text x="64" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkproces B1-K1-W1)</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Verleent farmaceutische patiëntenzorg, volgens</text><text x="50" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">de vigerende protocollen en met navolgbare</text><text x="50" y="194" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">vastlegging, in een levensechte</text><text x="50" y="212" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">apotheekomgeving (apothekersassistent NLQF 4,</text><text x="50" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kerntaak B1-K1)</text><rect x="40" y="394" width="467" height="229" rx="0" fill="#e8e8e8" stroke="#9a9a9a" stroke-dasharray="5 3"/><g transform="translate(485,399)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Competenties / Skills</text><rect x="54" y="453" width="375" height="48" rx="0" fill="#e8e8e8" stroke="#9a9a9a" stroke-dasharray="5 3"/><g transform="translate(407,458)" fill="none" stroke=