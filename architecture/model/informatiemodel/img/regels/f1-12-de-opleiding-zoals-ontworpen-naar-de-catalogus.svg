mst: Biedt farmaceutische patiëntenzorg (kerntaakniveau)</text><text x="64" y="729" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">BOL voltijd</text><text x="50" y="687" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Apothekersassistent, versie 2026.1</text><rect x="750" y="651" width="171" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(899,656)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="760" y="669" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeelruimte</text><text x="760" y="687" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">720 SBU, mbo-4</text><path d="M694 675H750" stroke="#444" stroke-width="1.3" fill="none"/><path d="M694 675l10 -6v12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><rect x="40" y="917" width="449" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(467,922)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="935" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student keuze regelset</text><text x="50" y="953" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kiesbare keuzedelen voor Apothekersassistent</text><text x="50" y="970" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeelruimte hangt aan</text><rect x="40" y="1010" width="606" height="134" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(624,1015)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1028" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatieve resultaat structuur</text><rect x="54" y="1069" width="582" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(614,1074)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsonderdeel specificatie</text><text x="64" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijktoets baliegesprek (OSCE)</text><text x="64" y="1122" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><text x="50" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Resultaatstructuur Apothekersassistent</text><text x="50" y="1063" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patiëntenzorg (kerntaakniveau)</text><rect x="40" y="1172" width="582" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(600,1177)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1190" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examenonderdeelspecificatie</text><text x="50" y="1208" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid B1-K1</text><text x="50" y="1225" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patiëntenzorg (kerntaakniveau)</text><text x="50" y="1242" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Toetsonderdeel specificatie</text><rect x="40" y="1282" width="430" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(448,1287)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeelruimte</text><text x="50" y="1318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">720 SBU, mbo-4: weegt mee in de summatieve</text><text x="50" y="1336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">resultaatstructuur</text><text x="50" y="1353" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><rect x="494" y="1282" width="384" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(856,1287)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="504" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Formatieve resultaat structuur</text><text x="504" y="1318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Concept: de formatieve voortgang per</text><text x="504" y="1336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijseenheid, nog zonder wegingen</text><rect x="40" y="1393" width="458" height="137" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,1398)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1411" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatief Afrondingscriterium</text><text x="50" y="1429" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Alle kerntaken voldoende, de keuzedeelruimte</text><text x="50" y="1447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">gevuld en afgerond, en het basisdeel behaald:</text><text x="50" y="1465" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Nederlands en rekenen op 2F of 3F met een</text><text x="50" y="1483" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">eigen regeling, Engels en loopbaan en</text><text x="50" y="1501" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">burgerschap voldaan</text><text x="50" y="1518" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Summatieve resultaat structuur hangt aan</text><text x="12" y="1552" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De opleiding zoals ontworpen gaat als gelinkt geheel naar de catalogus: leeruitkomsten met hun skills, de</text><text x="12" y="1571" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">specificatiestructuur met het onderwijsontwerp (paars: conceptplaat) en de resultaatstructuur; alles</text><text x="12" y="1590" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verwijst naar de leeruitkomst. Op v1.7 zit de ontwerptool binnen de catalogus, dus geen aparte pijl.</text></svg>