="#5b6663" text-anchor="start">materiaal. Of die onderdelen in de uitwisseling horen, is de vraag die bij de eenheid- en</text><text x="12" y="767" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">examenonderdeelspecificatie staat.</text></svg>