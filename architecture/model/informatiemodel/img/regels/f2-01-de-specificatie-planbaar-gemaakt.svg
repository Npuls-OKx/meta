<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 479" width="1015" height="479"><rect x="0.5" y="0.5" width="1014" height="478" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F2-01 - De specificatie planbaar gemaakt</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="486" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(694,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Specificatie aanvullen tot planbare specificatie</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="676" height="276" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(694,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma specificatie</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">BOL voltijd, planbaar: tijdvensters en capaciteit</text><rect x="54" y="171" width="652" height="207" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(684,176)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="64" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Blok B1-K1, leerjaar 1: plek in de opleidingsduur en groepsgrootte</text><rect x="68" y="230" width="615" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(661,235)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="248" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1-W1: BOT 50 / OOT 50 SBU, praktijkruimte, docent farmacie</text><text x="78" y="283" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: planbaar</text><rect x="68" y="303" width="615" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(661,308)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="321" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1-W2: BOT 30 / OOT 70 SBU, praktijkruimte, docent farmacie</text><text x="78" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: planbaar</text><text x="64" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: planbaar</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: planbaar</text><text x="12" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Planbaar is een rijpheidskenmerk van de specificatie, geen apart object: de planner kan er zonder giswerk aanbod van</text><text x="12" y="429" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">maken. Wat dat betekent verschilt per niveau. Het programma draagt tijdvensters en capaciteit, de eenheid haar plek in</text><text x="12" y="448" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">de opleidingsduur, en het leeronderdeel de organiseerbaarheidswaarden: studiebelasting in BOT en OOT, ruimtetype en</text><text x="12" y="467" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">expertiseprofiel.</text></svg>