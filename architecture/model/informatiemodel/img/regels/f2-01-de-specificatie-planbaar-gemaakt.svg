<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 702" width="608" height="702"><rect x="0.5" y="0.5" width="607" height="701" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F2-01 - De specificatie planbaar gemaakt</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="365" height="66" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(574,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Specificatie aanvullen tot planbare</text><text x="240" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">specificatie</text><path d="M64 106 V126" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 120 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="130" width="515" height="348" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(533,135)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma specificatie</text><rect x="54" y="207" width="491" height="261" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(523,212)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="68" y="284" width="421" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(467,289)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101: BOT 50 / OOT 50 SBU,</text><text x="78" y="338" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">praktijkruimte, docent farmacie</text><text x="78" y="355" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: planbaar</text><rect x="68" y="375" width="467" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(513,380)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="393" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="78" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking in de leerapotheek: BOT 30 /</text><text x="78" y="429" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">OOT 70 SBU, praktijkruimte, docent farmacie</text><text x="78" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: planbaar</text><text x="64" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Blok B1-K1, leerjaar 1: plek in de</text><text x="64" y="261" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">opleidingsduur en groepsgrootte</text><text x="64" y="278" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: planbaar</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">BOL voltijd, planbaar: tijdvensters en</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">capaciteit</text><text x="50" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: planbaar</text><text x="12" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Planbaar is een rijpheidskenmerk van de specificatie, geen apart</text><text x="12" y="519" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">object. Het programma draagt tijdvensters en capaciteit, de</text><text x="12" y="538" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">eenheid haar plek in de opleidingsduur. Op het niveau eronder</text><text x="12" y="557" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">ligt planbaar niet op het losse leeronderdeel maar op de</text><text x="12" y="576" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">gewenste leergelegenheid: de catalogus clustert leeronderdelen</text><text x="12" y="595" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">inhoudelijk tot logistieke eenheden met dezelfde vorm en</text><text x="12" y="614" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">opbouwende fase, en draagt daarbij de</text><text x="12" y="633" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">organiseerbaarheidswaarden. Planning clusteert daarna logistiek:</text><text x="12" y="652" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">kleine lesgroepen bundelen, of leergelegenheden met</text><text x="12" y="671" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verschillende inhoud en verschillende studenten gelijktijdig</text><text x="12" y="690" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">laten plaatsvinden bij dezelfde docent in hetzelfde lokaaltype.</text></svg>