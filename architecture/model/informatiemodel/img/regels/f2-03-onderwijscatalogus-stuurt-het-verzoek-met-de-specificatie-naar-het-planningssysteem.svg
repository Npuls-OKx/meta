d="M2 6.5h12"/></g><text x="64" y="293" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma specificatie</text><rect x="68" y="317" width="1722" height="261" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(1768,322)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="335" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><rect x="82" y="394" width="582" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(642,399)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="92" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="92" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101: BOT 50 uur,</text><text x="92" y="448" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">praktijkruimte, docent farmacie</text><text x="92" y="465" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><rect x="82" y="485" width="1698" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1758,490)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="92" y="503" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="92" y="521" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking in de leerapotheek: BOT 30</text><text x="92" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">uur, praktijkruimte, docent farmacie</text><text x="92" y="556" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert medicatiebewaking uit op signalen uit het apotheeksysteem, volgens het bewakingsprotocol en met overleg bij twijfel, in de leerapotheek onder begeleiding (apothekersassistent NLQF 4, werkprocesniveau)</text><text x="78" y="353" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Blok B1-K1: BOT 80 uur, praktijkruimte, docent</text><text x="78" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">farmacie</text><text x="78" y="388" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patiëntenzorg (kerntaakniveau)</text><text x="64" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">BOL voltijd, planbaar</text><text x="50" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Apothekersassistent, versie 2026.1</text><text x="50" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Input voor Verzoek tot Aanbod / Intekening op specificatie</text><rect x="40" y="626" width="582" height="83" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(600,631)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="644" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Onderwijsvorm specificatie</text><text x="50" y="662" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Simulatie in de leerapotheek, theorie</text><text x="50" y="680" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">ondersteunend</text><text x="50" y="697" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeruitkomst hangt aan: Voert baliegesprek en triage uit (werkprocesniveau)</text><rect x="678" y="626" width="338" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(994,631)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="688" y="644" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Gewenste Onderwijskundige Leeromgeving</text><text x="688" y="662" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Balie-simulatie in het skillslab</text><path d="M622 650H678" stroke="#444" stroke-width="1.3" fill="none"/><rect x="40" y="737" width="449" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(467,742)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="755" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Gewenst medewerker competentieprofiel</text><text x="50" y="773" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Apothekersassistent-docent met baliepraktijk</text><text x="50" y="790" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Onderwijsvorm specificatie</text><rect x="513" y="737" width="416" height="101" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(907,742)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="523" y="755" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Studiebelasting en begeleide onderwijstijd indicatie</text><text x="523" y="773" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Begeleide onderwijstijd: 50 uur voor</text><text x="523" y="791" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, 30 uur voor</text><text x="523" y="809" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking</text><text x="523" y="826" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Onderwijsvorm specificatie</text><rect x="40" y="866" width="467" height="136" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(485,871)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="884" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Nominale Leerroute</text><text x="50" y="902" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Nominale leerroute Apothekersassistent, cohort</text><text x="50" y="920" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">2026: Baliegesprekken 101 in periode 1,</text><text x="50" y="938" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking in de leerapotheek in</text><text x="50" y="956" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 2</text><text x="50" y="973" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleidingsprogramma specificatie hangt aan</text><text x="50" y="990" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toe te voegen aan het informatiemodel</text><rect x="531" y="866" width="460" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(969,871)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="541" y="884" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel specificatie</text><text x="541" y="902" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg (480 SBU,</text><text x="541" y="920" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">aard verdiepend), beroepsspecifiek keuzedeel</text><text x="541" y="937" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Input voor Verzoek tot Aanbod / Intekening op specificatie</text><text x="12" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het verzoek gaat met de hele specificatiestructuur naar planning: de opleiding met haar programma, de eenheden en hun</text><text x="12" y="1043" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeronderdelen, elk met de leeruitkomst waarnaar zij verwijzen, en per eenheid de planbare waarden uit het</text><text x="12" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">onderwijsontwerp (paars): onderwijsvorm, leeromgeving, docentprofiel en studiebelasting. De gewenste periode gaat mee</text><text x="12" y="1081" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">in een eigen laag op de specificatie: de nominale leerroute. De specificatie zelf draagt geen periode, zodat zij</text><text x="12" y="1100" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">herbruikbaar blijft voor een volgend cohort. De conceptplaat kent die laag al onder het onderwijsprogramma; op de</text><text x="12" y="1119" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">informatiemodelplaat staat zij hier als voorstel.</text></svg>