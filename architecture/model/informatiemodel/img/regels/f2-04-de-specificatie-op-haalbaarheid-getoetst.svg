<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 279" width="1024" height="279"><rect x="0.5" y="0.5" width="1023" height="278" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F2-04 - De specificatie op haalbaarheid getoetst</text><rect x="0" y="0" width="4" height="279" fill="#5aa8a8"/><rect x="12" y="54" width="59" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">OC-P&amp;R</text><rect x="83" y="40" width="190" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(251,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="93" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="93" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Planningssysteem</text><path d="M279.03999999999996 64H793.5599999999998" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M791.5599999999998 58l10 6-10 6z" fill="#2a5a5a"/><rect x="804" y="40" width="208" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(990,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="814" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="814" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Onderwijscatalogus</text><rect x="12" y="90" width="304" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Specificatie op haalbaarheid toetsen</text><path d="M293.03999999999996 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="449" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(467,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Planopgave Apothekersassistent, cohort 2026:</text><text x="50" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">niet haalbaar op docentexpertise</text><rect x="573" y="122" width="439" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(990,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="583" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="583" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Blok B1-K1: de gevraagde docentexpertise is</text><text x="583" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">binnen een jaar niet te verwerven</text><path d="M489 146H573" stroke="#444" stroke-width="1.3" fill="none"/><path d="M489 146l8 -4v8z" fill="#444"/><text x="531" y="141" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="middle">Input voor</text><text x="12" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Planning zet drie stappen voordat er aanbod ligt. Eerst de toets op de specificatie zelf: een eis die niet te</text><text x="12" y="229" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">realiseren is gaat hier terug, nog voor er iets gepland wordt. Daarna volgt de aanbodvraag per opleiding naast de</text><text x="12" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">maxima, en daarna de jaarplanning op instellingsniveau. Elke stap kent haar eigen terugkoppeling, met een eigen</text><text x="12" y="267" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">ontvanger en een eigen oplossing.</text></svg>