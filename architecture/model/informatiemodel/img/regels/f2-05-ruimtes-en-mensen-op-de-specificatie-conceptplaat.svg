<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 667" width="1110" height="667"><rect x="0.5" y="0.5" width="1109" height="666" rx="10" fill="#ffffff" stroke="#d8ddda" stroke-dasharray="6 4"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F2-05 - Ruimtes en mensen op de specificatie (conceptplaat)</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="393" height="65" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(513,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Haalbaarheid bepalen en aanbod plannen</text><text x="152" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: ruimtes en mensen op de specificatie</text><path d="M64 105 V125" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 119 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="129" width="412" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(430,134)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Lokaaltypes</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Balie-simulatie (skillslab), 24 plaatsen</text><rect x="40" y="205" width="920" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(938,210)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Schaarste van middelen</text><text x="50" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Twee simulatieruimtes: bij tien weken en tien lesuren per dag samen 1000 lokaaluren per periode</text><rect x="40" y="281" width="901" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(919,286)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="299" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Onderwijsaanbod Model</text><text x="50" y="317" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jaarplan 2026-2027: prognose 48 instromers, twee groepen van 24, vier perioden van tien weken</text><rect x="40" y="357" width="1058" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(1076,362)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="375" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Schaartste van mensen</text><text x="50" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Drie docenten met baliepraktijk: bij 80 procent inzet op uitvoering samen 1200 uur docentexpertise per periode</text><rect x="40" y="433" width="402" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(420,438)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="451" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Medewerker</text><text x="50" y="469" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent 4711, apothekersassistent-docent</text><path d="M100 177V205" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 253V281" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 329V357" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 405V433" stroke="#444" stroke-width="1.3" fill="none"/><rect x="12" y="489" width="347" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="503" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">conceptplaat: Informatiemodel Onderwijsontwerp</text><text x="369" y="503" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Conceptplaat: haalbaarheid komt niet uit de specificatie alleen. De specificatie is</text><text x="369" y="522" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">input voor een functie binnen planning, die haar combineert met de prognose op</text><text x="369" y="541" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">studentaantallen en met de toegewezen capaciteit aan mensen en middelen. De</text><text x="369" y="560" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">doorrekening loopt zo: uit de prognose volgt het aantal groepen voor de nieuwe</text><text x="369" y="579" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">instroom, per groep gaat het standaard jaarplan erin met de te roosteren lesuren per</text><text x="369" y="598" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leergelegenheid per periode, en dat opgeteld over alle opleidingen in dezelfde</text><text x="369" y="617" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">organisatie-eenheid geeft de vraag per lokaaltype en per docentexpertise. Daar staat</text><text x="369" y="636" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">de beschikbare capaciteit tegenover. Naarmate de flexibiliseringsgraad stijgt, wordt</text><text x="369" y="655" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">die vraag lastiger te voorspellen.</text></svg>