<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 977 737" width="977" height="737"><rect x="0.5" y="0.5" width="976" height="736" rx="10" fill="#ffffff" stroke="#d8ddda" stroke-dasharray="6 4"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F2-05 - Ruimtes en mensen op de specificatie (conceptplaat)</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="393" height="65" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(513,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Haalbaarheid bepalen en aanbod plannen</text><text x="152" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: ruimtes en mensen op de specificatie</text><path d="M64 105 V125" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 119 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="129" width="412" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(430,134)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Lokaaltypes</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Balie-simulatie (skillslab), 24 plaatsen</text><rect x="508" y="129" width="458" height="84" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(943,134)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="518" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Schaarste van middelen</text><text x="518" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Twee simulatieruimtes: bij tien weken en tien</text><text x="518" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">lesuren per dag samen 1000 lokaaluren per</text><text x="518" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode</text><rect x="508" y="241" width="439" height="84" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(925,246)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="518" y="259" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Onderwijsaanbod Model</text><text x="518" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jaarplan 2026-2027: prognose 36 instromers,</text><text x="518" y="295" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">twee groepen van 18, vier perioden van tien</text><text x="518" y="313" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">weken</text><rect x="508" y="353" width="430" height="84" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(916,358)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="518" y="371" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Schaartste van mensen</text><text x="518" y="389" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Drie docenten met baliepraktijk: bij 80</text><text x="518" y="407" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">procent inzet op uitvoering samen 1200 uur</text><text x="518" y="425" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">docentexpertise per periode</text><rect x="508" y="465" width="402" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(888,470)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="518" y="483" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Medewerker</text><text x="518" y="501" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent 4711, apothekersassistent-docent</text><path d="M452 153H508" stroke="#444" stroke-width="1.3" fill="none"/><path d="M568 213V241" stroke="#444" stroke-width="1.3" fill="none"/><path d="M568 325V353" stroke="#444" stroke-width="1.3" fill="none"/><path d="M568 437V465" stroke="#444" stroke-width="1.3" fill="none"/><rect x="12" y="521" width="347" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="535" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">conceptplaat: Informatiemodel Onderwijsontwerp</text><text x="369" y="535" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Conceptplaat: haalbaarheid komt niet uit de specificatie alleen. De</text><text x="369" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">specificatie is input voor een functie binnen planning, die haar</text><text x="369" y="573" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">combineert met de prognose op studentaantallen en met de toegewezen</text><text x="369" y="592" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">capaciteit aan mensen en middelen. De doorrekening loopt zo: uit de</text><text x="369" y="611" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">prognose volgt het aantal groepen voor de nieuwe instroom, per groep</text><text x="369" y="630" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">gaat het standaard jaarplan erin met de te roosteren lesuren per</text><text x="369" y="649" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leergelegenheid per periode, en dat opgeteld over alle opleidingen in</text><text x="369" y="668" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">dezelfde organisatie-eenheid geeft de vraag per lokaaltype en per</text><text x="369" y="687" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">docentexpertise. Daar staat de beschikbare capaciteit tegenover.</text><text x="369" y="706" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Naarmate de flexibiliseringsgraad stijgt, wordt die vraag lastiger te</text><text x="369" y="725" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">voorspellen.</text></svg>