d="M2 6.5h12"/></g><text x="50" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Meerjaren planning</text><rect x="54" y="189" width="439" height="66" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(471,194)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="207" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Jaarplanning</text><text x="64" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jaarplanning 2026-2027: de totale vraag per</text><text x="64" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode naast de toegewezen capaciteit</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Meerjarenplanning ROC Leren Zonder Drempels:</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">zestien opleidingen op een locatie</text><rect x="511" y="129" width="510" height="83" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(999,134)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="521" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Jaarplanningsbeperkingen</text><text x="521" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Periode 3: tekort aan docentexpertise</text><text x="521" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">integraal beroepsspecifiek</text><text x="521" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijsaanbod Model Leidt via planning en roostering proces tot</text><rect x="12" y="273" width="347" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="287" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">conceptplaat: Informatiemodel Onderwijsontwerp</text><text x="369" y="287" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Conceptplaat: hier komt de vraag van de hele instelling bij elkaar. Per</text><text x="369" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">locatie telt planning de aanbodvraag van alle opleidingen op en legt die</text><text x="369" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">naast de toegewezen capaciteit aan lokalen en docentexpertise. Wat knelt, kan</text><text x="369" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">ook buiten de specificatie worden opgelost: een gebouw bijhuren, of docenten</text><text x="369" y="363" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">aantrekken met de expertise die pas in periode 3 nodig is. Die route loopt</text><text x="369" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">naar inzetplanning en faciliteitenplanning, en die staan buiten de scope van</text><text x="369" y="401" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">OKx.</text></svg>