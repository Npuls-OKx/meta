<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 785 751" width="785" height="751"><rect x="0.5" y="0.5" width="784" height="750" rx="10" fill="#ffffff" stroke="#d8ddda" stroke-dasharray="6 4"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F2-07 - Examenbehoefte uit de resultaatstructuur (conceptplaat)</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="458" height="65" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(578,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jaarplanning op instellingsniveau vaststellen</text><text x="152" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: examenplanning uit de resultaatstructuur</text><path d="M64 105 V125" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 119 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="129" width="245" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(263,134)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Jaarplanning</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jaarplanning 2026-2027</text><rect x="40" y="205" width="482" height="118" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(500,210)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Jaarplanning examens</text><rect x="54" y="247" width="458" height="66" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(490,252)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="265" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Examenmoment</text><text x="64" y="283" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Vakexamen Nederlands 3F, cohort 2026: periode</text><text x="64" y="301" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">8</text><text x="50" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examenmomenten cohort 2026</text><rect x="40" y="351" width="421" height="66" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(439,356)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="369" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Examen instrument</text><text x="50" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Digitale examenomgeving voor het centraal</text><text x="50" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">examen Nederlands 3F</text><rect x="40" y="445" width="733" height="82" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(751,450)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Examen</text><text x="50" y="481" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Centraal examen Nederlands 3F</text><text x="50" y="498" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Functionele koppeling aan Summatieve resultaat structuur: Resultaatstructuur Apothekersassistent</text><text x="50" y="515" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Examenplan is uitgewekt in: Examenplan Apothekersassistent, cohort 2026</text><path d="M100 177V205" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 323V351" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 351l-4 -8h8z" fill="#444"/><text x="108" y="341" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Afgenomen tijdens</text><path d="M100 417V445" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 445l-4 -8h8z" fill="#444"/><text x="108" y="435" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Wordt afgenomen door middel van</text><rect x="12" y="535" width="347" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="549" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">conceptplaat: Informatiemodel Onderwijsontwerp</text><text x="369" y="549" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Conceptplaat: de examenbehoefte volgt uit de</text><text x="369" y="568" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">resultaatstructuur en uit de jaarplanning. Het</text><text x="369" y="587" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">voorbeeld gebruikt een generiek vakexamen, want</text><text x="369" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">dat is cohort- en periodegebonden en loopt</text><text x="369" y="625" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">daarmee door de planning; een proeve van</text><text x="369" y="644" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">bekwaamheid wordt individueel afgenomen zodra de</text><text x="369" y="663" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">student er klaar voor is. Op de</text><text x="369" y="682" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">informatiemodelplaat blijft het examenplan</text><text x="369" y="701" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">buiten de uitwisseling (ontwerpkeuze 10); de</text><text x="369" y="720" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">enige lijn die OKx hier draagt is het summatieve</text><text x="369" y="739" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">resultaat in de resultaatstructuur.</text></svg>