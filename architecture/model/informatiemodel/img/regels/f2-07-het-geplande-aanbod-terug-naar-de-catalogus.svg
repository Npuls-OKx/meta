-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie hangt aan: Blok B1-K1</text><text x="92" y="454" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><text x="78" y="327" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="78" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleidingsprogramma specificatie hangt aan: BOL voltijd, planbaar</text><text x="78" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><text x="64" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="64" y="251" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleiding specificatie hangt aan: Apothekersassistent, versie 2026.1</text><text x="64" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: intentie</text><rect x="40" y="627" width="776" height="99" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(794,632)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="645" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsgelegenheid</text><text x="50" y="663" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijktoets baliegesprek (OSCE), einde periode 1</text><text x="50" y="680" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: fijnmazig gepland</text><text x="50" y="697" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Toetsonderdeel specificatie hangt aan: Praktijktoets baliegesprek</text><text x="50" y="714" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><rect x="40" y="754" width="901" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(919,759)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="772" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeelaanbod</text><text x="50" y="790" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7: een groep van 18, los van het opleidingsaanbod</text><text x="50" y="807" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: fijnmazig gepland</text><text x="50" y="824" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel hangt aan: K0037 Farmaceutische Patientenzorg</text><text x="12" y="858" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het geplande aanbod gaat terug naar de catalogus, met per laag de verwijzing naar de specificatie waarvan het is</text><text x="12" y="877" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">gemaakt en naar het verzoek dat ertoe leidde. Capaciteit met exacte getallen vrijgeven vraagt een hoge organisatorische</text><text x="12" y="896" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">volwassenheid, want het is een toezegging. Voor een aantal logistieke scenario&#x27;s is het wel voorwaarde. Naarmate keuzes</text><text x="12" y="915" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">fijnmaziger worden verliest capaciteit op de bovenliggende laag haar waarde: een leergelegenheid die vanuit meerdere</text><text x="12" y="934" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">programma&#x27;s wordt aangeboden heeft een eigen capaciteit, los van het opleidingsaanbod.</text></svg>