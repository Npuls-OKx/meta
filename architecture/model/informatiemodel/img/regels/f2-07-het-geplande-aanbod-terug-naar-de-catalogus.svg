wijseenheid specificatie hangt aan: Blok B1-K1</text><text x="92" y="454" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><text x="78" y="327" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="78" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleidingsprogramma specificatie hangt aan: BOL voltijd, planbaar</text><text x="78" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><text x="64" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="64" y="251" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleiding specificatie hangt aan: Apothekersassistent, versie 2026.1</text><text x="64" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: intentie</text><rect x="40" y="627" width="776" height="99" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(794,632)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="645" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsgelegenheid</text><text x="50" y="663" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-an