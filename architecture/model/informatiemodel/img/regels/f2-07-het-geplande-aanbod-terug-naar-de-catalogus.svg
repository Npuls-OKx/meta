bod</text><rect x="96" y="478" width="776" height="117" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(850,483)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="106" y="496" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="106" y="514" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, periode 1, twee groepen</text><text x="106" y="532" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">van 18</text><text x="106" y="549" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: fijnmazig gepland</text><text x="106" y="566" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel specificatie hangt aan: Baliegesprekken 101</text><text x="106" y="583" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><text x="92" y="421" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1, leerjaar 1, periode 1 tot 4</text><text x="92" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="92" y="455" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie hangt aan: Blok B1-K1</text><text x="92" y="472" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><text x="78" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Regulier BOL 2026: 18 tot 36 studenten</text><text x="78" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="78" y="362" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleidingsprogramma specificatie hangt aan: BOL voltijd, planbaar</text><text x="78" y="379" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><text x="64" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Apothekersassistent 2026: vier perioden, 36</text><text x="64" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">plaatsen</text><text x="64" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="64" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleiding specificatie hangt aan: Apothekersassistent, versie 2026.1</text><text x="64" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">ROC Leren Zonder Drempels</text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: intentie</text><rect x="40" y="663" width="776" height="117" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(794,668)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="681" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsgelegenheid</text><text x="50" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijktoets baliegesprek (OSCE), einde</text><text x="50" y="717" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 1</text><text x="50" y="734" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: fijnmazig gepland</text><text x="50" y="751" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Toetsonderdeel specificatie hangt aan: Praktijktoets baliegesprek</text><text x="50" y="768" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026</text><rect x="40" y="808" width="467" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(485,813)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="826" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeelaanbod</text><text x="50" y="844" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7:</text><text x="50" y="862" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">een groep van 18, los van het opleidingsaanbod</text><text x="50" y="879" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: fijnmazig gepland</text><text x="50" y="896" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel hangt aan: K0037 Farmaceutische Patientenzorg</text><text x="12" y="930" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het geplande aanbod gaat terug naar de catalogus, met per laag de verwijzing naar de specificatie waarvan</text><text x="12" y="949" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het is gemaakt en naar het verzoek dat ertoe leidde. Capaciteit met exacte getallen vrijgeven vraagt een</text><text x="12" y="968" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">hoge organisatorische volwassenheid, want het is een toezegging. Voor een aantal logistieke scenario&#x27;s is</text><text x="12" y="987" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het wel voorwaarde. Naarmate keuzes fijnmaziger worden verliest capaciteit op de bovenliggende laag haar</text><text x="12" y="1006" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">waarde: een leergelegenheid die vanuit meerdere programma&#x27;s wordt aangeboden heeft een eigen capaciteit,</text><text x="12" y="1025" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">los van het opleidingsaanbod.</text></svg>