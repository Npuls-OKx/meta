t-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1, leerjaar 1, periode 1 tot 4</text><text x="92" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="78" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Regulier BOL 2026: 18 tot 36 studenten</text><text x="78" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="64" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Apothekersassistent 2026: vier perioden, 36</text><text x="64" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">plaatsen</text><text x="64" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">ROC Leren Zonder Drempels: ambitie en</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">verwachte instroom voor cohort 2026</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: intentie</text><rect x="40" y="535" width="412" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(430,540)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="553" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsgelegenheid</text><text x="50" y="571" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijktoets baliegesprek (OSCE), einde</text><text x="50" y="589" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 1</text><text x="50" y="606" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: grofmazig gepland</text><text x="50" y="623" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Toetsonderdeel specificatie hangt aan</text><rect x="40" y="663" width="430" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(448,668)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="681" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Plaatsingsgroep</text><text x="50" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">APO26-1A: 18 mock-studenten, de eerste van</text><text x="50" y="717" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">twee plaatsingsgroepen</text><rect x="40" y="757" width="338" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(356,762)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="775" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="793" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1 periode 1: APO26-1A met 18</text><text x="50" y="811" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">mock-studenten</text><rect x="40" y="851" width="712" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(730,856)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="869" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Lesgroep</text><text x="50" y="887" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101-A (concept): 18</text><text x="50" y="905" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">mock-studenten</text><text x="50" y="922" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op Leergelegenheid (voorstel): Baliegesprekken 101, periode 1, twee groepen van 18</text><rect x="40" y="962" width="1007" height="134" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1025,967)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="980" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod</text><text x="50" y="998" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7,</text><text x="50" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">locatie A</text><text x="50" y="1033" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="50" y="1050" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma aanbod</text><text x="50" y="1067" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel specificatie wordt aangeboden als: K0037 Farmaceutische Patientenzorg (480 SBU, aard verdiepend), beroepsspecifiek keuzedeel</text><text x="50" y="1084" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026, met het keuzedeel K0037</text><rect x="40" y="1124" width="402" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(420,1129)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="1160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 periode 7, locatie A: prognose 18</text><text x="50" y="1178" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">mock-studenten</text><path d="M100 729V757" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 729l-5 7l5 7l5 -7z" fill="#444" stroke="#444" stroke-width="1.3"/><path d="M100 823V851" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 851l-4 -8h8z" fill="#444"/><text x="108" y="841" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">vormt (voorstel)</text><path d="M100 1096V1124" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 1096l-4 8h8z" fill="#444"/><text x="108" y="1114" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">is gepland op (voorstel)</text><path d="M378 795H1069V559H452" stroke="#1f6fb2" stroke-width="1.3" fill="none"/><path d="M452 559l8 -4v8z" fill="#1f6fb2"/><text x="1105" y="563" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1f6fb2" text-anchor="start">is gepland op (voorstel)</text><path d="M470 687H1065A4 4 0 0 1 1073 687H1083V290H565" stroke="#b5651d" stroke-width="1.3" fill="none"/><path d="M565 290l8 -4v8z" fill="#b5651d"/><text x="1105" y="294" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#b5651d" text-anchor="start">is gepland op (voorstel)</text><path d="M378 781H1065A4 4 0 0 1 1073 781H1097V349H1087A4 4 0 0 0 1079 349H555" stroke="#11776b" stroke-width="1.3" fill="none"/><path d="M555 349l8 -4v8z" fill="#11776b"/><text x="1105" y="353" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#11776b" text-anchor="start">is gepland op (voorstel)</text><text x="12" y="1212" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het aanbod rijpt in tredes die met de planningshorizon meelopen. In de meerjarenplanning staat de intentie: welke</text><text x="12" y="1231" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">opleiding, met welke verwachte instroom. In de jaarplanning wordt het aanbod gepland met perioden en capaciteit, nog</text><text x="12" y="1250" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">zonder lokalen en docenten. De planner verwacht twee plaatsingsgroepen van 18 te vullen en zet op de onderwijseenheid</text><text x="12" y="1269" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">een eerste planningsgroep, op de leergelegenheid een concept-lesgroep en op de toets dezelfde groep, alle met</text><text x="12" y="1288" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">mock-studenten. Zo draait een eerste roosteriteratie en blijkt of het aanbod haalbaar is. Het keuzedeelaanbod K0037</text><text x="12" y="1307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">krijgt zo een planningsgroep op de prognose; in fase 6 komen de echte keuzes ervoor in de plaats.</text></svg>