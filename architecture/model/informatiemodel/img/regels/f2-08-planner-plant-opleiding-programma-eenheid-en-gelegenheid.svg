<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 1001" width="1008" height="1001"><rect x="0.5" y="0.5" width="1007" height="1000" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F2-08 - Planner plant opleiding, programma, eenheid en gelegenheid</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="171" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(291,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Aanbod plannen</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="545" height="395" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(563,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsaanbod van Instelling</text><rect x="54" y="189" width="521" height="308" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(553,194)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="207" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleiding aanbod</text><rect x="68" y="266" width="497" height="221" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(543,271)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="78" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma aanbod</text><rect x="82" y="325" width="473" height="152" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(533,330)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="92" y="343" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><rect x="96" y="384" width="449" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(523,389)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="106" y="402" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="106" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, periode 1, twee groepen</text><text x="106" y="438" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">van 18</text><text x="106" y="455" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: grofmazig gepland</text><text x="92" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1, leerjaar 1, periode 1 tot 4</text><text x="92" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="78" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Regulier BOL 2026: 18 tot 36 studenten</text><text x="78" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="64" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Apothekersassistent 2026: vier perioden, 36</text><text x="64" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">plaatsen</text><text x="64" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">ROC Leren Zonder Drempels: ambitie en</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">verwachte instroom voor cohort 2026</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: intentie</text><rect x="40" y="535" width="412" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(430,540)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="553" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsgelegenheid</text><text x="50" y="571" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijktoets baliegesprek (OSCE), einde</text><text x="50" y="589" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 1</text><text x="50" y="606" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: grofmazig gepland</text><text x="50" y="623" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Toetsonderdeel specificatie hangt aan</text><rect x="40" y="663" width="956" height="134" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(974,668)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="681" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod</text><text x="50" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7,</text><text x="50" y="717" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">locatie A</text><text x="50" y="734" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="50" y="751" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma aanbod</text><text x="50" y="768" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel specificatie wordt aangeboden als: K0037 Farmaceutische Patientenzorg (480 SBU, verdiepend)</text><text x="50" y="785" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie Leidt tot: Planopgave Apothekersassistent, cohort 2026, met het keuzedeel K0037</text><rect x="40" y="825" width="402" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(420,830)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="843" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="861" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 periode 7, locatie A: prognose 18</text><text x="50" y="879" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">studenten</text><path d="M100 797V825" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 797l-4 8h8z" fill="#444"/><text x="108" y="815" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">plant (voorstel)</text><text x="12" y="913" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het aanbod rijpt in tredes die met de planningshorizon meelopen. In de meerjarenplanning staat de intentie: welke</text><text x="12" y="932" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">opleiding, met welke verwachte instroom. In de jaarplanning wordt het aanbod gepland met perioden en capaciteit, nog</text><text x="12" y="951" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">zonder lokalen en docenten. In de periodeplanning worden de gelegenheden fijnmazig gepland, met groepen en</text><text x="12" y="970" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">tijdvensters. Roosteren volgt daarna en valt buiten de uitwisseling. Het keuzedeelaanbod K0037 wordt in de</text><text x="12" y="989" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">jaarplanning vastgesteld, met een planningsgroep op de prognose; in fase 6 werkt de planner het per laag uit.</text></svg>