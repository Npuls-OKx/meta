, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7, locatie A: prognose 30, dus twee groepen</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="50" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel hangt aan: K0037 Farmaceutische Patientenzorg</text><rect x="40" y="222" width="1262" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1280,227)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="50" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7, planninggroep KD-A, maximaal 24: lokaaltype balie-simulatie, docentexpertise farmacie</text><text x="50" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="50" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel specificatie hangt aan: het leeronderdeel van K0037 waaruit de leergelegenheid rijpt</text><rect x="40" y="332" width="1262" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1280,337)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="50" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7, planninggroep KD-B, maximaal 24: lokaaltype balie-simulatie, docentexpertise farmacie</text><text x="50" y="385" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="50" y="402" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel specificatie hangt aan: het leeronderdeel van K0037 waaruit de leergelegenheid rijpt</text><text x="12" y="436" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De planner plant het keuzedeel vooraf op inzetbare capaciteit en een prognose van 30 studenten: twee planninggroepen van maximaal 24, omdat docenten met</text><text x="12" y="455" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">de juiste expertise en balie-simulatieruimtes maar beperkt schaalbaar zijn.</text></svg>