<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 536 287" width="536" height="287"><rect x="0.5" y="0.5" width="535" height="286" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F3-05 - Intake: student en plaatsingsgroep</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">SLB&#x27;er</text><rect x="142" y="40" width="301" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(421,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Intake doorlopen en plaatsen</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="218" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(236,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, cohort 2026</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Persoon</text><rect x="266" y="112" width="258" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(502,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="276" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Plaatsingsgroep</text><text x="276" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">APO26-1A</text><text x="276" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Persoon Worden gegroepeerd via</text><text x="12" y="199" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De SLB&#x27;er voert de intake uit en plaatst Jochem in een</text><text x="12" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">plaatsingsgroep. Een keuzedeelvoorkeur legt zij hier nog</text><text x="12" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">niet vast: dat is bij de intake niet gebruikelijk, en de</text><text x="12" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">definitieve keuze valt pas minimaal een periode voor de</text><text x="12" y="275" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">keuzedeelruimte in het programma.</text></svg>