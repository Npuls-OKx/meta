<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 242" width="1015" height="242"><rect x="0.5" y="0.5" width="1014" height="241" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F3-06 - De eerste keuzedeelvoorkeur naar het studentkeuzesysteem</text><rect x="0" y="0" width="4" height="242" fill="#5aa8a8"/><rect x="12" y="54" width="203" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">geen pijl op de hoofdplaat</text><rect x="227" y="40" width="171" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(377,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="237" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="237" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Intake systeem</text><path d="M404.56 64H634.56" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M632.56 58l10 6-10 6z" fill="#2a5a5a"/><rect x="645" y="40" width="291" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(914,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="655" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="655" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Student Keuze Systeem (SKS)</text><rect x="12" y="90" width="246" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Intake doorlopen en plaatsen</text><path d="M418.56 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="698" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(716,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voorlopige keuzedeelvoorkeur: K0037 Farmaceutische Patientenzorg, top 3</text><text x="12" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De intake legt hooguit een voorlopige voorkeur vast; kiezen gebeurt in het studentkeuzesysteem. Die eerste voorkeur</text><text x="12" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">gaat daarom mee naar het SKS, dat haar vasthoudt tot de keuzedeelruimte nadert en de student zijn geprioriteerde lijst</text><text x="12" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">samenstelt.</text></svg>