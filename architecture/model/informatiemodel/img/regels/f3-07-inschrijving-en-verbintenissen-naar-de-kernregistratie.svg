<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1295 576" width="1295" height="576"><rect x="0.5" y="0.5" width="1294" height="575" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F3-07 - Inschrijving en verbintenissen naar de kernregistratie</text><rect x="0" y="0" width="4" height="576" fill="#5aa8a8"/><rect x="12" y="54" width="218" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">zonder koppelingspecificatie</text><rect x="242" y="40" width="393" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(613,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="252" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="252" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voorziening Centraal Aanmelden (CAMBO)</text><path d="M640.72 64H870.72" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M868.72 58l10 6-10 6z" fill="#2a5a5a"/><rect x="881" y="40" width="402" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(1261,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="891" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="891" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kernregistratie systeem studenten (KRS)</text><rect x="12" y="90" width="462" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Persoon en verbintenissen vastleggen in de kernregistratie</text><path d="M654.72 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V211" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V304" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="539" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(557,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Inschrijving</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Juni 2026</text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Aanmelding Wordt na formalisatie: April 2026, Apothekersassistent BOL</text><rect x="40" y="215" width="452" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(470,220)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Persoon</text><text x="50" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, 17, na het vmbo</text><text x="50" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Aanmelding: April 2026, Apothekersassistent BOL</text><rect x="548" y="215" width="218" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(744,220)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="558" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student</text><text x="558" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, cohort 2026</text><path d="M492 239H548" stroke="#444" stroke-width="1.3" fill="none"/><path d="M492 239l10 -6v12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><rect x="40" y="308" width="356" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(374,313)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleiding aanbod verbintenis</text><text x="50" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Apothekersassistent 2026</text><text x="50" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><text x="50" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Plaatsingsgroep hangt aan</text><rect x="420" y="308" width="316" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(714,313)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="430" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma aanbod verbintenis</text><text x="430" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Regulier BOL 2026</text><text x="430" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><text x="430" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Plaatsingsgroep hangt aan</text><text x="12" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Bij een positieve uitkomst van de intake wordt de aanmelding een inschrijving, en de</text><text x="12" y="431" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">voorziening voor centraal aanmelden draagt die over aan de kernregistratie, samen met de</text><text x="12" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">persoon en de verbintenissen die daarmee op ingeschreven staan. Dat is de lijn die</text><text x="12" y="469" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">hoofdplaat v1.7a kent: Persoon(Student) Opleidingprogramma verbintenis loopt rechtstreeks</text><text x="12" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">van de voorziening naar de kernregistratie. Vanaf dat moment is de kernregistratie de</text><text x="12" y="507" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">bron voor persoon en plaatsing, en registreert zij later de definitieve keuze. Het rijpen</text><text x="12" y="526" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">van die keuze gebeurt in het studentkeuzesysteem. De plaatsingsgroep zit hier niet bij:</text><text x="12" y="545" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">zij wordt in de kernregistratie gevormd nadat de intake is afgerond, en gaat van daaruit</text><text x="12" y="564" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">naar het keuzesysteem (F3-08) en naar planning (F4-06).</text></svg>