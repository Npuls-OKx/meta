<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1059 557" width="1059" height="557"><rect x="0.5" y="0.5" width="1058" height="556" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F3-07 - Inschrijving en verbintenissen naar de kernregistratie</text><rect x="0" y="0" width="4" height="557" fill="#5aa8a8"/><rect x="12" y="54" width="203" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">geen pijl op de hoofdplaat</text><rect x="227" y="40" width="171" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(377,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="237" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="237" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Intake systeem</text><path d="M404.56 64H634.56" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M632.56 58l10 6-10 6z" fill="#2a5a5a"/><rect x="645" y="40" width="402" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(1025,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="655" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="655" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kernregistratie systeem studenten (KRS)</text><rect x="12" y="90" width="462" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Persoon en verbintenissen vastleggen in de kernregistratie</text><path d="M418.56 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V211" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V304" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="539" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(557,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Inschrijving</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Juni 2026</text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Aanmelding Wordt na formalisatie: April 2026, Apothekersassistent BOL</text><rect x="40" y="215" width="452" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(470,220)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Persoon</text><text x="50" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, 17, na het vmbo</text><text x="50" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Aanmelding: April 2026, Apothekersassistent BOL</text><rect x="548" y="215" width="218" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(744,220)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="558" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student</text><text x="558" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, cohort 2026</text><path d="M492 239H548" stroke="#444" stroke-width="1.3" fill="none"/><path d="M492 239l10 -6v12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><rect x="40" y="308" width="356" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(374,313)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleiding aanbod verbintenis</text><text x="50" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Apothekersassistent 2026</text><text x="50" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><text x="50" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Plaatsingsgroep hangt aan</text><rect x="420" y="308" width="316" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(714,313)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="430" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma aanbod verbintenis</text><text x="430" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Regulier BOL 2026</text><text x="430" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><text x="430" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Plaatsingsgroep hangt aan</text><text x="12" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Bij een positieve uitkomst zet het intakesysteem de aanmelding om in een inschrijving en</text><text x="12" y="431" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">draagt die over aan de kernregistratie, samen met de persoon en de verbintenissen die</text><text x="12" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">daarmee op ingeschreven staan. Vanaf dat moment is de kernregistratie de bron voor</text><text x="12" y="469" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">persoon en plaatsing, en registreert zij later de definitieve keuze. Het rijpen van die</text><text x="12" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">keuze gebeurt in het studentkeuzesysteem. De plaatsingsgroep zit hier niet bij: het</text><text x="12" y="507" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">intakesysteem heeft geen zicht op wie er voor de start bij elkaar gegroepeerd zijn. Die</text><text x="12" y="526" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">groep wordt in de kernregistratie gevormd, nadat de intake is afgerond, en gaat van</text><text x="12" y="545" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">daaruit naar het keuzesysteem (F3-08) en naar planning (F4-06).</text></svg>