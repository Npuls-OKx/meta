ansform="translate(236,220)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student</text><text x="50" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, cohort 2026</text><text x="50" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Persoon</text><rect x="282" y="215" width="258" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(518,220)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="292" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Plaatsingsgroep</text><text x="292" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">APO26-1A</text><text x="292" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Persoon Worden gegroepeerd via</text><rect x="596" y="215" width="356" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(930,220)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="606" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleiding aanbod verbintenis</text><text x="606" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Apothekersassistent 2026</text><text x="606" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><path d="M540 239H596" stroke="#444" stroke-width="1.3" fill="none"/><rect x="40" y="308" width="316" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(334,313)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma aanbod verbintenis</text><text x="50" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Regulier BOL 2026</text><text x="50" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><text x="50" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Plaatsingsgroep hangt aan</text><text x="12" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Bij een positieve uitkomst zet het intakesysteem de aanmelding om in een inschrijving en draagt die over aan de</text><text x="12" y="431" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">kernregistratie, samen met de persoon en de verbintenissen die daarmee op ingeschreven staan. Vanaf dat moment is de</text><text x="12" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">kernregistratie de bron voor persoon en plaatsing.</text></svg>