<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1193 316" width="1193" height="316"><rect x="0.5" y="0.5" width="1192" height="315" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F3-08 - Student, verbintenis en keuzedeelvoorkeur van de kernregistratie naar het studentkeuzesysteem</text><rect x="0" y="0" width="4" height="316" fill="#5aa8a8"/><rect x="12" y="54" width="218" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">zonder koppelingspecificatie</text><rect x="242" y="40" width="402" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(622,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="252" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="252" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kernregistratie systeem studenten (KRS)</text><path d="M649.96 64H879.96" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M877.96 58l10 6-10 6z" fill="#2a5a5a"/><rect x="890" y="40" width="291" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(1159,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="900" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="900" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Student Keuze Systeem (SKS)</text><rect x="12" y="90" width="462" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Persoon en verbintenissen vastleggen in de kernregistratie</text><path d="M663.96 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V211" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="218" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(236,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, cohort 2026</text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Persoon</text><rect x="282" y="122" width="421" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(680,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="292" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma aanbod verbintenis</text><text x="292" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Regulier BOL 2026, ingeschreven</text><text x="292" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleidingsprogramma aanbod hangt aan</text><rect x="726" y="122" width="258" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(962,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="736" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Plaatsingsgroep</text><text x="736" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">APO26-1A</text><text x="736" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Persoon Worden gegroepeerd via</text><rect x="40" y="215" width="698" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(716,220)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Verzoek tot Aanbod / Intekening op specificatie</text><text x="50" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voorlopige keuzedeelvoorkeur: K0037 Farmaceutische Patientenzorg, top 3</text><text x="12" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De kernregistratie geeft door wie er in het keuzesysteem mag kiezen: de student met zijn programmaverbintenis en zijn</text><text x="12" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">groep, en de voorlopige voorkeur uit de intake als startpunt. Kiezen zelf gebeurt later, als de keuzedeelruimte nadert.</text></svg>