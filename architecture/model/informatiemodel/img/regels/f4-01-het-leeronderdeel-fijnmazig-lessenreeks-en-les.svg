<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 520" width="728" height="520"><rect x="0.5" y="0.5" width="727" height="519" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F4-01 - Het leeronderdeel fijnmazig: lessenreeks en les</text><rect x="12" y="40" width="236" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(226,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwikkelaar</text><rect x="258" y="40" width="458" height="66" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(694,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="268" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="268" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Leeronderdeel- en toetsonderdeelspecificaties</text><text x="268" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">fijnmazig uitwerken</text><path d="M64 106 V126" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 120 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="130" width="606" height="242" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(624,135)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><rect x="54" y="224" width="582" height="65" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(614,229)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Les specificatie</text><text x="64" y="260" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 1 Introductie WHAM-vragen en triage</text><text x="64" y="277" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><rect x="54" y="297" width="582" height="65" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(614,302)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="315" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Les specificatie</text><text x="64" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 2 Baliegesprek oefenen met rollenspel</text><text x="64" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, lessenreeks Baliegesprek</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">en triage</text><text x="50" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: fijnmazig</text><text x="50" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><text x="12" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De onderwijsontwikkelaar werkt het leeronderdeel fijnmazig uit tot een</text><text x="12" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lessenreeks van zes weken. De lesspecificaties horen bij het leeronderdeel.</text><text x="12" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Logistiek landen zij later in een leergelegenheid, en die draagt in de</text><text x="12" y="451" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">praktijk lesspecificaties uit meer dan een leeronderdeel: de</text><text x="12" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leergelegenheid is de planningscontainer, het leeronderdeel de inhoudelijke</text><text x="12" y="489" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">eenheid. Dieper dan het leeronderdeel gaat de uitwisseling niet, dus de les</text><text x="12" y="508" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">blijft grijs.</text></svg>