<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1014 532" width="1014" height="532"><rect x="0.5" y="0.5" width="1013" height="531" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F4-02 - Detailspecificaties naar het LMS</text><rect x="0" y="0" width="4" height="532" fill="#5aa8a8"/><rect x="12" y="54" width="59" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">OC-LMS</text><rect x="83" y="40" width="208" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(270,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="93" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="93" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Onderwijscatalogus</text><path d="M297.52 64H682.2" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M680.2 58l10 6-10 6z" fill="#2a5a5a"/><rect x="692" y="40" width="310" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(980,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="702" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="702" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Leer management systeem (LMS)</text><rect x="12" y="90" width="326" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Detailspecificaties leveren aan het LMS</text><path d="M311.52 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V371" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="606" height="225" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(624,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><rect x="54" y="199" width="582" height="65" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(614,204)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Les specificatie</text><text x="64" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 1 Introductie WHAM-vragen en triage</text><text x="64" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><rect x="54" y="272" width="582" height="65" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(614,277)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Les specificatie</text><text x="64" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 2 Baliegesprek oefenen met rollenspel</text><text x="64" y="325" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, lessenreeks Baliegesprek</text><text x="50" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">en triage</text><text x="50" y="193" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><rect x="40" y="375" width="582" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(600,380)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="393" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsonderdeel specificatie</text><text x="50" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Formatieve check baliegesprek, les 1</text><text x="50" y="428" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Voert baliegesprek en triage uit (werkprocesniveau)</text><rect x="646" y="375" width="356" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(980,380)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="656" y="393" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Formatieve resultaat structuur</text><text x="656" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Formatieve voortgangsstructuur bij</text><text x="656" y="429" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101</text><text x="12" y="463" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De detailspecificaties gaan naar het LMS ter inrichting van de leeromgeving. Het LMS heeft de volledige</text><text x="12" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">opleidingsspecificatie-boom nodig plus de formatieve resultaatstructuur, niet alleen het losse leeronderdeel. De</text><text x="12" y="501" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leergelegenheid komt als reeks met de leerspecificaties die erin verwerkt moeten worden; het LMS geeft de losse</text><text x="12" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lessen invulling. De catalogus dicteert de lesspecificatie niet.</text></svg>