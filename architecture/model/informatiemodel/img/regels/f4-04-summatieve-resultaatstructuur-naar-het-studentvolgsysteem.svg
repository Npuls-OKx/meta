<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 550" width="1850" height="550"><rect x="0.5" y="0.5" width="1849" height="549" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F4-04 - Summatieve resultaatstructuur naar het studentvolgsysteem</text><rect x="0" y="0" width="4" height="550" fill="#5aa8a8"/><rect x="12" y="54" width="59" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">OC-SVS</text><rect x="83" y="40" width="208" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(270,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="93" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="93" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Onderwijscatalogus</text><path d="M297.52 64H1545.3600000000001" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M1543.3600000000001 58l10 6-10 6z" fill="#2a5a5a"/><rect x="1555" y="40" width="282" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(1816,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="1565" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="1565" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Student volg systeem (SVS)</text><rect x="12" y="90" width="326" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Detailspecificaties leveren aan het LMS</text><path d="M311.52 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V297" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V390" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="1498" height="151" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1516,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatieve resultaat structuur</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Summatieve resultaatstructuur Apothekersassistent, cohort 2026</text><rect x="54" y="181" width="1474" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1506,186)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examenonderdeelspecificatie</text><text x="64" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid B1-K1: schaal onvoldoende, voldoende of goed, afname op de bpv-werkplek, 120 minuten, eigen protocollenmap toegestaan, twee pogingen</text><text x="64" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Toetsonderdeel specificatie</text><text x="64" y="251" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patientenzorg (kerntaakniveau)</text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patiëntenzorg (kerntaakniveau)</text><rect x="40" y="301" width="393" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(411,306)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examenonderdeel weging</text><text x="50" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid B1-K1: weging 2</text><text x="50" y="354" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Examenonderdeelspecificatie</text><rect x="40" y="394" width="1798" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1816,399)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatief Afrondingscriterium</text><text x="50" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Alle kerntaken voldoende, de keuzedeelruimte gevuld en afgerond, en het basisdeel behaald: Nederlands en rekenen op 2F of 3F met een eigen regeling, Engels en loopbaan en burgerschap voldaan</text><text x="50" y="447" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Summatieve resultaat structuur hangt aan</text><text x="12" y="481" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De summatieve resultaatstructuur gaat als nominaal template naar het studentvolgsysteem, dat er per student een individueel examenplan van maakt. Elk onderdeel draagt zijn schaal en afnamevorm, want zonder die twee</text><text x="12" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">kan het volgsysteem een resultaat niet lezen. Formatieve en summatieve onderdelen bestaan naast elkaar en een examen telt ook als toets, dus het volgsysteem herkent ze aan een unieke codering en ondersteunt</text><text x="12" y="519" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">equivalentie: een resultaat dat in meerdere structuren meetelt. Optioneel hangen er condities aan een onderdeel, zoals akkoord van de stagebegeleider of alle componenten van een eenheid behaald, die zeggen wanneer een</text><text x="12" y="538" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">student mag examineren.</text></svg>