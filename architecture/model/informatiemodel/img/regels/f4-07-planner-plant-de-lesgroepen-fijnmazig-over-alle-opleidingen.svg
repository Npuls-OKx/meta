y="688" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="714" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De planner plant periode 1 fijnmazig, over alle opleidingen van de instelling tegelijk: per leergelegenheid de</text><text x="12" y="733" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lesgroepen, op de capaciteit van het lokaaltype en het aantal docenten per expertise. De studenten zijn nog</text><text x="12" y="752" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">geprognosticeerd. De simulatieruimte past een hele plaatsingsgroep van 24; het practicum in de leerapotheek heeft</text><text x="12" y="771" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">twaalf werkplekken, dus daar worden het twee lesgroepen per plaatsingsgroep, en acht over het cohort van 96. Bij</text><text x="12" y="790" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Apothekersassistent horen zo voor deze twee leergelegenheden twaalf lesgroepen.</text></svg>