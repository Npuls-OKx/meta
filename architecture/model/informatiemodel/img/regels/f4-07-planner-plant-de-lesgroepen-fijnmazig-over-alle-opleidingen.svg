="none"/><path d="M1453 339L1444 344L1453 349" fill="none" stroke="#444" stroke-width="1.3"/><text x="1456" y="339" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">is gepland op (voorstel)</text><path class="naastlijn" d="M1444 564H1636" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1453 559L1444 564L1453 569" fill="none" stroke="#444" stroke-width="1.3"/><text x="1456" y="559" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">is gepland op (voorstel)</text><path class="naastlijn" d="M1444 564H1622V692H1636" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1453 559L1444 564L1453 569" fill="none" stroke="#444" stroke-width="1.3"/><path class="herkomstlijn" d="M428 805H509V268H581" stroke="#444" stroke-width="1.3" fill="none"/><path class="herkomstlijn" d="M382 268H519V268H581" stroke="#444" stroke-width="1.3" fill="none"/><path d="M12 898H42" stroke="#444" stroke-width="1.3"/><text x="50" y="902" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 898H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 898l-10 -5v10z" fill="#444"/><text x="598" y="902" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="898" r="3" fill="#444"/><path d="M751.1999999999999 898H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 898l-8 -4v8z" fill="#444"/><text x="789" y="902" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="928" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De planner plant periode 1 fijnmazig, over alle opleidingen van de instelling tegelijk. Hij zet de studenten van de</text><text x="12" y="947" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">plaatsingsgroep op de onderwijseenheid, en legt per leergelegenheid de lesgroepen vast op de capaciteit van het</text><text x="12" y="966" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lokaaltype en het aantal docenten per expertise. De studenten van de plaatsingsgroep krijgen hun verbintenis op de</text><text x="12" y="985" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">onderwijseenheid; in de lesgroepen staan nog aantallen, en de namen volgen bij het roosteren. De simulatieruimte past</text><text x="12" y="1004" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">een hele plaatsingsgroep van 24; het practicum in de leerapotheek heeft twaalf werkplekken, dus daar worden het twee</text><text x="12" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lesgroepen per plaatsingsgroep, en acht over het cohort van 96.</text></svg>