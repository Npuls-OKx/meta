<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1001 817" width="1001" height="817"><rect x="0.5" y="0.5" width="1000" height="816" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F4-07 - Planningssysteem stuurt de te roosteren leergelegenheden naar het roostersysteem</text><rect x="0" y="0" width="4" height="817" fill="#5aa8a8"/><rect x="12" y="54" width="218" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">zonder koppelingspecificatie</text><rect x="242" y="40" width="190" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(409,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="252" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="252" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Planningssysteem</text><path d="M437.44 64H807.4799999999999" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M805.4799999999999 58l10 6-10 6z" fill="#2a5a5a"/><rect x="817" y="40" width="171" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(967,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="827" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="827" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Roostersysteem</text><rect x="12" y="90" width="441" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Te roosteren specificaties aan het roostersysteem geven</text><path d="M451.44 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V247" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V358" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V451" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V544" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V638" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="458" height="101" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, periode 1: lokaaltype</text><text x="50" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">balie-simulatie, docentexpertise farmacie met</text><text x="50" y="194" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">baliepraktijk, vier groepen van 24</text><text x="50" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod bevat: B1-K1, leerjaar 1</text><rect x="40" y="251" width="467" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(485,256)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="287" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101-A: APO26-1A, 24 studenten,</text><text x="50" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">past in de simulatieruimte</text><text x="50" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op (voorstel) Leergelegenheid</text><rect x="531" y="251" width="458" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(967,256)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="541" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="541" y="287" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking in de leerapotheek, periode</text><text x="541" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">1: twaalf werkplekken</text><text x="541" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod bevat: B1-K1, leerjaar 1</text><rect x="40" y="362" width="827" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(845,367)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking 1A-1: 12 van APO26-1A</text><text x="50" y="415" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op (voorstel) Leergelegenheid: Medicatiebewaking in de leerapotheek, periode 1: twaalf werkplekken</text><rect x="40" y="455" width="827" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(845,460)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="473" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="491" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking 1A-2: 12 van APO26-1A</text><text x="50" y="508" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op Leergelegenheid (voorstel): Medicatiebewaking in de leerapotheek, periode 1: twaalf werkplekken</text><rect x="40" y="548" width="412" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(430,553)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="566" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsgelegenheid</text><text x="50" y="584" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijktoets baliegesprek (OSCE), einde</text><text x="50" y="602" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 1</text><rect x="40" y="642" width="712" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(730,647)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="660" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="678" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">OSCE einde periode 1: APO26-1A, 24 studenten</text><text x="50" y="695" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op (voorstel) Toetsgelegenheid: Praktijktoets baliegesprek (OSCE), einde periode 1</text><text x="12" y="729" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Planning geeft de leergelegenheden van periode 1 aan het roostersysteem. Zonder de vaste kenmerken heeft roosteren</text><text x="12" y="748" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">niets aan die uitwisseling: het lokaaltype en de docentexpertise bepalen wat er past, en de groep bindt de studenten</text><text x="12" y="767" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">die hetzelfde aanbod afnemen en dus niet gelijktijdig geroosterd kunnen worden. De groep mag nog leeg zijn. De</text><text x="12" y="786" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">planningsgroepen uit de jaarplanning gaan mee: de plaatsingsgroep voor de balie-simulatie en de toets, en twee</text><text x="12" y="805" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">groepen van twaalf voor het practicum in de leerapotheek.</text></svg>