<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 935 947" width="935" height="947"><rect x="0.5" y="0.5" width="934" height="946" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F4-07 - Planningssysteem stuurt leergelegenheden en planningsgroepen naar het roostersysteem</text><rect x="0" y="0" width="4" height="947" fill="#5aa8a8"/><rect x="12" y="54" width="218" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">zonder koppelingspecificatie</text><rect x="242" y="40" width="190" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(409,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="252" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="252" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Planningssysteem</text><path d="M437.44 64H685.4399999999999" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M683.4399999999999 58l10 6-10 6z" fill="#2a5a5a"/><rect x="695" y="40" width="171" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(845,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="705" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="705" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Roostersysteem</text><rect x="12" y="90" width="441" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Te roosteren specificaties aan het roostersysteem geven</text><path d="M451.44 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V247" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V358" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V469" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V562" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V655" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V749" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="510" height="101" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(528,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, periode 1: lokaaltype</text><text x="50" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">balie-simulatie, docentexpertise farmacie met</text><text x="50" y="194" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">baliepraktijk, vier groepen van 24</text><text x="50" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod bevat: B1-K1, leerjaar 1, periode 1 tot 4</text><rect x="40" y="251" width="560" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(578,256)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="287" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101-A: APO26-1A, 24 studenten,</text><text x="50" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">past in de simulatieruimte</text><text x="50" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op (voorstel) Leergelegenheid: Baliegesprekken 101, periode 1</text><rect x="40" y="362" width="510" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(528,367)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="50" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking in de leerapotheek, periode</text><text x="50" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">1: twaalf werkplekken</text><text x="50" y="433" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod bevat: B1-K1, leerjaar 1, periode 1 tot 4</text><rect x="40" y="473" width="827" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(845,478)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="491" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="509" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking 1A-1: 12 van APO26-1A</text><text x="50" y="526" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op (voorstel) Leergelegenheid: Medicatiebewaking in de leerapotheek, periode 1: twaalf werkplekken</text><rect x="40" y="566" width="827" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(845,571)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="584" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="602" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking 1A-2: 12 van APO26-1A</text><text x="50" y="619" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op Leergelegenheid (voorstel): Medicatiebewaking in de leerapotheek, periode 1: twaalf werkplekken</text><rect x="40" y="659" width="412" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(430,664)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="677" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsgelegenheid</text><text x="50" y="695" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijktoets baliegesprek (OSCE), einde</text><text x="50" y="713" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 1</text><rect x="40" y="753" width="712" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(730,758)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="771" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="789" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">OSCE einde periode 1: APO26-1A, 24 studenten</text><text x="50" y="806" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op (voorstel) Toetsgelegenheid: Praktijktoets baliegesprek (OSCE), einde periode 1</text><text x="12" y="840" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Planning geeft de leergelegenheden van periode 1 aan het roostersysteem. Zonder de vaste kenmerken</text><text x="12" y="859" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">heeft roosteren niets aan die uitwisseling: het lokaaltype en de docentexpertise bepalen wat er past,</text><text x="12" y="878" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">en de groep bindt de studenten die hetzelfde aanbod afnemen en dus niet gelijktijdig geroosterd</text><text x="12" y="897" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">kunnen worden. De groep mag nog leeg zijn. De planningsgroepen uit de jaarplanning gaan mee: een</text><text x="12" y="916" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">planningsgroep van heel APO26-1A voor de balie-simulatie en een voor de toets, en twee groepen van</text><text x="12" y="935" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">twaalf voor het practicum in de leerapotheek.</text></svg>