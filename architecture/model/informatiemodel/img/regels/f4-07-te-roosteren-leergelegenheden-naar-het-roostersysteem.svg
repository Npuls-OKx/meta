<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1231 259" width="1231" height="259"><rect x="0.5" y="0.5" width="1230" height="258" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F4-07 - Te roosteren leergelegenheden naar het roostersysteem</text><rect x="0" y="0" width="4" height="259" fill="#5aa8a8"/><rect x="12" y="54" width="218" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">zonder koppelingspecificatie</text><rect x="242" y="40" width="190" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(409,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="252" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="252" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Planningssysteem</text><path d="M437.44 64H1037.1599999999999" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M1035.1599999999999 58l10 6-10 6z" fill="#2a5a5a"/><rect x="1047" y="40" width="171" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(1197,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="1057" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="1057" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Roostersysteem</text><rect x="12" y="90" width="441" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Te roosteren specificaties aan het roostersysteem geven</text><path d="M451.44 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="1179" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1197,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, periode 1: lokaaltype balie-simulatie, docentexpertise farmacie met baliepraktijk, twee groepen van 18</text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod bevat: B1-K1, leerjaar 1</text><text x="12" y="209" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Planning geeft de leergelegenheden van periode 1 aan het roostersysteem. Zonder de vaste kenmerken heeft roosteren niets aan die uitwisseling:</text><text x="12" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het lokaaltype en de docentexpertise bepalen wat er past, en de groep bindt de studenten die hetzelfde aanbod afnemen en dus niet gelijktijdig</text><text x="12" y="247" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">geroosterd kunnen worden. De groep mag nog leeg zijn.</text></svg>