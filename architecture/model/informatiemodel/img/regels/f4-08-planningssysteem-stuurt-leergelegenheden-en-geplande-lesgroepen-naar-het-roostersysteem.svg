p</text><text x="50" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101-A: 24 geprognosticeerde</text><text x="50" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">studenten van APO26-1A</text><text x="50" y="305" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op (voorstel) Leergelegenheid: Baliegesprekken 101</text><rect x="545" y="234" width="458" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(981,239)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="555" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="555" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking in de leerapotheek, periode</text><text x="555" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">1: twaalf werkplekken, docent farmacie</text><rect x="40" y="345" width="604" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(622,350)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="363" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Lesgroep</text><text x="50" y="381" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking 1A-1: 12 geprognosticeerde</text><text x="50" y="399" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">studenten van APO26-1A</text><text x="50" y="416" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op (voorstel) Leergelegenheid: Medicatiebewaking in de leerapotheek</text><rect x="40" y="456" width="604" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(622,461)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="474" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Lesgroep</text><text x="50" y="492" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Medicatiebewaking 1A-2: 12 geprognosticeerde</text><text x="50" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">studenten van APO26-1A</text><text x="50" y="527" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op Leergelegenheid (voorstel): Medicatiebewaking in de leerapotheek</text><rect x="40" y="567" width="402" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(420,572)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="585" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Plaatsingsgroep</text><text x="50" y="603" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">APO26-1A: Jochem en 23 andere studenten</text><text x="50" y="621" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">geplaatst</text><rect x="466" y="567" width="412" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(856,572)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"