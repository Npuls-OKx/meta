5" height="153" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(499,231)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="36" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Plaatsingsgroep</text><text x="36" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">APO26-1A: Jochem en 23 andere studenten</text><text x="36" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">geplaatst</text><rect x="40" y="286" width="467" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(485,291)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101-A: APO26-1A, 24 studenten,</text><text x="50" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">past in de simulatieruimte</text><text x="50" y="357" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">uit F2-08</text><rect x="589" y="226" width="439" height="135" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1006,231)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="599" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="599" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, periode 1, docent 4711</text><text x="599" y="279" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geroosterd</text><rect x="603" y="285" width="347" height="66" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(928,290)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="613" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid</text><text x="613" y="321" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 1, maandag 1 september 09:00,</text><text x="613" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieruimte 2.14</text><rect x="589" y="389" width="310" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(877,394)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="599" y="407" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Medewerker</text><text x="599" y="425" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent, personeelsnummer 4711</text><text x="599" y="442" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Persoon</text><rect x="1230" y="226" width="805" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2014,231)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1240" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Lesgroep</text><text x="1240" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101-A: de 24 studenten van</text><text x="1240" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">APO26-1A</text><text x="1240" y="297" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Planningsgroep vormt (voorstel): Baliegesprekken 101-A: APO26-1A, 24 studenten, past in de simulatieruimte</text><path class="naastlijn" d="M1028 250H1230" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1037 245L1028 250L1037 255" fill="none" stroke="#444" stroke-width="1.3"/><text x="1040" y="245" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">is geroosterd op (voorstel)</text><path d="M12 488H42" stroke="#444" stroke-width="1.3"/><text x="50" y="492" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 488H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 488l-10 -5v10z" fill="#444"/><text x="598" y="492" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="488" r="3" fill="#444"/><path d="M751.1999999999999 488H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 488l-8 -4v8z" fill="#444"/><text x="789" y="492" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De roosteraar roostert alleen periode 1. Het eindproduct is een vastgesteld tijdstip in lesuren van de instelling en</text><text x="12" y="537" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">een lokaaltype dat een lokaalnummer is geworden. De docent kan vooraf zijn bepaald of tijdens het roosteren worden</text><text x="12" y="556" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">gekozen op expertise. Latere perioden blijven planbaar. De roosteraar maakt van de planningsgroep de lesgroep: de</text><text x="12" y="575" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">definitieve planningsgroep met de 24 studenten van APO26-1A, die past in de simulatieruimte.</text></svg>