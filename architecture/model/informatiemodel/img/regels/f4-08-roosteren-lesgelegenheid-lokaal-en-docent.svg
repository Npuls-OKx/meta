<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 338" width="809" height="338"><rect x="0.5" y="0.5" width="808" height="337" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F4-08 - Roosteren: lesgelegenheid, lokaal en docent</text><rect x="12" y="40" width="134" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(124,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">roosteraar</text><rect x="156" y="40" width="430" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(564,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="166" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="166" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Leer-, les- en toetsgelegenheden roosteren</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="439" height="135" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(457,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><rect x="54" y="171" width="347" height="66" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(379,176)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid</text><text x="64" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 1, maandag 1 september 09:00,</text><text x="64" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieruimte 2.14</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, periode 1, docent 4711</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geroosterd</text><rect x="487" y="112" width="310" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(775,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="497" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Medewerker</text><text x="497" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent, personeelsnummer 4711</text><text x="497" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Persoon</text><text x="12" y="269" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De roosteraar roostert alleen periode 1. Het eindproduct is een vastgesteld tijdstip in</text><text x="12" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lesuren van de instelling en een lokaaltype dat een lokaalnummer is geworden. De docent kan</text><text x="12" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">vooraf zijn bepaald of tijdens het roosteren worden gekozen op expertise. Latere perioden</text><text x="12" y="326" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">blijven planbaar.</text></svg>