<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 492" width="814" height="492"><rect x="0.5" y="0.5" width="813" height="491" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F4-09 - Jochems verbintenissen op de geroosterde gelegenheden</text><rect x="12" y="40" width="181" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(171,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner, SLB&#x27;er</text><rect x="203" y="40" width="439" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(620,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="213" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="213" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Verwachte deelnemers delen en toegang geven</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="294" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(312,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op B1-K1, leerjaar 1</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod hangt aan</text><rect x="390" y="112" width="412" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(780,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="400" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid verbintenis</text><text x="400" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Baliegesprekken 101, periode 1</text><text x="400" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leergelegenheid hangt aan</text><rect x="390" y="205" width="356" height="65" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(724,210)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="400" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid verbintenis</text><text x="400" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op les 1, 1 september 09:00</text><text x="400" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Lesgelegenheid hangt aan</text><rect x="390" y="298" width="316" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(684,303)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="400" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma aanbod verbintenis</text><text x="400" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Regulier BOL 2026</text><text x="400" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geroosterd</text><text x="12" y="385" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De SLB&#x27;er koppelt Jochem aan het opleidingsprogramma-aanbod en aan een plaatsingsgroep, en</text><text x="12" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verder niet. Die groep gaat vanuit de kernregistratie naar planning, en daar worden alle</text><text x="12" y="423" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leergelegenheden onder het programma-aanbod voor de groep gepland, zonder tussenkomst van de</text><text x="12" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">SLB&#x27;er. De planner mag om logistieke redenen een eigen groep vormen met een tijdelijke</text><text x="12" y="461" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verbintenis, omdat die lesgroep in deelnemers afwijkt van de plaatsingsgroep. Pas bij</text><text x="12" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">vertraging komt de SLB&#x27;er weer in beeld, om Jochem van specifieke gelegenheden af te halen.</text></svg>