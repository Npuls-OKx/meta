font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101-A: past in het</text><text x="572" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">conceptrooster, zonder overlap van studenten</text><text x="572" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">of docenten</text><text x="572" y="333" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: conceptrooster</text><rect x="562" y="373" width="467" height="83" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(1007,378)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="572" y="391" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid</text><text x="572" y="409" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 1, week 1, een simulatieruimte, een docent</text><text x="572" y="427" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">farmacie (concept)</text><text x="572" y="444" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: conceptrooster</text><path class="herkomstlijn" d="M382 397H500V397H562" stroke="#444" stroke-width="1.3" fill="none"/><path d="M382 397l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M12 490H42" stroke="#444" stroke-width="1.3"/><text x="50" y="494" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 490H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 490l-10 -5v10z" fill="#444"/><text x="598" y="494" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="490" r="3" fill="#444"/><path d="M751.1999999999999 490H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 490l-8 -4v8z" fill="#444"/><text x="789" y="494" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De roosteraar laat de roosterautomaat de lesgroepen van alle opleidingen in de tijd leggen, met geprognosticeerde</text><text x="12" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">studenten en docenten. Zo blijkt of het rond te krijgen is: geen student in twee lessen tegelijk, geen docent op drie</text><text x="12" y="558" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">plekken. Het conceptrooster blijft in het roostersysteem; dat is een ontwerpkeuze van dit voorbeeld. Wat niet past,</text><text x="12" y="577" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">gaat terug naar planning (F4-10).</text></svg>