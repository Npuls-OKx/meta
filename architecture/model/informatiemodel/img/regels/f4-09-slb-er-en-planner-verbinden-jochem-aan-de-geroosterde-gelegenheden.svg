amily="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 1, maandag 1 september 09:00,</text><text x="50" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieruimte 2.14</text><text x="36" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, periode 1, docent 4711</text><text x="36" y="372" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">uit F4-08</text><rect x="26" y="482" width="430" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(434,487)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="36" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Lesgroep</text><text x="36" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101-A: de 24 studenten van</text><text x="36" y="536" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">APO26-1A</text><text x="36" y="553" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">uit F4-08</text><rect x="651" y="226" width="294" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(923,231)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="661" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><text x="661" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op B1-K1, leerjaar 1</text><rect x="651" y="302" width="412" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1041,307)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="661" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid verbintenis</text><text x="661" y="338" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Baliegesprekken 101, periode 1</text><rect x="651" y="378" width="356" height="48" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(985,383)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="661" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid verbintenis</text><text x="661" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op les 1, 1 september 09:00</text><rect x="651" y="454" width="316" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(945,459)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="661" y="472" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma aanbod verbintenis</text><text x="661" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Regulier BOL 2026</text><text x="661" y="507" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geroosterd</text><path class="herkomstlijn" d="M382 250H481V250H651" stroke="#444" stroke-width="1.3" fill="none"/><path class="herkomstlijn" d="M456 506H491V326H651" stroke="#444" stroke-width="1.3" fill="none"/><path d="M465 501L456 506L465 511" fill="none" stroke="#444" stroke-width="1.3"/><text x="497" y="321" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Groepeert tot</text><path class="herkomstlijn" d="M465 343H501V326H651" stroke="#444" stroke-width="1.3" fill="none"/><path class="herkomstlijn" d="M387 402H511V402H651" stroke="#444" stroke-width="1.3" fill="none"/><path d="M12 599H42" stroke="#444" stroke-width="1.3"/><text x="50" y="603" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 599H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 599l-10 -5v10z" fill="#444"/><text x="598" y="603" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="599" r="3" fill="#444"/><path d="M751.1999999999999 599H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 599l-8 -4v8z" fill="#444"/><text x="789" y="603" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="629" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De SLB&#x27;er koppelt Jochem aan het opleidingsprogramma-aanbod en aan een plaatsingsgroep, en verder niet. Die groep gaat</text><text x="12" y="648" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">vanuit de kernregistratie naar planning, en daar worden alle leergelegenheden onder het programma-aanbod voor de groep</text><text x="12" y="667" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">gepland, zonder tussenkomst van de SLB&#x27;er. De planner mag om logistieke redenen een eigen groep vormen met een</text><text x="12" y="686" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">tijdelijke verbintenis, omdat die lesgroep in deelnemers afwijkt van de plaatsingsgroep. Pas bij vertraging komt de</text><text x="12" y="705" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">SLB&#x27;er weer in beeld, om Jochem van specifieke gelegenheden af te halen.</text></svg>