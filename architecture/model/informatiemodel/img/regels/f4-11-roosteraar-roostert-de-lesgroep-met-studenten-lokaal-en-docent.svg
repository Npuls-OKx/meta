t-anchor="start">Jochem op les 1, 1 september 09:00</text><rect x="1521" y="616" width="805" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2304,621)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1531" y="634" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Medewerker</text><text x="1531" y="652" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent 4711, apothekersassistent-docent</text><text x="1531" y="669" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">uit F2-05</text><rect x="1521" y="709" width="805" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2304,714)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1531" y="727" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid verbintenis</text><text x="1531" y="745" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent 4711 op Baliegesprekken 101, periode 1,</text><text x="1531" y="763" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">als docent van lesgroep 101-A</text><rect x="1521" y="803" width="805" height="48" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(2304,808)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1531" y="821" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid verbintenis</text><text x="1531" y="839" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent 4711 op les 1, 1 september 09:00</text><path d="M1581 326V354" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1581 326l-4 8h8z" fill="#444"/><text x="1589" y="344" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Worden gegroepeerd via (voorstel)</text><path d="M1581 419V447" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1581 419l-4 8h8z" fill="#444"/><text x="1589" y="437" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangemaakt voor (voorstel)</text><path d="M1581 512V540" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1581 512l-5 7l5 7l5 -7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M1581 681V709" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1581 681l-4 8h8z" fill="#444"/><text x="1589" y="699" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangemaakt voor (voorstel)</text><path d="M1581 775V803" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1581 775l-5 7l5 7l5 -7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path class="naastlijn" d="M1319 250H1521" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1328 245L1319 250L1328 255" fill="none" stroke="#444" stroke-width="1.3"/><text x="1331" y="245" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">is geroosterd op (voorstel)</text><path class="naastlijn-groep" d="M2326 640H2342V256H2326" stroke="#444" stroke-width="1.3" fill="none"/><path d="M2335 251L2326 256L2335 261" fill="none" stroke="#444" stroke-width="1.3"/><path class="herkomstlijn" d="M456 515H509V515H571" stroke="#444" stroke-width="1.3" fill="none"/><path d="M12 885H42" stroke="#444" stroke-width="1.3"/><text x="50" y="889" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 885H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 885l-10 -5v10z" fill="#444"/><text x="598" y="889" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="885" r="3" fill="#444"/><path d="M751.1999999999999 885H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 885l-8 -4v8z" fill="#444"/><text x="789" y="889" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="915" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De roosteraar maakt het rooster concreet: de geplande lesgroep krijgt Jochem en de 23 andere studenten van APO26-1A,</text><text x="12" y="934" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het lokaaltype wordt lokaal 2.14, de expertise wordt docent 4711, en het tijdvenster wordt maandag 1 september 09:00.</text><text x="12" y="953" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Tijdens het roosteren ontstaan de verbintenissen op leergelegenheid en les: een voor Jochem, die hier voor alle 24</text><text x="12" y="972" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">staat, en een voor de docent. Jochem en de docent zijn ingedeeld in de lesgroep, die uit de planningsgroep komt en</text><text x="12" y="991" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">geroosterd is op de leergelegenheid. Of het programma van Jochem geroosterd is, volgt uit de verbintenissen eronder; de</text><text x="12" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verbintenis op het programma krijgt daarvoor geen eigen stand. Dat is een ontwerpkeuze: zo hoeft de hele boom niet mee</text><text x="12" y="1029" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">te veranderen, en loopt hij niet uit de pas.</text></svg>