 transform="translate(1600,418)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1202" y="431" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Medewerker</text><text x="1202" y="449" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent, personeelsnummer 4711</text><text x="1202" y="466" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Persoon</text><path d="M1252 309V337" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1252 309l-4 8h8z" fill="#444"/><text x="1260" y="327" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Groepeert tot</text><path class="naastlijn" d="M982 250H1192" stroke="#444" stroke-width="1.3" fill="none"/><path d="M991 245L982 250L991 255" fill="none" stroke="#444" stroke-width="1.3"/><text x="994" y="245" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">is geroosterd op (voorstel)</text><path class="naastlijn" d="M982 250H1178V361H1192" stroke="#444" stroke-width="1.3" fill="none"/><path class="naastlijn-groep" d="M1622 437H1638V256H1622" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1631 251L1622 256L1631 261" fill="none" stroke="#444" stroke-width="1.3"/><text x="1652" y="260" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">verzorgt (voorstel)</text><path d="M12 512H42" stroke="#444" stroke-width="1.3"/><text x="50" y="516" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 512H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 512l-10 -5v10z" fill="#444"/><text x="598" y="516" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="512" r="3" fill="#444"/><path d="M751.1999999999999 512H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 512l-8 -4v8z" fill="#444"/><text x="789" y="516" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="542" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De roosteraar maakt het rooster concreet: de geplande lesgroep krijgt Jochem en de 23 andere studenten van APO26-1A,</text><text x="12" y="561" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het lokaaltype wordt simulatieruimte 2.14, de expertise wordt docent 4711, en het tijdvenster wordt maandag 1 september</text><text x="12" y="580" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">09:00. Tijdens het roosteren ontstaan de verbintenissen tussen personen en aanbod; Jochem staat hier voor alle 24.</text><text x="12" y="599" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Latere perioden blijven planbaar.</text></svg>