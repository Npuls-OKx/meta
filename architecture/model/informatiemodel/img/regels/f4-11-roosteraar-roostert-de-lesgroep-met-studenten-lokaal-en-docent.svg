em en 23 andere studenten</text><text x="36" y="409" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">geplaatst</text><text x="36" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">uit F3-05</text><rect x="543" y="226" width="439" height="152" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(960,231)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="553" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="553" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Baliegesprekken 101, periode 1, docent 4711</text><text x="553" y="279" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geroosterd</text><rect x="557" y="285" width="347" height="83" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(881,290)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="567" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid</text><text x="567" y="321" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 1, maandag 1 september 09:00,</text><text x="567" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">simulatieruimte 2.14</text><text x="567" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geroosterd</text><rect x="543" y="422" width="356" height="48" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(877,427)" fill="none" stroke="#444" st