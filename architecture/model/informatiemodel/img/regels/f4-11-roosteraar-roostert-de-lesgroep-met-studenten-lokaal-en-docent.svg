xt x="1512" y="448" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid verbintenis</text><text x="1512" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op les 1, 1 september 09:00</text><rect x="1502" y="506" width="546" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2026,511)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1512" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student</text><text x="1512" y="542" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, cohort 2026</text><text x="1512" y="559" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">uit F3-05</text><rect x="1502" y="599" width="546" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2026,604)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1512" y="617" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid verbintenis</text><text x="1512" y="635" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent 4711 op Baliegesprekken 101, periode 1,</text><text x="1512" y="653" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">als docent van lesgroep 101-A</text><rect x="1502" y="693" width="546" height="48" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(2026,698)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1512" y="711" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid verbintenis</text><text x="1512" y="729" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent 4711 op les 1, 1 september 09:00</text><rect x="1502" y="769" width="546" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2026,774)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1512" y="787" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Medewerker</text><text x="1512" y="805" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Docent 4711, apothekersassistent-docent</text><text x="1512" y="822" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">uit F2-05</text><path d="M1562 309V337" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1562 309l-4 8h8z" fill="#444"/><text x="1570" y="327" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Groepeert tot</text><path d="M1562 402V430" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1562 402l-5 7l5 7l5 -7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M1562 665V693" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1562 665l-5 7l5 7l5 -7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path class="naastlijn" d="M1300 250H1502" stroke="#444" stroke-width="1.3" fill="none"/><path d="M1309 245L1300 250L1309 255" fill="none" stroke="#444" stroke-width="1.3"/><text x="1312" y="245" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">is geroosterd op (voorstel)</text><path class="naastlijn-groep" d="M2048 530H2064V367H2048" stroke="#444" stroke-width="1.3" fill="none"/><text x="2094" y="371" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangemaakt voor (voorstel)</text><path class="naastlijn-groep" d="M2048 623H2072V256H2048" stroke="#444" stroke-width="1.3" fill="none"/><path d="M2057 251L2048 256L2057 261" fill="none" stroke="#444" stroke-width="1.3"/><path class="naastlijn-groep" d="M2048 793H2080V629H2048" stroke="#444" stroke-width="1.3" fill="none"/><text x="2094" y="633" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangemaakt voor (voorstel)</text><path class="herkomstlijn" d="M456 515H491V515H553" stroke="#444" stroke-width="1.3" fill="none"/><path d="M12 868H42" stroke="#444" stroke-width="1.3"/><text x="50" y="872" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 868H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 868l-10 -5v10z" fill="#444"/><text x="598" y="872" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="868" r="3" fill="#444"/><path d="M751.1999999999999 868H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 868l-8 -4v8z" fill="#444"/><text x="789" y="872" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="898" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De roosteraar maakt het rooster concreet: de geplande lesgroep krijgt Jochem en de 23 andere studenten van APO26-1A,</text><text x="12" y="917" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het lokaaltype wordt lokaal 2.14, de expertise wordt docent 4711, en het tijdvenster wordt maandag 1 september 09:00.</text><text x="12" y="936" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Tijdens het roosteren ontstaan de verbintenissen op leergelegenheid en les: een voor Jochem, die hier voor alle 24</text><text x="12" y="955" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">staat, en een voor de docent. Beide groeperen tot de lesgroep, en de lesgroep is geroosterd op de leergelegenheid. Of</text><text x="12" y="974" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het programma van Jochem geroosterd is, volgt uit de verbintenissen eronder; de verbintenis op het programma krijgt</text><text x="12" y="993" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">daarvoor geen eigen stand. Dat is een ontwerpkeuze: zo hoeft de hele boom niet mee te veranderen, en loopt hij niet uit</text><text x="12" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">de pas.</text></svg>