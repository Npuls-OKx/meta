<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 445" width="1170" height="445"><rect x="0.5" y="0.5" width="1169" height="444" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F4-11 - Verbintenissen op alle niveaus naar het studentvolgsysteem</text><rect x="0" y="0" width="4" height="445" fill="#5aa8a8"/><rect x="12" y="54" width="203" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">geen pijl op de hoofdplaat</text><rect x="227" y="40" width="402" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(608,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="237" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="237" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kernregistratie systeem studenten (KRS)</text><path d="M635.56 64H865.56" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M863.56 58l10 6-10 6z" fill="#2a5a5a"/><rect x="876" y="40" width="282" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(1136,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="886" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="886" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Student volg systeem (SVS)</text><rect x="12" y="90" width="354" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Verwachte deelnemers delen en toegang geven</text><path d="M649.56 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V211" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V304" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="218" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(236,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, cohort 2026</text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Persoon</text><rect x="282" y="122" width="486" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(745,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="292" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleiding aanbod verbintenis</text><text x="292" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Apothekersassistent 2026, ingeschreven</text><text x="292" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleidingaanbod hangt aan</text><rect x="40" y="215" width="421" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(439,220)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma aanbod verbintenis</text><text x="50" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Regulier BOL 2026, ingeschreven</text><text x="50" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleidingsprogramma aanbod hangt aan</text><rect x="485" y="215" width="294" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(757,220)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="495" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><text x="495" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op B1-K1, leerjaar 1</text><text x="495" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod hangt aan</text><rect x="40" y="308" width="310" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(328,313)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid verbintenis</text><text x="50" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op B1-K1-W1, periode 1</text><text x="50" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leergelegenheid hangt aan</text><text x="12" y="395" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het studentvolgsysteem houdt de voortgang bij per verbintenis, en moet daarvoor weten waarop Jochem is ingeschreven: op</text><text x="12" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">de opleiding, het programma, de eenheid en de leergelegenheid. Die verbintenissen komen uit de kernregistratie, die er</text><text x="12" y="433" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">master van is.</text></svg>