-5v10z" fill="#444"/><rect x="26" y="226" width="356" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(360,231)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="36" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><text x="36" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1, leerjaar 1, periode 1 tot 4</text><rect x="460" y="226" width="294" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(732,231)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="470" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><text x="470" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op B1-K1, leerjaar 1</text><rect x="460" y="302" width="316" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(754,307)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="470" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma aanbod verbintenis</text><text x="470" y="338" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Regulier BOL 2026</text><text x="470" y="355" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geroosterd</text><path class="herkomstlijn" d="M382 250H398V250H460" stroke="#444" stroke-width="1.3" fill="none"/><path d="M12 401H42" stroke="#444" stroke-width="1.3"/><text x="50" y="405" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 401H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 401l-10 -5v10z" fill="#444"/><text x="598" y="405" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="401" r="3" fill="#444"/><path d="M751.1999999999999 401H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 401l-8 -4v8z" fill="#444"/><text x="789" y="405" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="431" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De SLB&#x27;er koppelt Jochem aan het opleidingsprogramma-aanbod en aan een plaatsingsgroep; de planner zet de</text><text x="12" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verbintenis op de onderwijseenheid. De verbintenissen op leergelegenheid en les ontstonden bij het</text><text x="12" y="469" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">roosteren (F4-11). Pas bij vertraging komt de SLB&#x27;er weer in beeld, om Jochem van specifieke gelegenheden</text><text x="12" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">af te halen.</text></svg>