" width="356" height="48" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(374,221)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid verbintenis</text><text x="50" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op les 1, 1 september 09:00</text><text x="12" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het roostersysteem meldt de kernregistratie de geroosterde lesgroep met haar studenten en hun verbintenissen op</text><text x="12" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leergelegenheid en les. Zo kent de kernregistratie wat zij daarna aan het studentvolgsysteem doorgeeft (F4-14).</text></svg>