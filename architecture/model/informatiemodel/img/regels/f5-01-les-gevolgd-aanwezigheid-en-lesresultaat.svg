<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 913 379" width="913" height="379"><rect x="0.5" y="0.5" width="912" height="378" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F5-01 - Les gevolgd: aanwezigheid en lesresultaat</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">docent</text><rect x="142" y="40" width="218" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(338,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Onderwijs verzorgen</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="356" height="65" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(374,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid verbintenis</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op les 1, 1 september 09:00</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: afgerond</text><rect x="452" y="112" width="449" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(879,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="462" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Aanwezigheid</text><text x="462" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Deelname Baliegesprekken 101: 90 procent van</text><text x="462" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">de lesgelegenheden bijgewoond</text><text x="462" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Persoon hangt aan</text><rect x="452" y="223" width="301" height="65" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(731,228)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="462" y="241" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid resultaat</text><text x="462" y="259" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 1 gevolgd</text><text x="462" y="276" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Lesgelegenheid verbintenis hangt aan</text><text x="12" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De docent verzorgt de les en de les is voor Jochem afgerond. De registratie van aanwezigheid zelf ligt</text><text x="12" y="329" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">buiten OKx. Wat wel telt is wat eruit volgt: bij een onderwijseenheid die niet wordt getoetst kan het</text><text x="12" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">aandeel bijgewoonde lesgelegenheden een voortgangsresultaat zijn, en daarmee een voorwaarde voor een</text><text x="12" y="367" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">volgende keuze.</text></svg>