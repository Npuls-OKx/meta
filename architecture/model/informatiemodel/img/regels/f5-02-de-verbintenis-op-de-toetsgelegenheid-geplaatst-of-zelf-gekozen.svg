<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 998 395" width="998" height="395"><rect x="0.5" y="0.5" width="997" height="394" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F5-02 - De verbintenis op de toetsgelegenheid: geplaatst of zelf gekozen</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">docent</text><rect x="142" y="40" width="375" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(495,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Toetsmomenten plannen tijdens lessen</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="596" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(614,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsgelegenheid verbintenis</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op de OSCE, einde periode 1, via zijn plaatsingsgroep</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Toetsgelegenheid hangt aan</text><text x="50" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Plaatsingsgroep hangt aan: APO26-1A: de hele groep wordt geplaatst</text><rect x="40" y="222" width="668" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(686,227)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Toetsgelegenheid verbintenis</text><text x="50" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op de herkansing OSCE, periode 2, zelf ingetekend</text><text x="50" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Toetsgelegenheid hangt aan</text><text x="50" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Plaatsingsgroep hangt aan: bij een eigen keuze ontstaat de verbintenis los van de groep</text><text x="12" y="326" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De verbintenis op een gelegenheid kan op twee manieren ontstaan. In de reguliere route plaatst de instelling de hele</text><text x="12" y="345" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">plaatsingsgroep op het toetsmoment, en krijgt Jochem zijn verbintenis zonder zelf te kiezen. Kiest hij wel zelf,</text><text x="12" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">bijvoorbeeld bij een herkansing of een keuzedeel, dan tekent hij in via het studentkeuzesysteem, dat daarvoor de</text><text x="12" y="383" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">diensten Keuze op leergelegenheid en Accorderen van keuzes levert.</text></svg>