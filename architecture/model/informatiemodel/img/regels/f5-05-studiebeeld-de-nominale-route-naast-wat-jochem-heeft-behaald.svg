<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1006 395" width="1006" height="395"><rect x="0.5" y="0.5" width="1005" height="394" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F5-05 - Studiebeeld: de nominale route naast wat Jochem heeft behaald</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">SLB&#x27;er</text><rect x="142" y="40" width="449" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(569,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Studiebeeld volgen in het studentvolgsysteem</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="366" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(384,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid resultaat</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1: in uitvoering, twee van vier</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">leeronderdelen afgerond</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod verbintenis hangt aan</text><rect x="462" y="112" width="532" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(972,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="472" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><text x="472" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1, leerjaar 1, periode 1 tot 4: de</text><text x="472" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">nominale route</text><text x="472" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="472" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie hangt aan: Blok B1-K1, zoals ontworpen</text><rect x="462" y="240" width="474" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(914,245)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="472" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatieve resultaat structuur</text><text x="472" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Resultaatstructuur Apothekersassistent, cohort</text><text x="472" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">2026</text><text x="472" y="311" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: waartegen het resultaat wordt gelegd</text><text x="12" y="345" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De SLB&#x27;er legt de nominale route naast wat Jochem tot nu toe heeft behaald: het geplande aanbod per periode</text><text x="12" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">tegenover de resultaten op zijn verbintenissen. Daaruit volgt of hij voor of achter loopt op de route die bij zijn</text><text x="12" y="383" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">cohort hoort, en of bijsturen nodig is.</text></svg>