d="M396 397H563V397H745" stroke="#444" stroke-width="1.3" fill="none"/><path d="M745 397l-8 -4v8z" fill="#444"/><text x="569" y="392" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangeboden als</text><text x="12" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De keuzedeelruimte nadert. Planning maakt het aanbod van K0037 laag voor laag uit de specificatie van fase 1 (F1-08):</text><text x="12" y="499" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het keuzedeel, de onderwijseenheid en per leeronderdeel een leergelegenheid. Het aanbod voegt plaats, tijd en</text><text x="12" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">capaciteit toe; wat kiesbaar is, staat op de specificatie. Het aanbod blijft bij planning, en het studentkeuzesysteem</text><text x="12" y="537" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">haalt het daar op (F6-03).</text></svg>