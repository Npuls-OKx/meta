if" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">verdiepend)</text><text x="50" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">uit F1-08</text><text x="50" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><path d="M736.56 106 V148" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M731.56 142 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><text x="747" y="144" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Ontstaat hier</text><rect x="713" y="152" width="487" height="311" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(1178,157)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="723" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod</text><rect x="727" y="246" width="463" height="207" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1168,251)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="737" y="264" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><rect x="741" y="305" width="439" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1158,310)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="751" y="323" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="751" y="341" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Het medicatieoverzicht opstellen, periode 7</text><text x="751" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: grofmazig gepland</text><rect x="741" y="378" width="430" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1149,383)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="751" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="751" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zorg aan specifieke doelgroepen, periode 7</text><text x="751" y="431" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: grofmazig gepland</text><text x="737" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1, periode 7, locatie A: 18 plaatsen</text><text x="737" y="299" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="723" y="188" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7,</text><text x="723" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">locatie A</text><text x="723" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><text x="723" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma aanbod</text><path class="herkomstlijn" d="M513 176H529V176H713" stroke="#444" stroke-width="1.3" fill="none"/><path d="M713 176l-8 -4v8z" fill="#444"/><text x="535" y="171" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangeboden als</text><path class="herkomstlijn" d="M503 270H539V270H727" stroke="#444" stroke-width="1.3" fill="none"/><path d="M727 270l-8 -4v8z" fill="#444"/><text x="545" y="265" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangeboden als</text><path class="herkomstlijn" d="M406 312H549V329H741" stroke="#444" stroke-width="1.3" fill="none"/><path d="M741 329l-8 -4v8z" fill="#444"/><text x="555" y="324" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangeboden als</text><path class="herkomstlijn" d="M396 368H559V402H741" stroke="#444" stroke-width="1.3" fill="none"/><path d="M741 402l-8 -4v8z" fill="#444"/><text x="565" y="397" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangeboden als</text><text x="12" y="485" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De keuzedeelruimte nadert. Planning maakt het aanbod van K0037 laag voor laag uit de specificatie van fase 1 (F1-08):</text><text x="12" y="504" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het keuzedeel, de onderwijseenheid en per leeronderdeel een leergelegenheid. Het aanbod voegt plaats, tijd en</text><text x="12" y="523" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">capaciteit toe; wat kiesbaar is, staat op de specificatie. Het aanbod blijft bij planning, en het studentkeuzesysteem</text><text x="12" y="542" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">haalt het daar op (F6-03).</text></svg>