-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zorg aan specifieke doelgroepen, periode 7</text><text x="769" y="557" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: grofmazig gepland</text><text x="769" y="574" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wordt gegeven op Onderwijslocatie: Locatie A, Campus Zuid</text><path class="herkomstlijn" d="M503 268H519V268H731" stroke="#444" stroke-width="1.3" fill="none"/><path d="M722 263L731 268L722 273" fill="none" stroke="#444" stroke-width="1.3"/><text x="525" y="263" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangeboden als</text><path class="herkomstlijn" d="M489 362H529V362H745" stroke="#444" stroke-width="1.3" fill="none"/><path d="M736 357L745 362L736 367" fill="none" stroke="#444" stroke-width="1.3"/><text x="535" y="357" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangeboden als</text><path class="herkomstlijn" d="M392 438H539V438H759" stroke="#444" stroke-width="1.3" fill="none"/><path d="M750 433L759 438L750 443" fill="none" stroke="#444" stroke-width="1.3"/><text x="545" y="433" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangeboden als</text><path class="herkomstlijn" d="M382 528H549V528H759" stroke="#444" stroke-width="1.3" fill="none"/><path d="M750 523L759 528L750 533" fill="none" stroke="#444" stroke-width="1.3"/><text x="555" y="523" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">wordt aangeboden als</text><path d="M12 640H42" stroke="#444" stroke-width="1.3"/><text x="50" y="644" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 640H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 640l-10 -5v10z" fill="#444"/><text x="598" y="644" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="640" r="3" fill="#444"/><path d="M751.1999999999999 640H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 640l-8 -4v8z" fill="#444"/><text x="789" y="644" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="670" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het keuzemoment nadert. De planner werkt het keuzedeelaanbod uit de jaarplanning (F2-08) per laag uit voor periode 7,</text><text x="12" y="689" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">vanuit de specificatie van fase 1: de onderwijseenheid en per leeronderdeel een leergelegenheid. Het aanbod voegt</text><text x="12" y="708" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">plaats, tijd en capaciteit toe; wat kiesbaar is, staat op de specificatie. Het aanbod blijft bij planning, en het</text><text x="12" y="727" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">studentkeuzesysteem haalt het daar op (F6-03).</text></svg>