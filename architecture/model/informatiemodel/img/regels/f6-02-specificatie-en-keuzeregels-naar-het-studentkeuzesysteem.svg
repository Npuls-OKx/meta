" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="424" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zorg aan specifieke doelgroepen</text><text x="64" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1 Voert farmaceutische patientenzorg uit</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg (480 SBU,</text><text x="50" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">verdiepend)</text><text x="50" y="193" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma specificatie</text><rect x="40" y="337" width="449" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(467,342)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="355" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student keuze regelset</text><text x="50" y="373" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kiesbare keuzedelen voor Apothekersassistent</text><text x="50" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Keuzedeelruimte: 720 SBU, mbo-4</text><text x="50" y="407" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Keuzedeel specificatie</text><text x="12" y="441" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De catalogus stuurt het studentkeuzesysteem de specificatiestructuur van het keuzedeel</text><text x="12" y="460" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">met de studentkeuzeregels: wat Jochem mag kiezen. De regels horen op de specificatie, en</text><text x="12" y="479" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">dat beantwoordt de vraag die hier eerder stond. Het aanbod gaat niet over deze lijn.</text></svg>