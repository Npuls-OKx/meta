<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 342" width="1024" height="342"><rect x="0.5" y="0.5" width="1023" height="341" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-03 - Jochems aanmelding op het keuzedeelaanbod, met zijn voorkeurslijst</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">student</text><rect x="142" y="40" width="541" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(661,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voorkeurslijst samenstellen in het studentkeuzesysteem</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="883" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(901,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Aanmelding</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voorkeurslijst: 1. K0037 Farmaceutische Patientenzorg, periode 7, locatie A; 2. alternatief</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeelaanbod Op basis van</text><rect x="40" y="205" width="670" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(688,210)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod verbintenis</text><text x="50" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op K0037 Farmaceutische Patientenzorg, periode 7 (voorkeur 1)</text><text x="50" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeelaanbod hangt aan: K0037 Farmaceutische Patientenzorg, periode 7, locatie A</text><path d="M100 177V205" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 205l-4 -8h8z" fill="#444"/><text x="108" y="195" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">middels</text><text x="12" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Jochem geeft zijn keuze aan op het aanbod: hij stelt in het studentkeuzesysteem een geprioriteerde voorkeurslijst samen</text><text x="12" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">uit de gepubliceerde keuzedelen, met de periode en de locatie erbij. Dat is een aanmelding, nog geen inschrijving; de</text><text x="12" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verbintenis die eruit volgt draagt zijn keuze naar planning.</text></svg>