<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 757 433" width="757" height="433"><rect x="0.5" y="0.5" width="756" height="432" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-03 - Jochems aanmelding op het keuzedeelaanbod, met zijn voorkeurslijst</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">student</text><rect x="142" y="40" width="356" height="66" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voorkeurslijst samenstellen in het</text><text x="152" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">studentkeuzesysteem</text><path d="M64 106 V126" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 120 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="130" width="402" height="101" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(420,135)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Aanmelding</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voorkeurslijst: 1. K0037 Farmaceutische</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Patientenzorg, periode 7, locatie A; 2.</text><text x="50" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">alternatief</text><text x="50" y="219" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeelaanbod Op basis van</text><rect x="40" y="259" width="640" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(658,264)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="277" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod verbintenis</text><text x="50" y="295" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op K0037 Farmaceutische Patientenzorg,</text><text x="50" y="313" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7 (voorkeur 1)</text><text x="50" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeelaanbod hangt aan: K0037 Farmaceutische Patientenzorg, periode 7, locatie A</text><path d="M100 231V259" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 259l-4 -8h8z" fill="#444"/><text x="108" y="249" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">middels</text><text x="12" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Jochem geeft zijn keuze aan op het aanbod: hij stelt in het studentkeuzesysteem</text><text x="12" y="383" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">een geprioriteerde voorkeurslijst samen uit de gepubliceerde keuzedelen, met de</text><text x="12" y="402" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">periode en de locatie erbij. Dat is een aanmelding, nog geen inschrijving; de</text><text x="12" y="421" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verbintenis die eruit volgt draagt zijn keuze naar planning.</text></svg>