<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1059 380" width="1059" height="380"><rect x="0.5" y="0.5" width="1058" height="379" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-03 - Planningssysteem ontsluit het geplande aanbod naar het studentkeuzesysteem</text><rect x="0" y="0" width="4" height="380" fill="#5aa8a8"/><rect x="12" y="54" width="218" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">zonder koppelingspecificatie</text><rect x="242" y="40" width="190" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(409,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="252" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="252" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Planningssysteem</text><path d="M437.44 64H745.3199999999999" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M743.3199999999999 58l10 6-10 6z" fill="#2a5a5a"/><rect x="755" y="40" width="291" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(1025,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="765" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="765" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Student Keuze Systeem (SKS)</text><rect x="12" y="90" width="412" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Keuzedeel kiesbaar maken in het studentkeuzesysteem</text><path d="M451.44 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="1007" height="186" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1025,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod</text><rect x="54" y="216" width="733" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(765,221)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><text x="64" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1, periode 7, locatie A: 18 plaatsen</text><text x="64" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie wordt aangeboden als: D1-K1 Voert farmaceutische patientenzorg uit</text><text x="64" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wordt gegeven op Onderwijslocatie: Campus Zuid (locatie A)</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7,</text><text x="50" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">locatie A</text><text x="50" y="193" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma aanbod</text><text x="50" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel specificatie wordt aangeboden als: K0037 Farmaceutische Patientenzorg (480 SBU, aard verdiepend), beroepsspecifiek keuzedeel</text><text x="12" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het studentkeuzesysteem vraagt planning welk aanbod er bij de specificatie gepland is, en met hoeveel plaatsen. Dat</text><text x="12" y="349" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verandert steeds, dus het haalt het op bij de bron. Is er geen aanbod, dan meldt het studentkeuzesysteem dat aan</text><text x="12" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">planning met een `Verzoek tot Aanbod / Intekening op specificatie`.</text></svg>