rt">Keuzedeel aanbod verbintenis</text><text x="581" y="749" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Mohammed op K0037 Farmaceutische</text><text x="581" y="767" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Patientenzorg, periode 7</text><text x="581" y="784" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: aangemeld</text><text x="581" y="801" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel aanbod hangt aan: K0037 Farmaceutische Patientenzorg, periode 7, locatie A</text><rect x="571" y="841" width="647" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1196,846)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="581" y="859" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod verbintenis</text><text x="581" y="877" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Lotte en 14 anderen op K0037 Farmaceutische</text><text x="581" y="895" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Patientenzorg, periode 7</text><text x="581" y="912" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: aangemeld</text><text x="581" y="929" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel aanbod hangt aan: K0037 Farmaceutische Patientenzorg, periode 7, locatie A</text><path d="M631 327V371" stroke="#444" stroke-width="1.3" fill="none"/><path d="M631 371l-4 -8h8z" fill="#444"/><text x="639" y="353" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">middels</text><path class="herkomstlijn" d="M452 506H509V506H585" stroke="#444" stroke-width="1.3" fill="none"/><path d="M12 975H42" stroke="#444" stroke-width="1.3"/><text x="50" y="979" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 975H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 975l-10 -5v10z" fill="#444"/><text x="598" y="979" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="975" r="3" fill="#444"/><path d="M751.1999999999999 975H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 975l-8 -4v8z" fill="#444"/><text x="789" y="979" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="1005" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het keuzemoment is er en Jochem kiest direct uit het aanbod: K0037 in periode 7. Dat is de regel; een geprioriteerde</text><text x="12" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">voorkeurslijst is de uitzondering. Het studentkeuzesysteem toont eerst het aanbod op Jochems eigen locatie en daarna</text><text x="12" y="1043" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">breder. Dat filter is logica van het studentkeuzesysteem, buiten het informatiemodel. De verbintenis komt op het</text><text x="12" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">keuzedeel en op de onderwijseenheid; de periode lag al vast in de jaaruitzetting van zijn plaatsingsgroep. Sanne,</text><text x="12" y="1081" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Mohammed, Lotte en veertien anderen kiezen ook K0037: samen 18 keuzes.</text></svg>