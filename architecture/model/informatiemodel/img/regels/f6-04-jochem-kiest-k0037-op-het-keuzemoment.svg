<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1202 517" width="1202" height="517"><rect x="0.5" y="0.5" width="1201" height="516" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-04 - Jochem kiest K0037 op het keuzemoment</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="365" height="83" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(485,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeelaanbod ontsluiten naar het</text><text x="152" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">studentkeuzesysteem</text><text x="152" y="111" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">eerder ontstaan, in F6-01</text><rect x="621" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(719,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="631" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="631" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">student</text><rect x="751" y="40" width="439" height="65" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1168,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="761" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="761" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeel kiezen in het studentkeuzesysteem</text><text x="761" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">ontstaat hier</text><path d="M64 123 V253" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 247 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><path d="M673.04 123 V143" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M668.04 137 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="257" width="467" height="152" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(485,262)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod</text><text x="50" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7,</text><text x="50" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">locatie A</text><text x="50" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma aanbod</text><rect x="54" y="351" width="412" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(444,356)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="369" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><text x="64" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1, periode 7, locatie A: 18 plaatsen</text><rect x="649" y="147" width="430" height="66" rx="0" fill="#ffffb5" stroke="#5a5a2a" stroke-width="2.5"/><g transform="translate(1057,152)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="659" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Aanmelding</text><text x="659" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuze: K0037 Farmaceutische Patientenzorg,</text><text x="659" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7, locatie A</text><rect x="649" y="257" width="458" height="169" rx="0" fill="#ffffb5" stroke="#5a5a2a" stroke-width="2.5"/><g transform="translate(1085,262)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="659" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod verbintenis</text><text x="659" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op K0037 Farmaceutische Patientenzorg,</text><text x="659" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7</text><text x="659" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: aangemeld</text><text x="659" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma aanbod verbintenis</text><rect x="663" y="351" width="294" height="65" rx="0" fill="#ffffb5" stroke="#5a5a2a" stroke-width="2.5"/><g transform="translate(935,356)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="673" y="369" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><text x="673" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op D1-K1, periode 7</text><text x="673" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: aangemeld</text><path d="M709 213V257" stroke="#444" stroke-width="1.3" fill="none"/><path d="M709 257l-4 -8h8z" fill="#444"/><text x="717" y="239" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">middels</text><path class="herkomstlijn" d="M507 281H523V171H649" stroke="#444" stroke-width="1.3" fill="none"/><path d="M649 171l-8 -4v8z" fill="#444"/><text x="529" y="166" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Op basis van</text><path class="herkomstlijn" d="M507 281H533V281H649" stroke="#444" stroke-width="1.3" fill="none"/><path class="herkomstlijn" d="M466 375H543V375H663" stroke="#444" stroke-width="1.3" fill="none"/><text x="12" y="448" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het keuzemoment is er en Jochem kiest direct uit het aanbod: K0037 in periode 7. Dat is de regel; een geprioriteerde</text><text x="12" y="467" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">voorkeurslijst is de uitzondering. Het studentkeuzesysteem toont eerst het aanbod op Jochems eigen locatie en pas</text><text x="12" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">daarna breder. Dat filter is logica van het studentkeuzesysteem en krijgt geen eigen objecttype. De verbintenis komt op</text><text x="12" y="505" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het keuzedeel en op de onderwijseenheid; de periode lag al vast in de planning, want daar zit zijn keuzedeelruimte.</text></svg>