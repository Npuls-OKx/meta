<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 555" width="720" height="555"><rect x="0.5" y="0.5" width="719" height="554" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-04 - Jochem kiest K0037 op het keuzemoment</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">student</text><rect x="142" y="40" width="439" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(559,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeel kiezen in het studentkeuzesysteem</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="668" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(686,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Aanmelding</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuze: K0037 Farmaceutische Patientenzorg,</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7, locatie A</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel aanbod Op basis van: K0037 Farmaceutische Patientenzorg, periode 7, locatie A</text><rect x="40" y="223" width="647" height="203" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(665,228)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="241" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod verbintenis</text><rect x="54" y="334" width="582" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(614,339)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><text x="64" y="370" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op D1-K1, periode 7</text><text x="64" y="387" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: aangemeld</text><text x="64" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod hangt aan: D1-K1, periode 7, locatie A: 18 plaatsen</text><text x="50" y="259" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op K0037 Farmaceutische Patientenzorg,</text><text x="50" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7</text><text x="50" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: aangemeld</text><text x="50" y="311" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel aanbod hangt aan: K0037 Farmaceutische Patientenzorg, periode 7, locatie A</text><text x="50" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma aanbod verbintenis</text><path d="M100 195V223" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 223l-4 -8h8z" fill="#444"/><text x="108" y="213" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">middels</text><text x="12" y="448" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het keuzemoment is er en Jochem kiest direct uit het aanbod: K0037 in periode 7.</text><text x="12" y="467" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Dat is de regel; een geprioriteerde voorkeurslijst is de uitzondering. Het</text><text x="12" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">studentkeuzesysteem toont eerst het aanbod op Jochems eigen locatie en pas daarna</text><text x="12" y="505" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">breder. Dat filter is logica van het studentkeuzesysteem en krijgt geen eigen</text><text x="12" y="524" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">objecttype. De verbintenis komt op het keuzedeel en op de onderwijseenheid; de</text><text x="12" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">periode lag al vast in de planning, want daar zit zijn keuzedeelruimte.</text></svg>