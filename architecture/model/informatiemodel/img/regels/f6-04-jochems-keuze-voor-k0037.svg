391 187H663" stroke="#444" stroke-width="1.5" fill="none"/><path d="M663 187l-10 -5v10z" fill="#444"/><rect x="26" y="354" width="467" height="152" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(471,359)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="36" y="372" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod</text><text x="36" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7,</text><text x="36" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">locatie A</text><text x="36" y="425" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma aanbod</text><rect x="40" y="448" width="412" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(430,453)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="466" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><text x="50" y="484" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1, periode 7, locatie A: 18 plaatsen</text><rect x="663" y="244" width="430" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1071,249)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="673" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Aanmelding</text><text x="673" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuze: K0037 Farmaceutische Patientenzorg,</text><text x="673" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7, locatie A</text><rect x="663" y="354" width="458" height="169" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1099,359)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="673" y="372" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod verbintenis</text><text x="673" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op K0037 Farmaceutische Patientenzorg,</text><text x="673" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7</text><text x="673" y="425" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: aangemeld</text><text x="673" y="442" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Opleidingsprogramma aanbod verbintenis</text><rect x="677" y="448" width="294" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(949,453)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="687" y="466" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><text x="687" y="484" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op D1-K1, periode 7</text><text x="687" y="501" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: aangemeld</text><path d="M723 310V354" stroke="#444" stroke-width="1.3" fill="none"/><path d="M723 354l-4 -8h8z" fill="#444"/><text x="731" y="336" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">middels</text><path class="herkomstlijn" d="M493 378H509V268H663" stroke="#444" stroke-width="1.3" fill="none"/><path d="M654 263L663 268L654 273" fill="none" stroke="#444" stroke-width="1.3"/><text x="515" y="263" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Op basis van</text><path class="herkomstlijn" d="M493 378H519V378H663" stroke="#444" stroke-width="1.3" fill="none"/><path class="herkomstlijn" d="M452 472H529V472H677" stroke="#444" stroke-width="1.3" fill="none"/><path d="M12 557H42" stroke="#444" stroke-width="1.3"/><path d="M33 552L42 557L33 562" fill="none" stroke="#444" stroke-width="1.3"/><text x="50" y="561" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">verwijst naar het eerder gemaakte object, geen kopie</text><path d="M421.2 557H451.2" stroke="#444" stroke-width="1.5"/><path d="M451.2 557l-10 -5v10z" fill="#444"/><text x="459" y="561" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="612.5999999999999" cy="557" r="3" fill="#444"/><path d="M612.5999999999999 557H642.5999999999999" stroke="#444" stroke-width="1.3"/><path d="M642.5999999999999 557l-8 -4v8z" fill="#444"/><text x="651" y="561" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="587" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het keuzemoment is er en Jochem kiest direct uit het aanbod: K0037 in periode 7. Dat is de regel; een geprioriteerde</text><text x="12" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">voorkeurslijst is de uitzondering. Het studentkeuzesysteem toont eerst het aanbod op Jochems eigen locatie en pas</text><text x="12" y="625" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">daarna breder. Dat filter is logica van het studentkeuzesysteem en krijgt geen eigen objecttype. De verbintenis komt op</text><text x="12" y="644" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het keuzedeel en op de onderwijseenheid; de periode lag al vast in de planning, want daar zit zijn keuzedeelruimte.</text></svg>