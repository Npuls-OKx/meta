l="#444"/><text x="598" y="809" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="805" r="3" fill="#444"/><path d="M751.1999999999999 805H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 805l-8 -4v8z" fill="#444"/><text x="789" y="809" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="835" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De planner legt de verbintenissen van de 18 studenten die K0037 kozen naast de capaciteitsgroep uit de jaarplanning</text><text x="12" y="854" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">(F2-08). Die groep heeft een maximum van 24, dus de 18 passen: Jochem, Sanne, Mohammed, Lotte en veertien anderen</text><text x="12" y="873" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">worden erin ingedeeld. Bij meer dan 24 keuzes komt er een tweede capaciteitsgroep met een eigen leergelegenheid. Als</text><text x="12" y="892" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">planningsgroep gaat K0037 naar het rooster (F6-12), waar de roosteraar er de lesgroep van maakt. Fijnmazig plannen</text><text x="12" y="911" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">voegt het gebouw toe; het lokaaltype en de docentexpertise lagen al vast.</text></svg>