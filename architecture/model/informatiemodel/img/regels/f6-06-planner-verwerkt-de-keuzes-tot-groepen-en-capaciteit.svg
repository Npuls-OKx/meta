197 178H496" stroke="#444" stroke-width="1.5" fill="none"/><path d="M496 178l-10 -5v10z" fill="#444"/><rect x="26" y="244" width="402" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(406,249)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="36" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="36" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 periode 7, locatie A: prognose 18</text><text x="36" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">studenten</text><rect x="496" y="244" width="755" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1229,249)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="506" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="506" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 periode 7, locatie A: 18 keuzes, de</text><text x="506" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">groep past</text><text x="506" y="315" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: bevestigd</text><text x="506" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op Keuzedeel aanbod (voorstel): K0037 Farmaceutische Patientenzorg, periode 7, locatie A</text><rect x="496" y="372" width="1007" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1481,377)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="506" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod</text><text x="506" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7,</text><text x="506" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">locatie A: 1 groep, 18 plaatsen</text><text x="506" y="443" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: fijnmazig gepland</text><text x="506" y="460" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel specificatie wordt aangeboden als: K0037 Farmaceutische Patientenzorg (480 SBU, aard verdiepend), beroepsspecifiek keuzedeel</text><rect x="496" y="500" width="733" height="363" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1208,505)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="506" y="518" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><text x="506" y="536" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1, periode 7, locatie A: 1 groep, 18</text><text x="506" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">plaatsen</text><text x="506" y="571" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: fijnmazig gepland</text><text x="506" y="588" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie wordt aangeboden als: D1-K1 Voert farmaceutische patientenzorg uit</text><text x="506" y="605" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wordt gegeven op Onderwijslocatie: Campus Zuid (locatie A), gebouw C</text><rect x="510" y="611" width="625" height="117" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1114,616)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="520" y="629" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="520" y="647" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Het medicatieoverzicht opstellen, periode 7: 1</text><text x="520" y="665" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">groep van 18</text><text x="520" y="682" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: fijnmazig gepland</text><text x="520" y="699" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel specificatie wordt aangeboden als: Het medicatieoverzicht opstellen</text><text x="520" y="716" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wordt gegeven op Onderwijslocatie: Campus Zuid (locatie A), gebouw C</text><rect x="510" y="736" width="618" height="117" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1106,741)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="520" y="754" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="520" y="772" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zorg aan specifieke doelgroepen, periode 7: 1</text><text x="520" y="790" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">groep van 18</text><text x="520" y="807" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: fijnmazig gepland</text><text x="520" y="824" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel specificatie wordt aangeboden als: Zorg aan specifieke doelgroepen</text><text x="520" y="841" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wordt gegeven op Onderwijslocatie: Campus Zuid (locatie A), gebouw C</text><path d="M12 897H42" stroke="#444" stroke-width="1.3"/><text x="50" y="901" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 897H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 897l-10 -5v10z" fill="#444"/><text x="598" y="901" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="897" r="3" fill="#444"/><path d="M751.1999999999999 897H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 897l-8 -4v8z" fill="#444"/><text x="789" y="901" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="927" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De planner legt de keuzes naast de planningsgroep uit de jaarplanning (F2-08): 18 keuzes op een prognose van 18, de</text><text x="12" y="946" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">groep past. Fijnmazig plannen voegt de groep en het gebouw toe; het lokaaltype en de docentexpertise lagen al vast bij</text><text x="12" y="965" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het detailleren (F6-01). Past het niet, dan stuurt de planner bij: een groep minder of een groep erbij, zoals in fase</text><text x="12" y="984" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">7. De beelden tonen een voorstel: de planningsgroep hangt aan het keuzedeel (vraag 1 in #579).</text></svg>