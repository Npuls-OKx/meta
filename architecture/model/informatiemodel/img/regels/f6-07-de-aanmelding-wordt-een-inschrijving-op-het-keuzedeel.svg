<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 342" width="1024" height="342"><rect x="0.5" y="0.5" width="1023" height="341" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-07 - De aanmelding wordt een inschrijving op het keuzedeel</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="310" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(430,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeel formeel inschrijven</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="606" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(624,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Inschrijving</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Inschrijving op K0037 Farmaceutische Patientenzorg, periode 7</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Aanmelding wordt</text><rect x="40" y="205" width="550" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(568,210)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod verbintenis</text><text x="50" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op K0037 Farmaceutische Patientenzorg, periode 7</text><text x="50" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><text x="12" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Past het gekozen aanbod, dan wordt Jochems aanmelding een inschrijving en staat zijn verbintenis op het keuzedeelaanbod</text><text x="12" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">op ingeschreven. Past het niet, dan orienteert hij zich opnieuw op een andere periode of locatie; dat is de variant die</text><text x="12" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het kaderscenario beschrijft en die dit voorbeeld verder laat liggen.</text></svg>