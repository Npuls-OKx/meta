<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 699 562" width="699" height="562"><rect x="0.5" y="0.5" width="698" height="561" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-09 - Studentadministratie schrijft Jochem in op het keuzedeel</text><rect x="12" y="40" width="227" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(217,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">studentadministratie</text><rect x="249" y="40" width="310" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(537,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="259" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="259" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeel formeel inschrijven</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="375" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(393,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Inschrijving</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Inschrijving op K0037 Farmaceutische</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Patientenzorg, periode 7</text><text x="50" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Aanmelding Wordt na formalisatie</text><rect x="40" y="223" width="647" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(665,228)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="241" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel aanbod verbintenis</text><text x="50" y="259" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op K0037 Farmaceutische Patientenzorg,</text><text x="50" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7</text><text x="50" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><text x="50" y="311" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Keuzedeel aanbod hangt aan: K0037 Farmaceutische Patientenzorg, periode 7, locatie A</text><rect x="40" y="351" width="611" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(629,356)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="369" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><text x="50" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op D1-K1, periode 7</text><text x="50" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><text x="50" y="421" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod hangt aan: D1-K1, periode 7, locatie A: tot 24 plaatsen</text><text x="12" y="455" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De studentadministratie formaliseert in de kernregistratie Jochems aanmelding</text><text x="12" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">tot een inschrijving, nu het studentkeuzesysteem de verbintenis heeft</text><text x="12" y="493" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">doorgegeven (F6-08). Zijn verbintenissen op het keuzedeel en op de</text><text x="12" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">onderwijseenheid staan daarmee op ingeschreven. Past het niet, dan oriënteert</text><text x="12" y="531" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">hij zich opnieuw op een andere periode of locatie; die variant laat dit</text><text x="12" y="550" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">voorbeeld liggen.</text></svg>