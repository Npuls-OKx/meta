<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 607" width="866" height="607"><rect x="0.5" y="0.5" width="864" height="606" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-12 - Planningssysteem stuurt de leergelegenheden van K0037 naar het roostersysteem</text><rect x="0" y="0" width="4" height="607" fill="#5aa8a8"/><rect x="12" y="54" width="218" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">zonder koppelingspecificatie</text><rect x="242" y="40" width="190" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(409,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="252" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="252" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Planningssysteem</text><path d="M437.44 64H667.44" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M665.44 58l10 6-10 6z" fill="#2a5a5a"/><rect x="677" y="40" width="171" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(827,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="687" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="687" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Roostersysteem</text><rect x="12" y="90" width="383" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Gekozen keuzedeel roosteren en deelnemers delen</text><path d="M451.44 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V264" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M64 122V410" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="625" height="118" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(643,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Het medicatieoverzicht opstellen, periode 7: 1</text><text x="50" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">groep van 18, Campus Zuid (locatie A), gebouw</text><text x="50" y="194" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">C</text><text x="50" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel specificatie wordt aangeboden als: Het medicatieoverzicht opstellen</text><text x="50" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod bevat: D1-K1, periode 7, locatie A: 1 groep, 18 plaatsen</text><rect x="40" y="268" width="618" height="118" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(636,273)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="50" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zorg aan specifieke doelgroepen, periode 7: 1</text><text x="50" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">groep van 18, Campus Zuid (locatie A), gebouw</text><text x="50" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">C</text><text x="50" y="357" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel specificatie wordt aangeboden als: Zorg aan specifieke doelgroepen</text><text x="50" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod bevat: D1-K1, periode 7, locatie A: 1 groep, 18 plaatsen</text><rect x="40" y="414" width="755" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(773,419)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="432" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="50" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 periode 7, locatie A: 18 keuzes, de</text><text x="50" y="468" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">groep past</text><text x="50" y="485" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is gepland op Keuzedeel aanbod (voorstel): K0037 Farmaceutische Patientenzorg, periode 7, locatie A</text><text x="12" y="519" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Planning geeft de leergelegenheden onder K0037 met de planningsgroep aan het roostersysteem.</text><text x="12" y="538" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Bij planning lag de keuze op het keuzedeel en de onderwijseenheid; richting rooster gaat het</text><text x="12" y="557" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">om de laag daaronder. Het vaste roostermoment voor generieke keuzedelen zoals K0262 regelen</text><text x="12" y="576" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">planning en rooster zelf; de uitwisseling draagt het kenmerk generiek keuzedeel. K0037 is</text><text x="12" y="595" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">beroepsspecifiek en wordt binnen het rooster van de eigen opleiding geroosterd.</text></svg>