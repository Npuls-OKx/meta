font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De roosteraar roostert de leergelegenheden van K0037. Jochem krijgt een verbintenis op de leergelegenheid, onder zijn</text><text x="12" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verbintenis op de onderwijseenheid, en komt in een lesgroep. Dat het donderdag wordt, wist hij bij de keuze nog niet:</text><text x="12" y="417" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">hij koos op het aanbod bij planning.</text></svg>