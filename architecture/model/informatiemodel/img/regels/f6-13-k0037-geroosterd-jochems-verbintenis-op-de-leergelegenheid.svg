<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 687 432" width="687" height="432"><rect x="0.5" y="0.5" width="686" height="431" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-13 - K0037 geroosterd: Jochems verbintenis op de leergelegenheid</text><rect x="12" y="40" width="134" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(124,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">roosteraar</text><rect x="156" y="40" width="421" height="66" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(555,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="166" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="166" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Gekozen keuzedeel roosteren en deelnemers</text><text x="166" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">delen</text><path d="M64 106 V126" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 120 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="130" width="449" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(467,135)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Het medicatieoverzicht opstellen, periode 7:</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">donderdagmiddag, leerapotheek, docent 4711</text><text x="50" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geroosterd</text><rect x="40" y="241" width="582" height="100" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(600,246)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="259" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid verbintenis</text><text x="50" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Het medicatieoverzicht opstellen,</text><text x="50" y="295" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7</text><text x="50" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod verbintenis bevat: Jochem op D1-K1, periode 7</text><text x="50" y="329" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Groepeert tot Lesgroep: K0037-P7-A: 18 studenten uit drie plaatsingsgroepen</text><path d="M100 213V241" stroke="#444" stroke-width="1.3" fill="none"/><text x="12" y="363" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De roosteraar roostert de leergelegenheden van K0037. Jochem krijgt een</text><text x="12" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verbintenis op de leergelegenheid, onder zijn verbintenis op de</text><text x="12" y="401" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">onderwijseenheid, en komt in een lesgroep. Dat het donderdag wordt, wist</text><text x="12" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">hij bij de keuze nog niet: hij koos op het aanbod bij planning.</text></svg>