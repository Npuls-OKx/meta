<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1668 788" width="1668" height="788"><rect x="0.5" y="0.5" width="1667" height="787" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-13 - Roosteraar roostert K0037 voor Jochem</text><rect x="12" y="44" width="139" height="22" fill="#f0f1ef" stroke="#b4b9b3"/><rect class="vlak-eerder" x="12" y="66" width="449" height="584" fill="#f0f1ef" stroke="#b4b9b3"/><text x="22" y="59" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#6b726c" text-anchor="start">Eerder ontstaan</text><rect x="617" y="44" width="186" height="22" fill="#ffffff" stroke="#d9531e" stroke-width="2"/><rect class="vlak-hier" x="617" y="66" width="1040" height="584" fill="#ffffff" stroke="#d9531e" stroke-width="2"/><text x="627" y="59" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#d9531e" text-anchor="start">Ontstaat hier · F6-13</text><rect x="631" y="80" width="134" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(743,85)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="641" y="98" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="641" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">roosteraar</text><rect x="631" y="154" width="421" height="66" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1030,159)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="641" y="172" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="641" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Gekozen keuzedeel roosteren en deelnemers</text><text x="641" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">delen</text><path class="toewijzing" d="M660.84 128V154" stroke="#444" stroke-width="1.3" fill="none"/><circle cx="660.84" cy="128" r="3" fill="#444"/><path d="M660.84 154l-4 -8h8z" fill="#444"/><path d="M690.84 220 V240" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M685.84 234 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="26" y="244" width="421" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(425,249)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="36" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Planningsgroep</text><text x="36" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 periode 7, locatie A: 18 keuzes, de</text><text x="36" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">groep past</text><text x="36" y="315" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">uit F6-06</text><rect x="26" y="355" width="294" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(298,360)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="36" y="373" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><text x="36" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op D1-K1, periode 7</text><text x="36" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><text x="36" y="425" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">uit F6-08</text><rect x="631" y="244" width="880" height="204" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1488,249)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="641" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><rect x="645" y="338" width="856" height="100" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><g transform="translate(1478,343)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="655" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="start">Lesgelegenheid</text><text x="655" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Les 1, donderdag 13:00 tot 16:00, week 1 van</text><text x="655" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7</text><text x="655" y="409" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wordt gegeven op Onderwijslocatie: lokaal C2.14 (leerapotheek, vleugel B), in gebouw C op Campus Zuid (locatie A)</text><text x="655" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Medewerker verzorgt (voorstel): docent 4711, farmacie met baliepraktijk</text><text x="641" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Het medicatieoverzicht opstellen, periode 7:</text><text x="641" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">elke donderdag 13:00 tot 16:00, docent 4711</text><text x="641" y="315" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geroosterd</text><text x="641" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel specificatie wordt aangeboden als: Het medicatieoverzicht opstellen</text><rect x="631" y="476" width="347" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(956,481)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="641" y="494" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Lesgroep</text><text x="641" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037-P7-A: 18 studenten uit drie</text><text x="641" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">plaatsingsgroepen</text><rect x="631" y="570" width="439" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1048,575)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="641" y="588" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid verbintenis</text><text x="641" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Het medicatieoverzicht opstellen,</text><text x="641" y="624" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7</text><path d="M1070 594H1532V500H978" stroke="#1f6fb2" stroke-width="1.3" fill="none"/><path d="M978 500l8 -4v8z" fill="#1f6fb2"/><text x="1554" y="504" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1f6fb2" text-anchor="start">Groepeert tot</text><path d="M1070 608H1546V268H1510" stroke="#b5651d" stroke-width="1.3" fill="none"/><path class="herkomstlijn" d="M447 268H463V500H631" stroke="#444" stroke-width="1.3" fill="none"/><path d="M622 495L631 500L622 505" fill="none" stroke="#444" stroke-width="1.3"/><text x="469" y="495" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">vormt (voorstel)</text><path class="herkomstlijn" d="M320 379H473V594H631" stroke="#444" stroke-width="1.3" fill="none"/><path d="M320 379l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M12 670H42" stroke="#444" stroke-width="1.3"/><text x="50" y="674" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">relatie van de plaat: het nieuwe object verwijst naar het eerder gemaakte</text><path d="M559.8 670H589.8" stroke="#444" stroke-width="1.5"/><path d="M589.8 670l-10 -5v10z" fill="#444"/><text x="598" y="674" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="751.1999999999999" cy="670" r="3" fill="#444"/><path d="M751.1999999999999 670H781.1999999999999" stroke="#444" stroke-width="1.3"/><path d="M781.1999999999999 670l-8 -4v8z" fill="#444"/><text x="789" y="674" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="700" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De roosteraar groepeert de 18 studenten uit de planningsgroep, onder wie Jochem, tot een lesgroep, en roostert de</text><text x="12" y="719" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lessen van de leergelegenheid op een lokaal en een docent: elke donderdag op lokaal C2.14 in gebouw C. Een locatie</text><text x="12" y="738" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">heeft een soort (campus, gebouw, lokaal) en hangt in de locatie erboven; de vleugel is een kenmerk van het lokaal,</text><text x="12" y="757" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">zoals in het voorstel van OEAPI #635. Jochem krijgt een verbintenis op de leergelegenheid, onder zijn verbintenis op de</text><text x="12" y="776" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">onderwijseenheid. Dat het donderdag wordt, wist hij bij de keuze nog niet.</text></svg>