5a" stroke-width="1.5"/><path class="trigger" d="M336 178H414" stroke="#444" stroke-width="1.5" fill="none"/><path d="M414 178l-10 -5v10z" fill="#444"/><rect x="26" y="371" width="294" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(298,376)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="36" y="389" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><text x="36" y="407" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op D1-K1, periode 7</text><text x="36" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: ingeschreven</text><rect x="414" y="244" width="449" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(841,249)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="424" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="424" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Het medicatieoverzicht opstellen, periode 7:</text><text x="424" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">donderdagmiddag, leerapotheek, docent 4711</text><text x="424" y="315" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geroosterd</text><rect x="414" y="371" width="582" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(974,376)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="424" y="389" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid verbintenis</text><text x="424" y="407" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Het medicatieoverzicht opstellen,</text><text x="424" y="425" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7</text><text x="424" y="442" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Groepeert tot Lesgroep: K0037-P7-A: 18 studenten uit drie plaatsingsgroepen</text><path d="M474 327V371" stroke="#444" stroke-width="1.3" fill="none"/><path class="herkomstlijn" d="M320 395H352V395H414" stroke="#444" stroke-width="1.3" fill="none"/><path d="M320 395l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M12 488H42" stroke="#444" stroke-width="1.3"/><path d="M33 483L42 488L33 493" fill="none" stroke="#444" stroke-width="1.3"/><text x="50" y="492" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">verwijst naar het eerder gemaakte object, geen kopie</text><path d="M421.2 488H451.2" stroke="#444" stroke-width="1.5"/><path d="M451.2 488l-10 -5v10z" fill="#444"/><text x="459" y="492" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">processtap volgt op</text><circle cx="612.5999999999999" cy="488" r="3" fill="#444"/><path d="M612.5999999999999 488H642.5999999999999" stroke="#444" stroke-width="1.3"/><path d="M642.5999999999999 488l-8 -4v8z" fill="#444"/><text x="651" y="492" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">rol voert uit</text><text x="12" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De roosteraar roostert de leergelegenheden van K0037. Jochem krijgt een verbintenis op de leergelegenheid, onder zijn</text><text x="12" y="537" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">verbintenis op de onderwijseenheid, en komt in een lesgroep. Dat het donderdag wordt, wist hij bij de keuze nog niet:</text><text x="12" y="556" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">hij koos op het aanbod bij planning.</text></svg>