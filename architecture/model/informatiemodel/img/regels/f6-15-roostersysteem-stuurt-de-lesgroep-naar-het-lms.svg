<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1005 368" width="1005" height="368"><rect x="0.5" y="0.5" width="1004" height="367" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-15 - Roostersysteem stuurt de lesgroep naar het LMS</text><rect x="0" y="0" width="4" height="368" fill="#5aa8a8"/><rect x="12" y="54" width="203" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">geen pijl op de hoofdplaat</text><rect x="227" y="40" width="171" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(377,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="237" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="237" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Roostersysteem</text><path d="M404.56 64H672.96" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M670.96 58l10 6-10 6z" fill="#2a5a5a"/><rect x="683" y="40" width="310" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(971,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="693" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="693" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Leer management systeem (LMS)</text><rect x="12" y="90" width="383" height="19" rx