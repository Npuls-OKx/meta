xt><text x="421" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leergelegenheid hangt aan: Het medicatieoverzicht opstellen, periode 7</text><rect x="40" y="250" width="218" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(236,255)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Student</text><text x="50" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, cohort 2026</text><text x="50" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Persoon</text><text x="12" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het roostersysteem geeft de lesgroep met Jochems verbintenis door aan het LMS, zodat hij toegang krijgt tot de</text><text x="12" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeromgeving van K0037.</text></svg>