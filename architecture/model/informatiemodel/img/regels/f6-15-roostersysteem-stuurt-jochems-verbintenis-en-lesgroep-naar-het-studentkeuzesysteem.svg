<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1034 327" width="1034" height="327"><rect x="0.5" y="0.5" width="1033" height="326" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-15 - Roostersysteem stuurt Jochems verbintenis en lesgroep naar het studentkeuzesysteem</text><rect x="0" y="0" width="4" height="327" fill="#5aa8a8"/><rect x="12" y="54" width="218" height="19" rx="4" fill="#ffffff" stroke="#c8ccc9"/><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">zonder koppelingspecificatie</text><rect x="242" y="40" width="171" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(391,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="252" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">van</text><text x="252" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Roostersysteem</text><path d="M418.96000000000004 64H720.24" stroke="#2a5a5a" stroke-width="2" stroke-dasharray="5 4"/><path d="M718.24 58l10 6-10 6z" fill="#2a5a5a"/><rect x="730" y="40" width="291" height="48" rx="0" fill="#b5ffff" stroke="#5aa8a8"/><g transform="translate(1000,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="4" y="2" width="10" height="12"/><rect x="2" y="4" width="4" height="2.5"/><rect x="2" y="8.5" width="4" height="2.5"/></g><text x="740" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2a5a5a" text-anchor="start">naar</text><text x="740" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Student Keuze Systeem (SKS)</text><rect x="12" y="90" width="383" height="19" rx="9" fill="#ffffff" stroke="#c8ccc9" stroke-dasharray="2 2"/><text x="20" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">na: Gekozen keuzedeel roosteren en deelnemers delen</text><path d="M432.96000000000004 64V118" stroke="#2a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="40" y="122" width="611" height="152" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(629,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod verbintenis</text><rect x="54" y="181" width="546" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(578,186)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid verbintenis</text><text x="64" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op Het medicatieoverzicht opstellen,</text><text x="64" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7</text><text x="64" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leergelegenheid hangt aan: Het medicatieoverzicht opstellen, periode 7</text><text x="50" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op D1-K1, periode 7, ingeschreven</text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod hangt aan: D1-K1, periode 7, locatie A: tot 24 plaatsen</text><rect x="675" y="122" width="347" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1000,127)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="685" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Lesgroep</text><text x="685" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037-P7-A: 18 studenten uit drie</text><text x="685" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">plaatsingsgroepen</text><text x="12" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het roostersysteem meldt het studentkeuzesysteem dat Jochem is ingeroosterd: zijn verbintenis op de onderwijseenheid,</text><text x="12" y="315" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">die op de leergelegenheid, en de lesgroep waarin hij zit.</text></svg>