 Het medicatieoverzicht opstellen,</text><text x="306" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">periode 7</text><text x="292" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op D1-K1, periode 7, ingeschreven</text><text x="292" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid aanbod hangt aan: D1-K1, periode 7, locatie A: tot 24 plaatsen</text><rect x="40" y="285" width="347" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(365,290)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Lesgroep</text><text x="50" y="321" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037-P7-A: 18 studenten uit drie</text><text x="50" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">plaatsingsgroepen</text><text x="12" y="373" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het studentkeuzesysteem geeft de verbintenis en de lesgroep door aan het LMS, dat daarmee de</text><text x="12" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeromgeving van K0037 voor Jochem inricht.</text></svg>