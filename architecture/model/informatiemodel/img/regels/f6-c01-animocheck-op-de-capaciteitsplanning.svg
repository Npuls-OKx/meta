<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 939 285" width="939" height="285"><rect x="0.5" y="0.5" width="938" height="284" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-C01 - Animocheck op de capaciteitsplanning</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="412" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(532,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Capaciteitsplanning toetsen aan de animo</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="458" height="101" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1, periode 7, groep KD-A: 19 aanmeldingen</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">bij de animo tegen een prognose van 30, een</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">groep van 24 blijft</text><text x="50" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><rect x="506" y="112" width="421" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(905,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="516" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><text x="516" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">D1-K1, periode 7, groep KD-B: geannuleerd</text><text x="516" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geannuleerd</text><text x="12" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De planner legt de animo naast de capaciteitsplanning uit F2-C01: een groep is genoeg. De docentinzet en het</text><text x="12" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">lokaal van KD-B gaan terug naar de inzetplanning. Een afwijking van ongeveer 37 procent ligt binnen de marge</text><text x="12" y="273" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">die de instelling in dit voorbeeld hanteert; vanaf 50 procent verbetert zij de prognose zelf.</text></svg>