<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 994 303" width="994" height="303"><rect x="0.5" y="0.5" width="993" height="302" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F6-C01 - Capaciteit vastgesteld na de animo</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="356" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Capaciteit vaststellen na de animo</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="467" height="119" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(485,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7,</text><text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planninggroep KD-A: 19 aanmeldingen bij de</text><text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">animo tegen een prognose van 30, een groep van</text><text x="50" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">24 blijft</text><text x="50" y="219" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: gepland</text><rect x="515" y="112" width="467" height="83" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(960,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="525" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leergelegenheid</text><text x="525" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg, periode 7,</text><text x="525" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planninggroep KD-B: geannuleerd</text><text x="525" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: geannuleerd</text><text x="12" y="253" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Na de animo stelt de planner de capaciteit vast: een groep is genoeg. De docentinzet en het lokaal van KD-B gaan</text><text x="12" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">terug naar de inzetplanning. Een afwijking van ongeveer 37 procent ligt binnen de marge die de instelling in dit</text><text x="12" y="291" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">voorbeeld hanteert; vanaf 50 procent verbetert zij de prognose zelf.</text></svg>