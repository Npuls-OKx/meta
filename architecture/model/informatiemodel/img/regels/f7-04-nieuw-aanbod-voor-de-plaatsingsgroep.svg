<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 519 287" width="519" height="287"><rect x="0.5" y="0.5" width="518" height="286" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F7-04 - Nieuw aanbod voor de plaatsingsgroep</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">planner</text><rect x="142" y="40" width="338" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(458,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Nieuw aanbod maken en publiceren</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="467" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(485,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid aanbod</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K2, periode 5, plaatsingsgroep temporiseren</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: bijgestuurd</text><text x="12" y="199" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Nieuw aanbod voor de planninggroep op dezelfde</text><text x="12" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">specificatie. De planner haalt dat bij de catalogus op, of</text><text x="12" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het nu precies het nominale pad van periode 5 is of een</text><text x="12" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">maatwerkprogramma met gelegenheden uit periode 4, 5 en 6.</text><text x="12" y="275" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">In beide gevallen is de catalogus de bron.</text></svg>