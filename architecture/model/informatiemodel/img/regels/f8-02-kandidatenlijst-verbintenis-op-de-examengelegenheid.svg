<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 618 325" width="618" height="325"><rect x="0.5" y="0.5" width="617" height="324" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F8-02 - Kandidatenlijst: verbintenis op de examengelegenheid</text><rect x="12" y="40" width="120" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(110,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">SLB&#x27;er</text><rect x="142" y="40" width="319" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(439,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="152" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="152" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kandidatenlijsten samenstellen</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="328" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(346,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examengelegenheid verbintenis</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem op de proeve, periode 12</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Examengelegenheid hangt aan</text><text x="12" y="199" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De kandidatenlijst: Jochems verbintenis op</text><text x="12" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">de examengelegenheid. Bij een individueel</text><text x="12" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">examen zoals een proeve stelt de SLB&#x27;er</text><text x="12" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">die lijst samen; bij een generiek examen</text><text x="12" y="275" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">doet een medewerker van het examenbureau</text><text x="12" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">dat. De examinator heeft in deze stap geen</text><text x="12" y="313" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">rol.</text></svg>