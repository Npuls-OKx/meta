<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 898 477" width="898" height="477"><rect x="0.5" y="0.5" width="897" height="476" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F8-03 - Afname en beoordeling: de proeve individueel, een centraal examen in een zitting</text><rect x="12" y="40" width="375" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(365,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">examinator, surveillant, beoordelaar</text><rect x="397" y="40" width="421" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(795,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="407" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="407" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zitting uitvoeren en resultaten doorgeven</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="323" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(341,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examengelegenheid resultaat</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve B1-K1: voldoende</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Examengelegenheid verbintenis hangt aan</text><rect x="419" y="112" width="467" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(864,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="429" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Zitting</text><text x="429" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Centraal examen Nederlands 3F, zitting januari</text><text x="429" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">2029</text><rect x="419" y="206" width="412" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(808,211)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="429" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Zittingsrapport</text><text x="429" y="242" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Aanwezigheid en onregelmatigheden bij de</text><text x="429" y="260" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">zitting</text><rect x="419" y="300" width="356" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(753,305)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="429" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examengelegenheid resultaat</text><text x="429" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Centraal examen Nederlands 3F: 7,2</text><text x="12" y="370" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Jochems proeve is een individuele afname die de examinator direct beoordeelt, dus zonder zitting. Een</text><text x="12" y="389" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">centraal georganiseerd examen loopt anders: daar is een zitting, draagt de surveillant het</text><text x="12" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">zittingsrapport met aanwezigheid en onregelmatigheden, en komt het resultaat van een beoordelaar of</text><text x="12" y="427" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">rechtstreeks uit het afnamesysteem bij gesloten vragen. Zitting en zittingsrapport staan nog niet op de</text><text x="12" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">informatiemodelplaat; zij staan hier gestippeld, omdat OKx ze nodig heeft voor de verantwoording</text><text x="12" y="465" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">richting de kernregistratie.</text></svg>