<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 287" width="1015" height="287"><rect x="0.5" y="0.5" width="1014" height="286" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F8-03 - Individuele afname: de proeve beoordeeld</text><rect x="12" y="40" width="134" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(124,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">examinator</text><rect x="156" y="40" width="421" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(555,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="166" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="166" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Zitting uitvoeren en resultaten doorgeven</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="323" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(341,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examengelegenheid resultaat</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve B1-K1: voldoende</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Examengelegenheid verbintenis hangt aan</text><text x="12" y="199" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Een proeve is een individuele afname die direct wordt beoordeeld, dus zonder zitting. Het resultaat is voldoende omdat</text><text x="12" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het examenonderdeel een schaal van onvoldoende, voldoende of goed draagt. Bij een centraal georganiseerd examen loopt</text><text x="12" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">het anders: daar is een zitting, draagt een surveillant het zittingsrapport en komt het resultaat van een beoordelaar</text><text x="12" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">of rechtstreeks uit het afnamesysteem bij gesloten vragen. Zitting, zittingsrapport en beoordelaar staan niet op de</text><text x="12" y="275" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">plaat.</text></svg>