<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 589" width="1015" height="589"><rect x="0.5" y="0.5" width="1014" height="588" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F8-05 - Summatief vastgesteld: resultaten en beoordeling</text><rect x="12" y="40" width="181" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(171,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">examencommissie</text><rect x="203" y="40" width="236" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(417,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="213" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="213" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Summatief vaststellen</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="753" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(771,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examendossier</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Jochem, Apothekersassistent 2026: afnames, zittingsrapporten en beoordelingen</text><rect x="40" y="188" width="310" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(328,193)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatief resultaat</text><text x="50" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1: voldoende, vastgesteld</text><text x="50" y="241" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Examengelegenheid resultaat</text><rect x="40" y="281" width="282" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(300,286)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="299" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Summatieve beoordeling</text><text x="50" y="317" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examencommissie, juni 2029</text><rect x="40" y="357" width="569" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(587,362)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="375" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprogramma resultaat</text><text x="50" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Regulier BOL 2026: alle kerntaken en keuzedelen voldoende</text><text x="50" y="410" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Opleidingsprogramma aanbod verbintenis hangt aan</text><rect x="40" y="450" width="458" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,455)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Keuzedeel resultaat</text><text x="50" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">K0037 Farmaceutische Patientenzorg: voldoende</text><path d="M100 253V281" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 253l-4 8h8z" fill="#444"/><text x="108" y="271" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">met</text><path d="M100 422V450" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 422l-6 10h12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="12" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De examencommissie stelt het summatieve resultaat vast, conform de resultaatstructuur uit fase 1. Zij doet dat op het</text><text x="12" y="539" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">zittingsverslag en het examendossier, want het resultaat zelf zegt niets over onregelmatigheden tijdens de afname. Het</text><text x="12" y="558" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">examendossier staat nog niet op de plaat en is hier gestippeld getoond: het draagt de verantwoording die met de</text><text x="12" y="577" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">vaststelling naar de kernregistratie gaat, en die stap behandelt OKE niet.</text></svg>