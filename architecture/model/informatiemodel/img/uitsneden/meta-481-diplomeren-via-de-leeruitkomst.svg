<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2969 533" width="2969" height="533"><rect x="0.5" y="0.5" width="2968" height="532" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="16" y="36" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1c1c1c" text-anchor="start">Loopt het recht op een diploma of certificaat uitsluitend via de leeruitkomst?</text><text x="16" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Werksessie OKx-informatiemodel en ontwerpvragen, 29 oktober 2026; werkbrief Npuls-OKx/meta#481, ingebracht in Npuls-OKx/Public#135</text><text x="2953" y="36" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="end">v0.2.0</text><g class="groepering"><title>Kwalificatiekader</title><rect x="471" y="112" width="628" height="102" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="471" y="88" width="155" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="481" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Kwalificatiekader</text></g><g class="groepering"><title>Onderwijskundigkader instelling</title><rect x="1237" y="112" width="266" height="102" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="1237" y="88" width="266" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="1247" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Onderwijskundigkader instelling</text></g><g class="groepering"><title>Resultaatstructuur</title><rect x="1559" y="112" width="886" height="102" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="1559" y="88" width="163" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="1569" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Resultaatstructuur</text></g><g class="voorbeeld"><title>Voorbeeld bij Summatieve resultaat structuur: Twaalf leeruitkomsten onder een opleidingsspecificatie</title><rect x="2500" y="112" width="452" height="369" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2931,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="2514" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Summatieve resultaat structuur</text><text x="2514" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Twaalf leeruitkomsten onder een opleidingsspecificatie</text><text x="2514" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">De opleidingsspecificatie wijst</text><text x="2514" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">twaalf leeruitkomsten aan en de</text><text x="2514" y="211" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">structuur weegt ze tot een diploma</text><text x="2514" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">opleidingsspecificatie</text><text x="2687" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">Mechatronica, niveau 4</text><text x="2514" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wijst aan</text><text x="2687" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">twaalf leeruitkomsten</text><text x="2514" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">structuur</text><text x="2687" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">weegt die twaalf tot een uitspraak</text><text x="2514" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">afrondingscriterium</text><text x="2687" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">alle twaalf summatief behaald</text><text x="2514" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">waardedocument</text><text x="2687" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">het diploma</text><text x="2514" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">certificaat</text><text x="2687" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">een subselectie van dezelfde twaalf</text><text x="2514" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Het kwalificatiekader blijft bepalen wat</text><text x="2514" y="362" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">normatief geldig is; de weg naar het</text><text x="2514" y="379" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">waardedocument loopt in het model door de</text><text x="2514" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">leeruitkomsten heen.</text><text x="2514" y="419" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeldcasus mechatronica uit de werkbrief</text><text x="2514" y="433" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Npuls-OKx/meta#481; opgesteld als illustratie en</text><text x="2514" y="447" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">niet ontleend aan een vastgesteld</text><text x="2514" y="461" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">kwalificatiedossier</text></g><g class="aanhechting"><title>voorbeeld uitwerking bij Summatieve resultaat structuur</title><path d="M1938 156 L2472 156 L2472 100 L2727 100" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M2727 100 L2727 111" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1948" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeld uitwerking</text></g><text x="16" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">van het landelijke kader naar het waardedocument, in een lijn</text><g class="relaties"><g class="relatie"><title>Aggregation: Kwalificatie dossier naar Kwalificatie</title><path d="M738 132H792" fill="none" stroke="#444" stroke-width="1.3"/><path d="M738 132l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="765" y="117" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="middle">bevat</text></g><g class="relatie"><title>Association: Kwalificatie naar Leeruitkomst</title><path d="M1085 132H1251" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1251 132l-8 -4v8z" fill="#444"/><text x="1168" y="117" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="middle">Wordt vertaald naar</text></g><g class="relatie"><title>Association: Summatief Afrondingscriterium naar Waarde document (diploma / certificaat)</title><path d="M2167 132H2191" fill="none" stroke="#444" stroke-width="1.3"/><path d="M2191 132l-8 -4v8z" fill="#444"/></g><g class="relatie"><title>Association: Summatieve resultaat structuur naar Leeruitkomst</title><path d="M1573 132H1471" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1471 132l8 -4v8z" fill="#444"/></g><g class="relatie"><title>Association: Summatieve resultaat structuur naar Summatief Afrondingscriterium</title><path d="M1938 132H1962" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1962 132l-8 -4v8z" fill="#444"/></g></g><g class="vakken"><g class="vak"><title>Kwalificatie dossier</title><rect x="485" y="112" width="253" height="88" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(716,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="495" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Kwalificatie dossier</text><text x="495" y="154" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">vastgesteld door S-BB</text><text x="495" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Wordt vertaald naar Leeruitkomst</text></g><g class="vak"><title>Kwalificatie</title><rect x="792" y="112" width="293" height="88" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1063,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="802" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Kwalificatie</text><text x="802" y="154" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">bestaat uit kerntaken en werkprocessen</text></g><g class="vak"><title>Leeruitkomst</title><rect x="1251" y="112" width="220" height="88" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1449,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1261" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Leeruitkomst</text><text x="1261" y="154" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">vertaald door de instelling</text></g><g class="vak"><title>Summatieve resultaat structuur</title><rect x="1573" y="112" width="365" height="88" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1916,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1583" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Summatieve resultaat</text><text x="1583" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">structuur</text><text x="1583" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">zegt welke resultaten samen bewijs vormen</text><text x="1583" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">hangt aan Waarde document (diploma / certificaat)</text></g><g class="vak"><title>Summatief Afrondingscriterium</title><rect x="1962" y="112" width="205" height="88" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2145,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1972" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Summatief</text><text x="1972" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Afrondingscriterium</text></g><g class="vak"><title>Waarde document (diploma / certificaat)</title><rect x="2191" y="112" width="239" height="88" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2408,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="2201" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Waarde document</text><text x="2201" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">(diploma / certificaat)</text><text x="2201" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">in het model zonder kolom</text></g></g><g class="lussen"><g class="relatie"><title>Aggregation: Leeruitkomst naar zichzelf</title><path d="M1471 168H1447V188H1471" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1471 168l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g><g class="relatie"><title>Aggregation: Summatieve resultaat structuur naar zichzelf</title><path d="M1938 168H1914V188H1938" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1938 168l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g></g><g class="leeswijzer"></g><g class="legenda"><rect x="16" y="509" width="18" height="12" rx="0" fill="#ffffb5" stroke="#a8a85a"/><text x="60" y="519" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">OKx referentiekader</text><path d="M203 515H233" fill="none" stroke="#444" stroke-width="1.3"/><path d="M203 515l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="247" y="519" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">aggregatie: het geheel bestaat uit deze delen</text><path d="M562 515H592" fill="none" stroke="#444" stroke-width="1.3"/><path d="M592 515l-8 -4v8z" fill="#444"/><text x="606" y="519" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">associatie: inhoudelijke samenhang</text><rect x="849" y="503" width="32" height="24" rx="0" fill="#ffffb5" stroke="#a8a85a"/><path d="M881 509H861V521H881" fill="none" stroke="#444" stroke-width="1.3"/><path d="M881 509l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="893" y="519" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">aggregatie op zichzelf: delen van hetzelfde type</text><rect x="1230" y="506" width="26" height="18" rx="0" fill="#ffffb5" stroke="#a8a85a"/><path d="M1235 516H1251" fill="none" stroke="#5b6663" stroke-width="1.3"/><text x="1272" y="519" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">regel in een vak: relatie buiten dit raster</text></g></svg>