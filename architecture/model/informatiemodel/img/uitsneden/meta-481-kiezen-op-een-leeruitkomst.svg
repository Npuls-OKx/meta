<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2354 482" width="2354" height="482"><rect x="0.5" y="0.5" width="2353" height="481" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="16" y="36" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kan een behaalde leeruitkomst een voorwaarde zijn op wat een student mag kiezen?</text><text x="16" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Werksessie OKx-informatiemodel en ontwerpvragen, 29 oktober 2026, en kick-off werkgroep techniek Leeruitkomsten, 2 november 2026; werkbrief Npuls-OKx/meta#481, ingebracht in Npuls-OKx/Public#135</text><text x="2338" y="36" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="end">v0.2.0</text><g class="groepering"><title>Onderwijskundigkader instelling</title><rect x="392" y="112" width="266" height="84" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="392" y="88" width="266" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="402" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Onderwijskundigkader instelling</text></g><g class="groepering"><title>Onderwijsspecificatie</title><rect x="760" y="112" width="648" height="84" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="760" y="88" width="186" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="770" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Onderwijsspecificatie</text></g><g class="voorbeeld"><title>Voorbeeld bij Leeruitkomst: Behaald: de keuze staat open</title><rect x="1464" y="112" width="359" height="318" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1800,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1478" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Leeruitkomst</text><text x="1478" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Behaald: de keuze staat open</text><text x="1478" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Meet elektrische grootheden en</text><text x="1478" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">legt de meetwaarden vast</text><text x="1478" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">stand</text><text x="1542" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">behaald</text><text x="1478" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">bewijs</text><text x="1542" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">summatief resultaat op de verbintenis</text><text x="1478" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">gebruik</text><text x="1542" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">voorwaarde vooraf in de keuzeregel</text><text x="1478" y="277" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">De regelset ziet de sleutel van deze</text><text x="1478" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">leeruitkomst terug in de behaalde</text><text x="1478" y="311" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">resultaten en laat de keuze toe.</text><text x="1478" y="334" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeldcasus mechatronica uit de werkbrief</text><text x="1478" y="348" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Npuls-OKx/meta#481; opgesteld als illustratie en</text><text x="1478" y="362" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">niet ontleend aan een vastgesteld</text><text x="1478" y="376" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">kwalificatiedossier</text></g><g class="voorbeeld"><title>Voorbeeld bij Student keuze regelset: Nog niet behaald: de keuze blijft dicht</title><rect x="1878" y="112" width="460" height="318" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2316,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1892" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Student keuze regelset</text><text x="1892" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Nog niet behaald: de keuze blijft dicht</text><text x="1892" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Stelt een regelkring in op een</text><text x="1892" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">werkende installatie</text><text x="1892" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">stand</text><text x="2036" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">nog niet behaald</text><text x="1892" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">gevolg</text><text x="2036" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">de regelset blokkeert de keuze</text><text x="1892" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wat dicht blijft</text><text x="2036" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">het keuzedeel industriele automatisering</text><text x="1892" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wat de regel leest</text><text x="2036" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">de sleutel, niet de tekst</text><text x="1892" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Een leeruitkomst is geen vrijblijvende</text><text x="1892" y="311" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">omschrijving: zolang zij open staat,</text><text x="1892" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">houdt de regelset de</text><text x="1892" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">onderwijsspecificatie erachter dicht.</text><text x="1892" y="368" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeldcasus mechatronica uit de werkbrief</text><text x="1892" y="382" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Npuls-OKx/meta#481; opgesteld als illustratie en</text><text x="1892" y="396" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">niet ontleend aan een vastgesteld</text><text x="1892" y="410" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">kwalificatiedossier</text></g><g class="aanhechting"><title>voorbeeld uitwerking bij Leeruitkomst</title><path d="M639 147 L1436 147 L1436 100 L2108 100" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M1643 100 L1643 111" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M2108 100 L2108 111" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="649" y="141" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeld uitwerking</text></g><text x="16" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">de voorwaarde, de regel, en waarop die regel slaat</text><g class="relaties"><g class="relatie"><title>Association: Keuzedeel naar Keuzedeelruimte</title><path d="M1226 132H1202" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1202 132l8 -4v8z" fill="#444"/></g><g class="relatie"><title>Association: Leeruitkomst naar Student keuze regelset</title><path d="M639 132H774" fill="none" stroke="#444" stroke-width="1.3"/><path d="M774 132l-8 -4v8z" fill="#444"/><text x="706" y="117" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="middle">voorwaarde op</text></g><g class="relatie"><title>Association: Student keuze regelset naar Keuzedeelruimte</title><path d="M1007 132H1031" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1031 132l-8 -4v8z" fill="#444"/></g></g><g class="vakken"><g class="vak"><title>Leeruitkomst</title><rect x="406" y="112" width="233" height="70" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(617,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="416" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Leeruitkomst</text><text x="416" y="154" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">als sleutel, zonder de inhoud</text></g><g class="vak"><title>Student keuze regelset</title><rect x="774" y="112" width="233" height="70" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(985,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="784" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Student keuze regelset</text><text x="784" y="154" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">ADR 0026: verbindende sleutel</text><text x="784" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">hangt aan Keuzedeel</text></g><g class="vak"><title>Keuzedeelruimte</title><rect x="1031" y="112" width="171" height="70" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1180,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1041" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Keuzedeelruimte</text><text x="1041" y="154" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">mbo 4: 720 SBU</text></g><g class="vak"><title>Keuzedeel</title><rect x="1226" y="112" width="168" height="70" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1372,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1236" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Keuzedeel</text></g></g><g class="lussen"><g class="relatie"><title>Aggregation: Leeruitkomst naar zichzelf</title><path d="M639 150H615V170H639" fill="none" stroke="#444" stroke-width="1.3"/><path d="M639 150l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g></g><g class="leeswijzer"></g><g class="legenda"><rect x="16" y="458" width="18" height="12" rx="0" fill="#ffffb5" stroke="#a8a85a"/><text x="60" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">OKx referentiekader</text><path d="M203 464H233" fill="none" stroke="#444" stroke-width="1.3"/><path d="M233 464l-8 -4v8z" fill="#444"/><text x="247" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">associatie: inhoudelijke samenhang</text><rect x="490" y="452" width="32" height="24" rx="0" fill="#ffffb5" stroke="#a8a85a"/><path d="M522 458H502V470H522" fill="none" stroke="#444" stroke-width="1.3"/><path d="M522 458l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="534" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">aggregatie op zichzelf: delen van hetzelfde type</text><rect x="871" y="455" width="26" height="18" rx="0" fill="#ffffb5" stroke="#a8a85a"/><path d="M876 465H892" fill="none" stroke="#5b6663" stroke-width="1.3"/><text x="913" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">regel in een vak: relatie buiten dit raster</text></g></svg>