<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2738 596" width="2738" height="596"><rect x="0.5" y="0.5" width="2737" height="595" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="16" y="36" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1c1c1c" text-anchor="start">Op welk niveau hangt een leeruitkomst, links in het kader en rechts in de specificatie?</text><text x="16" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Werksessie OKx-informatiemodel en ontwerpvragen, 29 oktober 2026, en kick-off werkgroep techniek Leeruitkomsten, 2 november 2026; werkbrief Npuls-OKx/meta#481, ingebracht in Npuls-OKx/Public#135</text><text x="2722" y="36" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="end">v0.3.0</text><g class="groepering"><title>Kwalificatiekader</title><rect x="406" y="112" width="281" height="432" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="406" y="88" width="155" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="416" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Kwalificatiekader</text></g><g class="groepering"><title>Onderwijskundigkader instelling</title><rect x="826" y="112" width="266" height="432" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="826" y="88" width="266" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="836" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Onderwijskundigkader instelling</text></g><g class="groepering"><title>Onderwijsspecificatie</title><rect x="1147" y="112" width="951" height="432" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="1147" y="88" width="186" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="1157" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Onderwijsspecificatie</text></g><g class="voorbeeld"><title>Voorbeeld bij Leeruitkomst: Een leeruitkomst, hergebruikt over drie niveaus</title><rect x="2154" y="112" width="568" height="432" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2700,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="2168" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Leeruitkomst</text><text x="2168" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Een leeruitkomst, hergebruikt over drie niveaus</text><text x="2168" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Bouwt een mechatronisch</text><text x="2168" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">deelsysteem volgens tekening en</text><text x="2168" y="211" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">stelt het werkend af</text><text x="2168" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hergebruik</text><text x="2304" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">drie onderwijsspecificaties wijzen deze leeruitkomst aan</text><text x="2168" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">niveau 2</text><text x="2304" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">monteert uit voorbewerkte onderdelen</text><text x="2168" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">niveau 3</text><text x="2304" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">maakt de ontbrekende onderdelen zelf</text><text x="2168" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">niveau 4</text><text x="2304" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">ontwerpt het deelsysteem eerst zelf</text><text x="2168" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wat gelijk blijft</text><text x="2304" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">de zin en de sleutel</text><text x="2168" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wat verschilt</text><text x="2304" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">wat de student zelf doet</text><text x="2168" y="337" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">niveau</text><text x="2304" y="337" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#d9531e" text-anchor="start">NLQF 2, 3 en 4 op dezelfde zin</text><text x="2168" y="362" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Een leeruitkomst wordt een keer</text><text x="2168" y="379" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">vastgelegd en vanuit elke specificatie</text><text x="2168" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">aangewezen; wat het model openlaat is op</text><text x="2168" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">welk niveau zij wordt geformuleerd.</text><text x="2168" y="436" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeldcasus mechatronica uit de werkbrief</text><text x="2168" y="450" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Npuls-OKx/meta#481; opgesteld als illustratie en</text><text x="2168" y="464" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">niet ontleend aan een vastgesteld</text><text x="2168" y="478" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">kwalificatiedossier</text></g><g class="aanhechting"><title>voorbeeld uitwerking bij Leeruitkomst</title><path d="M1060 494 L2126 494 L2126 100 L2438 100" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M2438 100 L2438 111" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1070" y="488" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeld uitwerking</text></g><text x="16" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">het dossier</text><text x="16" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">de kwalificatie</text><text x="16" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">de kerntaak</text><text x="16" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">het werkproces, de vertaling, en wat ernaar verwijst</text><g class="relaties"><g class="relatie"><title>Aggregation: Onderwijseenheid specificatie naar Leeronderdeel specificatie</title><path d="M1353 478H1329" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1353 478l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g><g class="relatie"><title>Aggregation: Opleidingsprogramma specificatie naar Onderwijseenheid specificatie</title><path d="M1564 478H1540" fill="none" s