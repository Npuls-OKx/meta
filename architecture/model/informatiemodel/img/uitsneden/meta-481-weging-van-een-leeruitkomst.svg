<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3032 538" width="3032" height="538"><rect x="0.5" y="0.5" width="3031" height="537" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="16" y="36" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1c1c1c" text-anchor="start">Hangt de weging van een leeruitkomst in de resultaatstructuur of aan de leeruitkomst zelf?</text><text x="16" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Werksessie OKx-informatiemodel en ontwerpvragen, 29 oktober 2026, en kick-off werkgroep techniek Leeruitkomsten, 2 november 2026; werkbrief Npuls-OKx/meta#481, ingebracht in Npuls-OKx/Public#135</text><text x="3016" y="36" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="end">v0.1.0</text><g class="groepering"><title>Kwalificatiekader</title><rect x="270" y="112" width="196" height="196" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="270" y="88" width="155" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="280" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Kwalificatiekader</text></g><g class="groepering"><title>Onderwijskundigkader instelling</title><rect x="604" y="112" width="266" height="196" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="604" y="88" width="266" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="614" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Onderwijskundigkader instelling</text></g><g class="groepering"><title>Resultaatstructuur</title><rect x="925" y="112" width="980" height="196" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="925" y="88" width="163" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="935" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Resultaatstructuur</text></g><g class="voorbeeld"><title>Voorbeeld bij Summatieve resultaat structuur: Lezing 1: de weging hangt in de resultaatstructuur</title><rect x="1961" y="112" width="510" height="352" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2449,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1975" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Summatieve resultaat structuur</text><text x="1975" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Lezing 1: de weging hangt in de resultaatstructuur</text><text x="1975" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Bouwt een mechatronisch</text><text x="1975" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">deelsysteem volgens tekening en</text><text x="1975" y="211" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">stelt het werkend af</text><text x="1975" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">waar de weging hangt</text><text x="2133" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">bij de instelling, in haar resultaatstructuur</text><text x="1975" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wat zij zegt</text><text x="2133" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">hoe zwaar deze leeruitkomst meetelt</text><text x="1975" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">niveau 2 en 3</text><text x="2133" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">ontwerpen weegt formatief mee</text><text x="1975" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">niveau 4</text><text x="2133" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">ontwerpen weegt summatief mee</text><text x="1975" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wat het model draagt</text><text x="2133" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">examenonderdeel weging, toetsonderdeel weging</text><text x="1975" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">gevolg</text><text x="2133" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">elke instelling weegt zelf</text><text x="1975" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">De leeruitkomst blijft landelijk gelijk;</text><text x="1975" y="362" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wat zij waard is in het examen bepaalt de</text><text x="1975" y="379" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">instelling per onderwijsspecificatie.</text><text x="1975" y="402" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeldcasus mechatronica uit de werkbrief</text><text x="1975" y="416" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Npuls-OKx/meta#481; opgesteld als illustratie en</text><text x="1975" y="430" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">niet ontleend aan een vastgesteld</text><text x="1975" y="444" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">kwalificatiedossier</text></g><g class="voorbeeld"><title>Voorbeeld bij Vertaalaandeel: Lezing 2: de weging hangt aan de leeruitkomst</title><rect x="2527" y="112" width="488" height="352" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(2994,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="2541" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Vertaalaandeel</text><text x="2541" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Lezing 2: de weging hangt aan de leeruitkomst</text><text x="2541" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Bouwt een mechatronisch</text><text x="2541" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">deelsysteem volgens tekening en</text><text x="2541" y="211" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">stelt het werkend af</text><text x="2541" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">waar de weging hangt</text><text x="2699" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">aan de vertaling uit het kwalificatiekader</text><text x="2541" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wat zij zegt</text><text x="2699" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">welk deel van een werkproces afgedekt is</text><text x="2541" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">voor wie</text><text x="2699" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">landelijk gelijk voor elke instelling</text><text x="2541" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">gevolg</text><text x="2699" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">een instelling weegt niet zelf</text><text x="2541" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">wat ontbreekt</text><text x="2699" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">een objecttype dat dat aandeel draagt</text><text x="2541" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Het aandeel is dan deel van de landelijke</text><text x="2541" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">afspraak; de instelling kiest nog hoe zij</text><text x="2541" y="362" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toetst, niet hoe zwaar het in het kader</text><text x="2541" y="379" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">meetelt.</text><text x="2541" y="402" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeldcasus mechatronica uit de werkbrief</text><text x="2541" y="416" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Npuls-OKx/meta#481; opgesteld als illustratie en</text><text x="2541" y="430" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">niet ontleend aan een vastgesteld</text><text x="2541" y="444" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">kwalificatiedossier</text></g><g class="aanhechting"><title>voorbeeld uitwerking bij Summatieve resultaat structuur</title><path d="M1153 148 L1933 148 L1933 100 L2771 100" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M2216 100 L2216 111" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M2771 100 L2771 111" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1163" y="142" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeld uitwerking</text></g><text x="16" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">waar de weging vandaag kan hangen</text><text x="16" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">waar zij ook zou kunnen hangen</text><g class="relaties"><g class="relatie"><title>Aggregation: Formatieve resultaat structuur naar Toetsonderdeel weging</title><path d="M1645 132H1669" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1645 132l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g><g class="relatie"><title>Aggregation: Summatieve resultaat structuur naar Examenonderdeel weging</title><path d="M1153 132H1177" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1153 132l7 -5l7 5l-7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g><g class="relatie"><title>Association: Summatieve resultaat structuur naar Leeruitkomst</title><path d="M939 132H838" fill="none" stroke="#444" stroke-width="1.3"/><path d="M838 132l8 -4v8z" fill="#444"/></g><g class="relatie"><title>Association: Werkproces naar Leeruitkomst</title><path d="M452 132H618" fill="none" stroke="#444" stroke-width="1.3"/><path d="M618 132l-8 -4v8z" fill="#444"/><text x="535" y="117" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="middle">Wordt vertaald naar</text></g><g class="relatie"><title>Association: Vertaalaandeel naar Leeruitkomst (ontbreekt nog in het model: welk deel van een werkproces afgedekt is)</title><path d="M702 240V226H728V184" fill="none" stroke="#ffffff" stroke-width="7" stroke-opacity="0.9"/><path d="M702 240V226H728V184" fill="none" stroke="#d9531e" stroke-width="2.6" stroke-dasharray="6 5"/><path d="M728 184l-4 8h8z" fill="#d9531e"/><text x="736" y="232" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#d9531e" text-anchor="start">telt mee in</text></g></g><g class="vakken"><g class="vak"><title>Werkproces</title><rect x="284" y="112" width="168" height="72" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(430,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="294" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Werkproces</text></g><g class="vak"><title>Leeruitkomst</title><rect x="618" y="112" width="220" height="72" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(816,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="628" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Leeruitkomst</text><text x="628" y="154" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">vertaald door de instelling</text></g><g class="vak"><title>Summatieve resultaat structuur</title><rect x="939" y="112" width="214" height="72" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1131,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="949" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Summatieve resultaat</text><text x="949" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">structuur</text><text x="949" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">van de instelling</text></g><g class="vak"><title>Examenonderdeel weging</title><rect x="1177" y="112" width="231" height="72" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1385,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1187" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Examenonderdeel weging</text></g><g class="vak"><title>Formatieve resultaat structuur</title><rect x="1431" y="112" width="214" height="72" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1623,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1441" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Formatieve resultaat</text><text x="1441" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">structuur</text></g><g class="vak"><title>Toetsonderdeel weging</title><rect x="1669" y="112" width="222" height="72" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(1869,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="1679" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">Toetsonderdeel weging</text></g><g class="vak"><title>Vertaalaandeel</title><rect x="618" y="240" width="168" height="54" rx="0" fill="#ffffff" stroke="#9a9a9a"/><g transform="translate(764,245)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="628" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Vertaalaandeel</text><text x="628" y="282" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#d9531e" text-anchor="start">1 voorstel</text><rect x="615" y="237" width="174" height="60" rx="4" fill="none" stroke="#d9531e" stroke-width="3" stroke-dasharray="6 4"/></g></g><g class="lussen"><g class="relatie"><title>Aggregation: Leeruitkomst naar zichzelf</title><path d="M838 152H814V172H838" fill="none" stroke="#444" stroke-width="1.3"/><path d="M838 152l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g><g class="relatie"><title>Aggregation: Summatieve resultaat structuur naar zichzelf</title><path d="M1153 152H1129V172H1153" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1153 152l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g></g><g class="leeswijzer"><text x="16" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#d9531e" text-anchor="start">1</text><text x="35" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Vertaalaandeel</text><text x="169" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">bestaat alleen als het aandeel landelijk gelijk moet zijn</text></g><g class="legenda"><rect x="16" y="514" width="18" height="12" rx="0" fill="#ffffb5" stroke="#a8a85a"/><text x="60" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">OKx referentiekader</text><rect x="203" y="514" width="18" height="12" rx="2" fill="#ffffff" stroke="#d9531e"/><rect x="201" y="512" width="22" height="16" rx="3" fill="none" stroke="#d9531e" stroke-width="2"/><text x="247" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">voorstel: bestaat nog niet in het model</text