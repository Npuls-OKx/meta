 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g><g class="relatie"><title>Aggregation: Opleidingsprogramma specificatie naar zichzelf</title><path d="M1086 166H1062V186H1086" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1086 166l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g><g class="relatie"><title>Aggregation: Onderwijslocatie naar zichzelf</title><path d="M1536 448H1512V468H1536" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1536 448l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/></g></g><g class="leeswijzer"><text x="16" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#d9531e" text-anchor="start">1</text><text x="35" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Organisatie-eenheid</text><text x="229" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">voert de onderwijsspecificaties uit, en daarmee elk keuzedeel</text><text x="16" y="544" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#d9531e" text-anchor="start">2</text><text x="35" y="544" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Onderwijsvorm</text><text x="229" y="544" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">legt per leeronderdeel vast hoe het onderwijs gegeven wordt</text><text x="16" y="566" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#d9531e" text-anchor="start">3</text><text x="35" y="566" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Onderwijslocatie type</text><text x="229" y="566" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">het soort ruimte dat die onderwijsvorm vraagt</text><text x="16" y="588" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#d9531e" text-anchor="start">4</text><text x="35" y="588" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Onderwijslocatie</text><text x="229" y="588" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">het gebouw of de ruimte, nu gedragen door het aanbod</text></g><g class="legenda"><rect x="16" y="610" width="18" height="12" rx="0" fill="#ffffb5" stroke="#a8a85a"/><text x="60" y="620" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">OKx referentiekader</text><rect x="203" y="610" width="18" height="12" rx="2" fill="#ffffff" stroke="#d9531e"/><rect x="201" y="608" width="22" height="16" rx="3" fill="none" stroke="#d9531e" stroke-width="2"/><text x="247" y="620" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">toegevoegd: nieuw in het model</text><rect x="463" y="610" width="18" height="12" rx="2" fill="#ffffff" stroke="#d9531e"/><rect x="461" y="608" width="22" height="16" rx="3" fill="none" stroke="#d9531e" stroke-width="2"/><text x="507" y="620" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">hernoemd: dezelfde plek, een andere naam</text><path d="M789 616H819" fill="none" stroke="#444" stroke-width="1.3"/><path d="M819 616l-10 -6v12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="833" y="620" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">specialisatie: een bijzonder geval van het algemenere type</text><path d="M1234 616H1264" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1264 616l-8 -4v8z" fill="#444"/><text x="1278" y="620" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">associatie: in