#d9531e" text-anchor="start">5</text><text x="35" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Onderwijslocatie</text><text x="289" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">het werkelijke adres, pas aan de aanbodkant</text><text x="16" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#d9531e" text-anchor="start">6</text><text x="35" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Onderwijslocatie vlekkenplan</text><text x="289" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">welke locaties een eenheid gebruikt</text></g><g class="legenda"><rect x="16" y="514" width="18" height="12" rx="0" fill="#ffffb5" stroke="#a8a85a"/><text x="60" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">OKx referentiekader</text><rect x="203" y="514" width="18" height="12" rx="2" fill="#ffffff" stroke="#d9531e"/><rect x="201" y="512" width="22" height="16" rx="3" fill="none" stroke="#d9531e" stroke-width="2"/><text x="247" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">toegevoegd: nieuw in het model</text><path d="M463 520H493" fill="none" stroke="#444" stroke-width="1.3"/><path d="M493 520l-8 -4v8z" fill="#444"/><text x="507" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">associatie: inhoudelijke samenhang</text><rect x="750" y="508" width="32" height="24" rx="0" fill="#ffffb5" stroke="#a8a85a"/><path d="M782 514H762V526H782" fill="none" stroke="#444" stroke-width="1.3"/><path d="M782 514l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="794" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11" f