" font-size="13" font-weight="bold" fill="#d9531e" text-anchor="start">2</text><text x="35" y="612" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Landelijk Opleidingsprofiel</text><text x="469" y="612" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">bundelt competenties en eindkwalificaties van een opleiding</text><text x="16" y="634" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#d9531e" text-anchor="start">3</text><text x="35" y="634" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Eindkwalificatie</text><text x="469" y="634" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6663" text-anchor="start">realiseert competenties, en vertaalt naar leeruitkomsten</text></g><g class="legenda"><rect x="16" y="656" width="18" height="12" rx="0" fill="#ffffb5" stroke="#a8a85a"/><text x="60" y="666" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">OKx referentiekader</text><rect x="203" y="656" width="18" height="12" rx="0" fill="#e8e8e8" stroke="#9a9a9a"/><text x="247" y="666" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Buiten scope binnen OKx</text><rect x="417" y="656" width="18" height="12" rx="2" fill="#ffffff" stroke="#d9531e"/><rect x="415" y="654" width="22" height="16" rx="3" fill="none" stroke="#d9531e" stroke-width="2"/><text x="461" y="666" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">toegevoegd: nieuw in het model</text><path d="M677 662H707" fill="none" stroke="#444" stroke-width="1.3"/><path d="M707 662l-10 -6v12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="721" y="666" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">specialisatie: een bij