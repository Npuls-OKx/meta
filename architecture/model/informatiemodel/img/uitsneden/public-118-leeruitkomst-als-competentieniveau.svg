<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2104 704" width="2104" height="704"><rect x="0.5" y="0.5" width="2103" height="703" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="16" y="36" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kan een leeruitkomst het niveau van een competentie uitdrukken?</text><text x="16" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Reviewvraag Npuls-OKx/Public#118 van @JanHendrikvanSchaik, werkbrief Npuls-OKx/meta#336</text><g class="groepering"><title>Kwalificatiekader</title><rect x="298" y="112" width="548" height="450" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="298" y="88" width="155" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="308" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Kwalificatiekader</text></g><g class="groepering"><title>Onderwijskundigkader instelling</title><rect x="985" y="112" width="580" height="450" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="985" y="88" width="266" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="995" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Onderwijskundigkader instelling</text></g><g class="voorbeeld"><title>Voorbeeld bij Leeruitkomst</title><rect x="1621" y="112" width="467" height="450" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="1621" y="88" width="226" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="1631" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#d9531e" text-anchor="start">Voorbeeld bij Leeruitkomst</text><text x="1635" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert medicatiebewaking uit onder</text><text x="1635" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">begeleiding in de leerapotheek</text><text x="1635" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">actief werkwoord</text><text x="1764" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">voert uit</text><text x="1635" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">type</text><text x="1764" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">kerntaak B1-K1 farmaceutische patientenzorg</text><text x="1635" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">onderwerp</text><text x="1764" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">medicatiebewaking</text><text x="1635" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">standaard</text><text x="1764" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">onder begeleiding</text><text x="1635" y="249" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">context</text><text x="1764" y="249" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">in de leerapotheek</text><text x="1635" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">niveau</text><text x="1764" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#d9531e" text-anchor="start">werkprocesniveau, B1-K1-W2</text><text x="1635" y="291" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Dezelfde competentie een niveau hoger,</text><text x="1635" y="308" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">met een andere standaard: Biedt</text><text x="1635" y="325" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">farmaceutische patientenzorg in een</text><text x="1635" y="342" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">levensechte apotheekomgeving</text><text x="1635" y="359" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">(kerntaakniveau).</text><text x="1635" y="384" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">zin en gradatie letterlijk uit</text><text x="1635" y="398" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeld-lr1-regels.json; de vijf plekken zijn</text><text x="1635" y="412" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">het Tuning-model uit</text><text x="1635" y="426" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">begrippen/leeruitkomst-vorm/README.md</text></g><text x="16" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">waar de competentie vandaan komt</text><text x="16" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">de leeruitkomst, en wat erin vertaalt</text><text x="16" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">het algemene type: de competentie</text><text x="16" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">waaruit een competentie bestaat</text><g class="relaties"><g class="relatie"><title>Association: Eindkwalificatie naar Leeruitkomst</title><path d="M665 278H999" fill="none" stroke="#444" stroke-width="1.3"/><