ill="none" stroke="#d9531e" stroke-width="2"/><text x="247" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">toegevoegd: nieuw in het model</text><rect x="463" y="458" width="18" height="12" rx="2" fill="#ffffff" stroke="#d9531e"/><rect x="461" y="456" width="22" height="16" rx="3" fill="none" stroke="#d9531e" stroke-width="2"/><text x="507" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">herplaatst: aan een ander objecttype gehangen</text><path d="M822 464H852" fill="none" stroke="#444" stroke-width="1.3"/><path d="M852 464l-10 -6v12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="866" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">specialisatie: een bijzonder geval van het algemenere type</text><path d="M1267 464H1297" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1297 464l-8 -4v8z" fill="#444"/><text x="1311" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">associatie: inhoudelijke samenhang</text><rect x="1554" y="452" width="32" height="24" rx="0" fill="#ffffb5" stroke="#a8a85a"/><path d="M1586 458H1566V470H1586" fill="none" stroke="#444" stroke-width="1.3"/><path d="M1586 458l-7 -5l-7 5l7 5z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="1598" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">aggregatie op zichzelf: delen van hetzelfde type</text><rect x="1934" y="455" width="26" height="18" rx="0" fill="#ffffb5" stroke="#a8a85a"/><path d="M1939 465H1955" fill="none" stroke="#5b6663" stroke-width="1.3"/><text x="1976" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">regel in een vak: relatie buiten dit raster</text></g></svg>