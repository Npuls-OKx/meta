<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3252 482" width="3252" height="482"><rect x="0.5" y="0.5" width="3251" height="481" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="16" y="36" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1c1c1c" text-anchor="start">Hoe hangt het keuzedeel aan het landelijke kwalificatiekader?</text><text x="16" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Reviewvraag Npuls-OKx/Public#124 van @niesink, werkbrief Npuls-OKx/meta#390</text><g class="groepering"><title>Kwalificatiekader</title><rect x="572" y="112" width="970" height="274" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="572" y="88" width="155" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="582" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Kwalificatiekader</text></g><g class="groepering"><title>Onderwijskundigkader instelling</title><rect x="1680" y="112" width="466" height="274" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="1680" y="88" width="266" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="1690" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Onderwijskundigkader instelling</text></g><g class="groepering"><title>Onderwijsspecificatie</title><rect x="2284" y="112" width="598" height="274" rx="0" fill="#f4f4f4" stroke="#d8ddda"/><rect x="2284" y="88" width="186" height="24" rx="0" fill="#e4e4dc" stroke="#d8ddda"/><text x="2294" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5a5a2a" text-anchor="start">Onderwijsspecificatie</text></g><g class="voorbeeld"><title>Voorbeeld bij Keuzedeel: Een keuzedeel uit de landelijke structuur</title><rect x="2938" y="112" width="299" height="274" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(3214,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="2952" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Keuzedeel</text><text x="2952" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b6663" text-anchor="start">Een keuzedeel uit de landelijke structuur</text><text x="2952" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1c1c1c" text-anchor="start">Ondernemend gedrag, K0072</text><text x="2952" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">landelijke code</text><text x="3081" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">K0072</text><text x="2952" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">vastgesteld door</text><text x="3081" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">S-BB</text><text x="2952" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">studielast</text><text x="3081" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">240 SBU</text><text x="2952" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">bij kwalificatie</text><text x="3081" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start">crebo 25646</text><text x="2952" y="275" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">voorbeeld-lr1-regels.json, keuzedeel bij</text><text x="2952" y="289" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Apothekersassistent</text></g><g class="aanhechting"><t