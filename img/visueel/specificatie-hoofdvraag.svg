<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 738" width="1200" height="738" role="img" aria-label="Hoe ziet onze specificatie eruit?"><rect width="1200" height="738" fill="#ffffff"/><rect x="0.5" y="0.5" width="1199" height="737" rx="12" fill="none" stroke="#E5E7EB"/><text x="40" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#1A1A2E" font-weight="600">Hoe ziet onze specificatie eruit?</text><text x="40" y="90" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6B7280">De vraag waar het werk van OKx op uitkomt, en waarom de vorm nog niet vaststaat</text><rect x="40" y="118" width="548" height="294" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 118H578" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><text x="58" y="146" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#3D68EC" font-weight="600">Wat er in concept ligt</text><circle cx="60" cy="160" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="164" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="164" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Een eerste pakket koppelvlakspecificaties</text><text x="76" y="184" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">Public, uitgave 0.0.1 van augustus 2026, zonder review</text><circle cx="60" cy="200" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">De herziening naar interactieketens</text><text x="76" y="224" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">meta PR 373 en 387, op een branch</text><circle cx="60" cy="240" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="244" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="244" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Een laag applicatiediensten eronder</text><text x="76" y="264" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">Public PR 100</text><circle cx="60" cy="280" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="284" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="284" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Het informatiemodel met de begrippenlijst</text><text x="76" y="304" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">80 objecttypen, 226 relaties</text><circle cx="60" cy="320" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="324" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="324" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">De route naar een OEAPI-profiel</text><text x="76" y="344" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">OEAPI tenzij, als overlay op de standaard</text><circle cx="60" cy="360" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="364" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="364" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">De voorbeeldregels per processtap</text><text x="76" y="384" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">leerroute 1, 67 beelden uit een regeltabel</text><rect x="612" y="118" width="548" height="294" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M622 118H1150" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><text x="630" y="146" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#DD784B" font-weight="600">Wat nog open staat</text><circle cx="632" cy="160" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="632" y="164" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="648" y="164" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Op welk niveau de set wordt geknipt: capability, koppelvlakdienst of keten</text><text x="648" y="184" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">issue 342</text><circle cx="632" cy="200" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="632" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="648" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Hoe optionaliteit zich in een profiel laat uitdrukken</text><text x="648" y="224" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">issue 447</text><circle cx="632" cy="240" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="632" y="244" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="648" y="244" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Met welke woorden de lagen worden benoemd</text><text x="648" y="264" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">issue 445</text><circle cx="632" cy="280" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="632" y="284" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="648" y="284" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Wat een instelling moet kunnen om een leerroute te realiseren. De taal</text><text x="648" y="300" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">daarvoor is in aanbouw en begint bruikbaar te worden</text><text x="648" y="320" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">issue 424 en 440</text><text x="40" y="453" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1B2A6B" font-weight="600">De route om dat beeld te krijgen</text><rect x="40" y="466" width="197" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 466H227" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><g transform="translate(127 484) scale(0.6875)"><path fill="#00AF81" d="M30 30h-2v-5a5.006 5.006 0 0 0-5-5v-2a7.01 7.01 0 0 1 7 7Zm-8 0h-2v-5a5.006 5.006 0 0 0-5-5H9a5.006 5.006 0 0 0-5 5v5H2v-5a7.01 7.01 0 0 1 7-7h6a7.01 7.01 0 0 1 7 7ZM20 2v2a5 5 0 0 1 0 10v2a7 7 0 0 0 0-14m-8 2a5 5 0 1 1-5 5a5 5 0 0 1 5-5m0-2a7 7 0 1 0 7 7a7 7 0 0 0-7-7"/></g><text x="138" y="526" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Persona</text><text x="138" y="544" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">wie is de lerende</text><path d="M245 514H254" stroke="#DD784B" stroke-width="2"/><path d="M263 514l-10 -5v10z" fill="#DD784B"/><rect x="271" y="466" width="197" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M281 466H458" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><g transform="translate(358 484) scale(0.6875)"><path fill="#00AF81" d="M13 13h6v2h-6z"/><path fill="#00AF81" d="m25.44 8l-1.27-4.55A2.01 2.01 0 0 0 22.246 2H9.754a2.01 2.01 0 0 0-1.923 1.45L6.531 8H4v2h2v7a2.003 2.003 0 0 0 2 2v3h2v-3h12v3h2v-3a2.003 2.003 0 0 0 2-2v-7h2V8ZM9.755 4h12.492l1.428 5H8.326ZM24 13h-2v2h2v2H8v-2h2v-2H8v-2h16ZM2 16h2v14H2zm26 0h2v14h-2z"/><path fill="#00AF81" d="M15 21h2v3h-2zm0 5h2v4h-2z"/></g><text x="369" y="526" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Leerroutedocument</text><text x="369" y="544" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">wat de instelling doet per fase</text><path d="M476 514H485" stroke="#DD784B" stroke-width="2"/><path d="M494 514l-10 -5v10z" fill="#DD784B"/><rect x="502" y="466" width="197" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M512 466H688" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><g transform="translate(589 484) scale(0.6875)"><path fill="#00AF81" d="M27 22.14V17a2 2 0 0 0-2-2h-8V9.86a4 4 0 1 0-2 0V15H7a2 2 0 0 0-2 2v5.14a4 4 0 1 0 2 0V17h18v5.14a4 4 0 1 0 2 0M8 26a2 2 0 1 1-2-2a2 2 0 0 1 2 2m6-20a2 2 0 1 1 2 2a2 2 0 0 1-2-2m12 22a2 2 0 1 1 2-2a2 2 0 0 1-2 2"/></g><text x="600" y="526" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Voorbeeldregels</text><text x="600" y="544" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">welke objecten bewegen per stap</text><path d="M706 514H715" stroke="#DD784B" stroke-width="2"/><path d="M724 514l-10 -5v10z" fill="#DD784B"/><rect x="732" y="466" width="197" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M742 466H919" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><g transform="translate(820 484) scale(0.6875)"><path fill="#DD784B" d="m29 27.586l-7.552-7.552a11.018 11.018 0 1 0-1.414 1.414L27.586 29ZM4 13a9 9 0 1 1 9 9a9.01 9.01 0 0 1-9-9"/></g><text x="831" y="526" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Wat ontbreekt</text><text x="831" y="544" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">begrippen die de reis blootlegt</text><path d="M937 514H946" stroke="#DD784B" stroke-width="2"/><path d="M955 514l-10 -5v10z" fill="#DD784B"/><rect x="963" y="466" width="197" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M973 466H1150" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(1051 484) scale(0.6875)"><path fill="#3D68EC" d="M29 24.184V7.816A3 3 0 0 0 31 5c0-1.654-1.346-3-3-3s-3 1.346-3 3c0 .392.08.763.217 1.106L16 14.171L6.783 6.106A3 3 0 0 0 7 5c0-1.654-1.346-3-3-3S1 3.346 1 5c0 1.302.838 2.401 2 2.815v16.37A2.995 2.995 0 0 0 1 27c0 1.654 1.346 3 3 3s3-1.346 3-3a2.97 2.97 0 0 0-.595-1.775l5.333-4.668l2.365 4.138A2.98 2.98 0 0 0 13 27c0 1.654 1.346 3 3 3s3-1.346 3-3c0-.931-.435-1.754-1.103-2.305l2.365-4.138l5.333 4.667A2.97 2.97 0 0 0 25 27c0 1.654 1.346 3 3 3s3-1.346 3-3a3 3 0 0 0-2-2.816M28 4a1.001 1.001 0 0 1 0 2a1 1 0 0 1 0-2m-3.822 5.673l-4.44 7.77l-2.22-1.943zM14.482 15.5l-2.22 1.942l-4.44-7.77zM4 4a1.001 1.001 0 0 1 0 2a1 1 0 0 1 0-2m0 24a1.001 1.001 0 0 1 0-2a1.001 1.001 0 0 1 0 2m1-4.204V8.766l5.726 10.02zM16 28a1.001 1.001 0 0 1 0-2a1.001 1.001 0 0 1 0 2m0-4.015l-2.726-4.771L16 16.829l2.726 2.385zm11-15.22v15.031l-5.726-5.01zM28 28a1.001 1.001 0 0 1 0-2a1.001 1.001 0 0 1 0 2"/></g><text x="1062" y="526" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Informatiemodel</text><text x="1062" y="544" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">aangevuld, en de taal groeit</text><text x="40" y="601" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">De reis stap voor stap doorlopen legt bloot welke begrippen ontbreken. Zo kwam de nominale leerroute boven water. Dat is geen illustratie achteraf maar de manier</text><text x="40" y="620" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">waarop de taal wordt opgebouwd.</text><path d="M40 658H1160" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="683" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280">Rijpheid: wat er ligt staat op niveau 3 en 4, niveau 5 en 7 zijn leeg, en de uitgave die niveau 6 haalde kreeg geen review. Het vastzetten van de vorm wacht op een scherper</text><text x="40" y="701" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280">beeld van wat een instelling moet kunnen.</text></svg>