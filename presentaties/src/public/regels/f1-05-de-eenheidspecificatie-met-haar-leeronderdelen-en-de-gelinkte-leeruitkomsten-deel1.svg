<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 504" width="1024" height="504"><rect x="0.5" y="0.5" width="1023" height="781" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-05 - De eenheidspecificatie met haar leeronderdelen en de gelinkte leeruitkomsten</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="486" height="65" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(694,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwalificatiedossier vertalen naar leeruitkomsten</text><text x="240" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: van kerntaak naar eenheid en leeronderdelen</text><path d="M64 105 V125" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 119 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="129" width="458" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(476,134)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Onderwijseenheid specificatie</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><text x="50" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="222" width="846" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(864,227)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Biedt farmaceutische patiëntenzorg in een levensechte apotheekomgeving (kerntaakniveau)</text><text x="50" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="315" width="957" height="65" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(975,320)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="333" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert baliegesprek en triage uit in de simulatieapotheek, onderbouwd met theorie (werkprocesniveau)</text><text x="50" y="368" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><rect x="40" y="408" width="632" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(650,413)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1-W1 Baliegesprek en triage</text><text x="50" y="461" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="478" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie bevat: Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><rect x="40" y="518" width="809" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(827,523)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="536" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert medicatiebewaking uit onder begeleiding in de leerapotheek (werkprocesniveau)</text><text x="50" y="571" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="588" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">bevat Leeruitkomst</text><rect x="40" y="628" width="632" height="82" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(650,633)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="646" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeronderdeel specificatie</text><text x="50" y="664" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">B1-K1-W2 Medicatiebewaking</text><text x="50" y="681" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: onderwijskundig vertaald</text><text x="50" y="698" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Onderwijseenheid specificatie bevat: Blok B1-K1 Biedt farmaceutische patiëntenzorg</text><path d="M100 194V222" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 287V315" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 287l-5 7l5 7l5 -7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M100 380V408" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 600V628" stroke="#444" stroke-width="1.3" fill="none"/><text x="12" y="732" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Verdieping: de leeruitkomst zit niet in de eenheid, zij staat ernaast. De onderwijseenheidspecificatie verwijst naar de</text><text x="12" y="751" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeruitkomst op kerntaakniveau, en elke leeronderdeelspecificatie naar haar eigen leeruitkomst op werkprocesniveau. Zo</text><text x="12" y="770" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">loopt de herkomst uit het kwalificatiedossier via de leeruitkomst, niet langs de specificatie zelf.</text></svg>