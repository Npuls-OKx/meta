" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">BOT 50 / OOT 50 SBU</text><text x="50" y="1314" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Onderwijsvorm specificatie</text><rect x="40" y="1354" width="632" height="117" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(650,1359)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="1372" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Collectie van Leermiddelgroepen</text><text x="50" y="1390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Leermiddelen voor de baliesimulatie</text><rect x="54" y="1413" width="606" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(638,1418)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="1431" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Leermiddelgroep</text><text x="64" y="1449" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Apotheekbalie-opstelling, receptenlijnsysteem, oefenmedicatie</text><text x="50" y="1407" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Leeronderdeel / Leeractiviteit specificatie bevat: B1-K1-W1 Baliegesprek en triage</text><path d="M100 490V518" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 566V594" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 594l-6 -10h12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M100 880V908" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 880l-4 8h8z" fill="#444"/><text x="108" y="898" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Heeft meerdere</text><text x="12" y="1493" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Rond de eenheid legt de instelling haar onderwijsontwerp vast; alles hieronder wordt onderdeel van de eenheid- en</text><text x="12" y="1512" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">leeronderdeelspecificatie. De gewenste leeromgeving is een ruimteprofiel, geen lokaal: zij zegt welke ruimte past en</text><text x="12" y="1531" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">sorteert voor op een onderwijslocatie met dat lokaaltype. Het docentprofiel werkt net zo en draagt de skills die de</text><text x="12" y="1550" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">instelling erbij verwacht; de persoon zelf volgt bij plannen. De leermiddelen hangen aan het leeronderdeel.</text></svg>