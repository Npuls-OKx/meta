<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 504 1007 559" width="1007" height="559"><rect x="0.5" y="0.5" width="1006" height="1062" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">F1-10 - De examenonderdeelspecificatie met haar toetsvorm, instrumenten, materiaal en ruimte</text><rect x="12" y="40" width="181" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(171,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">examencommissie</text><rect x="203" y="40" width="504" height="65" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(685,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="213" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="213" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Exameninstrumenten bepalen, inkopen of construeren</text><text x="213" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">verdieping: examenvorm, instrument en beoordelaar</text><path d="M64 105 V125" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 119 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="129" width="615" height="99" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(633,134)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Examenonderdeelspecificatie</text><text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid B1-K1, met vorm, instrumenten en ruimte</text><text x="50" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">toestand: uitgewerkt</text><text x="50" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Leeruitkomst: Biedt farmaceutische patientenzorg (kerntaakniveau)</text><text x="50" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Toetsonderdeel specificatie</text><rect x="40" y="256" width="712" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(730,261)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Toetsvormspecificatie</text><text x="50" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Proeve van bekwaamheid in de simulatieapotheek</text><text x="50" y="309" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Onderwijsvorm specificatie: dezelfde vorm als het onderwijsontwerp, nu voor het examen</text><rect x="40" y="349" width="449" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(467,354)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="367" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Toetsvorm</text><text x="50" y="385" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijkbeoordeling aan de balie, 45 minuten</text><rect x="40" y="425" width="755" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(773,430)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="443" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Toetsinstrument</text><text x="50" y="461" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Beoordelingsformulier met rubric, ingekocht bij de branche</text><text x="50" y="478" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">is een Collectie van Leermiddelgroepen: het materiaal bij de toets: ingekocht of zelf geconstrueerd</text><rect x="40" y="518" width="827" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(845,523)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="536" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Leermiddelgroep</text><text x="50" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examenmateriaal: oefenrecepten, casuskaarten, baliemateriaal</text><text x="50" y="571" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Collectie van Leermiddelgroepen bevat: het toetsinstrument is zo&#x27;n collectie: ingekocht of zelf geconstrueerd</text><rect x="40" y="611" width="624" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(642,616)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="629" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Onderwijsruimte type</text><text x="50" y="647" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Praktijkruimte met baliesimulatie, afsluitbaar voor examinering</text><text x="50" y="664" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">Les specificatie / toets specificatie bevat</text><rect x="40" y="704" width="611" height="65" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(629,709)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="722" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Gewenst medewerker competentieprofiel</text><text x="50" y="740" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Examinator met baliepraktijk en toetsbekwaamheid</text><text x="50" y="757" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6663" text-anchor="start">hangt aan Toetsvormspecificatie: Proeve van bekwaamheid in de simulatieapotheek</text><rect x="40" y="797" width="680" height="156" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(698,802)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="815" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Competenties / skills</text><text x="50" y="833" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Profiel examinator: de skills die de instelling bij dit type verwacht</text><rect x="54" y="839" width="495" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(527,844)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="857" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Vaardigheid</text><text x="64" y="875" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Beoordelen en feedback geven (CompetentNL laag 2)</text><rect x="54" y="895" width="365" height="48" rx="0" fill="#efe6ff" stroke="#9b86c9" stroke-dasharray="5 3"/><g transform="translate(397,900)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="64" y="913" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4a3a78" text-anchor="start">Kennis</text><text x="64" y="931" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Farmacie en toetsing (ISCED-F 0916)</text><path d="M100 321V349" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 349l-6 -10h12z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><path d="M100 397V425" stroke="#444" stroke-width="1.3" fill="none"/><text x="12" y="975" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">De examencommissie werkt de examenonderdeelspecificatie uit zoals de onderwijsontwerper de eenheid: alles hieronder</text><text x="12" y="994" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">wordt er onderdeel van. De toetsvorm zegt hoe er wordt geexamineerd, het instrument en het materiaal waarmee, het</text><text x="12" y="1013" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">ruimtetype waar het goed af te nemen is, en het profiel wie mag beoordelen, met de skills die daarbij horen. De</text><text x="12" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">specificatie zelf verwijst naar de leeruitkomst die het examen aftikt; de afname volgt in fase 2 als examenmoment met</text><text x="12" y="1051" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">instrument.</text></svg>