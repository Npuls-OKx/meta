<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 418" width="1200" height="418" role="img" aria-label="Waarop de uitwerking steunt"><rect width="1200" height="418" fill="#ffffff"/><rect x="0.5" y="0.5" width="1199" height="417" rx="12" fill="none" stroke="#E5E7EB"/><text x="40" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#1A1A2E" font-weight="600">Waarop de uitwerking steunt</text><text x="40" y="90" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6B7280">De architectuurbesluiten die de rest van het werk dragen</text><rect x="40" y="118" width="268" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 118H298" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(56 136) scale(0.6875)"><path fill="#3D68EC" d="M28 2H16a2 2 0 0 0-2 2v10H4a2 2 0 0 0-2 2v14h28V4a2 2 0 0 0-2-2M9 28v-7h4v7Zm19 0H15v-8a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v8H4V16h12V4h12Z"/><path fill="#3D68EC" d="M18 8h2v2h-2zm6 0h2v2h-2zm-6 6h2v2h-2zm6 0h2v2h-2zm-6 6h2v2h-2zm6 0h2v2h-2z"/></g><text x="56" y="178" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Intra-instelling eerst</text><text x="56" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">federatie tussen instellingen gefaseerd,</text><text x="56" y="217" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">ADR 0008</text><rect x="324" y="118" width="268" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M334 118H582" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(340 136) scale(0.6875)"><path fill="#3D68EC" d="m24 17l1.912 3.703l4.088.594L27 24l.771 4L24 25.75L20.229 28L21 24l-3-2.703l4.2-.594zM6 16h6v2H6zm0-4h10v2H6zm0-4h10v2H6z"/><path fill="#3D68EC" d="M16 26H4V6h24v10h2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h12Z"/></g><text x="340" y="178" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">De leeruitkomst als sleutel</text><text x="340" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">zij verbindt specificatie, aanbod en</text><text x="340" y="217" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">resultaat, ADR 0026</text><rect x="608" y="118" width="268" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M618 118H866" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(624 136) scale(0.6875)"><path fill="#3D68EC" d="M29 24.184V7.816A3 3 0 0 0 31 5c0-1.654-1.346-3-3-3s-3 1.346-3 3c0 .392.08.763.217 1.106L16 14.171L6.783 6.106A3 3 0 0 0 7 5c0-1.654-1.346-3-3-3S1 3.346 1 5c0 1.302.838 2.401 2 2.815v16.37A2.995 2.995 0 0 0 1 27c0 1.654 1.346 3 3 3s3-1.346 3-3a2.97 2.97 0 0 0-.595-1.775l5.333-4.668l2.365 4.138A2.98 2.98 0 0 0 13 27c0 1.654 1.346 3 3 3s3-1.346 3-3c0-.931-.435-1.754-1.103-2.305l2.365-4.138l5.333 4.667A2.97 2.97 0 0 0 25 27c0 1.654 1.346 3 3 3s3-1.346 3-3a3 3 0 0 0-2-2.816M28 4a1.001 1.001 0 0 1 0 2a1 1 0 0 1 0-2m-3.822 5.673l-4.44 7.77l-2.22-1.943zM14.482 15.5l-2.22 1.942l-4.44-7.77zM4 4a1.001 1.001 0 0 1 0 2a1 1 0 0 1 0-2m0 24a1.001 1.001 0 0 1 0-2a1.001 1.001 0 0 1 0 2m1-4.204V8.766l5.726 10.02zM16 28a1.001 1.001 0 0 1 0-2a1.001 1.001 0 0 1 0 2m0-4.015l-2.726-4.771L16 16.829l2.726 2.385zm11-15.22v15.031l-5.726-5.01zM28 28a1.001 1.001 0 0 1 0-2a1.001 1.001 0 0 1 0 2"/></g><text x="624" y="178" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Het model is de bron</text><text x="624" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">beelden en lijsten volgen uit ArchiMate,</text><text x="624" y="217" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">ADR 0010</text><rect x="892" y="118" width="268" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M902 118H1150" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><g transform="translate(908 136) scale(0.6875)"><path fill="#DD784B" d="M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2m0 26a12 12 0 1 1 12-12a12 12 0 0 1-12 12"/><path fill="#DD784B" d="M15 8h2v11h-2zm1 14a1.5 1.5 0 1 0 1.5 1.5A1.5 1.5 0 0 0 16 22"/></g><text x="908" y="178" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Eisen voor de techniekkeuze</text><text x="908" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">een mismatch wordt een signalering</text><text x="908" y="217" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">richting de standaard</text><text x="40" y="281" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">Een besluit draagt zijn eigen Status-regel; die is leidend. Een besluit kan ook vervangen zijn. Het onderscheid uit besluit 0021 is in beweging: het kan opgaan in de</text><text x="40" y="300" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">interactieketen en de interactiespecificatie.</text><path d="M40 338H1160" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="363" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280">Status: alle 26 besluiten staan op Voorstel, status 4. Zij leggen herleidbaar vast wat het team koos; een gremium heeft ze nog niet gedragen. De besluiten staan in</text><text x="40" y="381" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280">Npuls-OKx/Public, onder Referentiemateriaal.</text></svg>