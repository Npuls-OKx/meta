<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 526" width="1200" height="526" role="img" aria-label="De fasen van OKx"><rect width="1200" height="526" fill="#ffffff"/><rect x="0.5" y="0.5" width="1199" height="525" rx="12" fill="none" stroke="#E5E7EB"/><text x="40" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#1A1A2E" font-weight="600">De fasen van OKx</text><text x="40" y="90" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6B7280">Waar het project staat, en wat er na de oplevering nog moet gebeuren</text><rect x="40" y="118" width="254" height="112" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 118H284" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(156 136) scale(0.6875)"><path fill="#3D68EC" d="m25.7 9.3l-7-7c-.2-.2-.4-.3-.7-.3H8c-1.1 0-2 .9-2 2v24c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-.3-.1-.5-.3-.7M18 4.4l5.6 5.6H18zM24 28H8V4h8v6c0 1.1.9 2 2 2h6z"/><path fill="#3D68EC" d="M10 22h12v2H10zm0-6h12v2H10z"/></g><text x="167" y="178" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Specificatie</text><text x="167" y="196" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">hier staat OKx nu</text><path d="M302 174H312" stroke="#DD784B" stroke-width="2"/><path d="M320 174l-10 -5v10z" fill="#DD784B"/><rect x="328" y="118" width="254" height="112" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M338 118H573" stroke="#6B7280" stroke-width="4" stroke-linecap="round"/><g transform="translate(445 136) scale(0.6875)"><path fill="#6B7280" d="M26 22a3.86 3.86 0 0 0-2 .57l-3.09-3.1a6 6 0 0 0 0-6.94L24 9.43a3.86 3.86 0 0 0 2 .57a4 4 0 1 0-4-4a3.86 3.86 0 0 0 .57 2l-3.1 3.09a6 6 0 0 0-6.94 0L9.43 8A3.86 3.86 0 0 0 10 6a4 4 0 1 0-4 4a3.86 3.86 0 0 0 2-.57l3.09 3.1a6 6 0 0 0 0 6.94L8 22.57A3.86 3.86 0 0 0 6 22a4 4 0 1 0 4 4a3.86 3.86 0 0 0-.57-2l3.1-3.09a6 6 0 0 0 6.94 0l3.1 3.09a3.86 3.86 0 0 0-.57 2a4 4 0 1 0 4-4m0-18a2 2 0 1 1-2 2a2 2 0 0 1 2-2M4 6a2 2 0 1 1 2 2a2 2 0 0 1-2-2m2 22a2 2 0 1 1 2-2a2 2 0 0 1-2 2m10-8a4 4 0 1 1 4-4a4 4 0 0 1-4 4m10 8a2 2 0 1 1 2-2a2 2 0 0 1-2 2"/></g><text x="456" y="178" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Bouw</text><text x="456" y="196" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">leveranciers bouwen de koppelingen</text><path d="M591 174H600" stroke="#DD784B" stroke-width="2"/><path d="M609 174l-10 -5v10z" fill="#DD784B"/><rect x="617" y="118" width="254" height="112" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M627 118H862" stroke="#6B7280" stroke-width="4" stroke-linecap="round"/><g transform="translate(733 136) scale(0.6875)"><path fill="#6B7280" d="M28 2H16a2 2 0 0 0-2 2v10H4a2 2 0 0 0-2 2v14h28V4a2 2 0 0 0-2-2M9 28v-7h4v7Zm19 0H15v-8a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v8H4V16h12V4h12Z"/><path fill="#6B7280" d="M18 8h2v2h-2zm6 0h2v2h-2zm-6 6h2v2h-2zm6 0h2v2h-2zm-6 6h2v2h-2zm6 0h2v2h-2z"/></g><text x="744" y="178" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Implementatie en adoptie</text><text x="744" y="196" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">instellingen nemen in gebruik</text><path d="M880 174H888" stroke="#DD784B" stroke-width="2"/><path d="M898 174l-10 -5v10z" fill="#DD784B"/><rect x="906" y="118" width="254" height="112" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M916 118H1150" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><g transform="translate(1022 136) scale(0.6875)"><path fill="#DD784B" d="M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2m0 26a12 12 0 1 1 12-12a12 12 0 0 1-12 12"/><circle cx="16" cy="23.5" r="1.5" fill="#DD784B"/><path fill="#DD784B" d="M17 8h-1.5a4.49 4.49 0 0 0-4.5 4.5v.5h2v-.5a2.5 2.5 0 0 1 2.5-2.5H17a2.5 2.5 0 0 1 0 5h-2v4.5h2V17a4.5 4.5 0 0 0 0-9"/></g><text x="1033" y="178" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Borging</text><text x="1033" y="196" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">wie neemt het over?</text><rect x="40" y="258" width="548" height="176" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 258H578" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><text x="58" y="286" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#3D68EC" font-weight="600">Wat vastligt</text><circle cx="60" cy="300" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="304" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="304" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">In het derde kwartaal van 2027 zijn de eerste specificaties gereed, zodat</text><text x="76" y="320" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">het technisch specificeren van een OEAPI-profiel kan beginnen</text><circle cx="60" cy="342" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="346" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="346" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">In 2032 houdt Npuls op. De borging moet daarvoor rond zijn</text><rect x="612" y="258" width="548" height="176" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M622 258H1150" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><text x="630" y="286" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#DD784B" font-weight="600">Wat open staat</text><circle cx="632" cy="300" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="632" y="304" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="648" y="304" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Wie de standaard overneemt in een lijnorganisatie</text><text x="648" y="324" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">issue 450 en 451</text><circle cx="632" cy="340" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="632" y="344" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="648" y="344" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Wanneer de overdracht begint, en wat er dan precies overgaat</text><text x="648" y="364" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">zeven onderdelen, van de specificaties tot de gremia</text><circle cx="632" cy="380" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="632" y="384" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="648" y="384" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Hoe het gremium in leven blijft. Bij OKE loopt de continuiteit via de</text><text x="648" y="400" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">deelnemers en niet via een organisatie</text><path d="M40 464H1160" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="489" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280">OKx specificeert nog. Beheer en overdracht liggen ver weg; er is oog op via het borgingstraject van OKE.</text></svg>