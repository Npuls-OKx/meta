<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 892" width="1240" height="892" role="img" aria-label="Hoe ziet onze specificatie eruit?"><rect width="1240" height="892" fill="#ffffff"/><rect x="0.5" y="0.5" width="1239" height="891" rx="12" fill="none" stroke="#E5E7EB"/><text x="40" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#1A1A2E" font-weight="600">Hoe ziet onze specificatie eruit?</text><text x="40" y="90" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6B7280">De vraag waar het werk van OKx op uitkomt, en waarom de vorm nog niet vaststaat</text><rect x="40" y="118" width="568" height="254" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 118H598" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><text x="58" y="146" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#3D68EC" font-weight="600">Conceptuele OKx producten</text><circle cx="60" cy="160" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="164" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="164" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Koppelvlakspecificaties</text><text x="76" y="184" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">Public, release 0.0.1, zonder review</text><circle cx="60" cy="200" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Interactieketens op meerwaarde voor instelling en student</text><text x="76" y="224" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">drie ketens in concept, over fase 1, 2, 3 en 6 van de acht</text><circle cx="60" cy="240" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="244" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="244" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Applicatiediensten als laag eronder</text><text x="76" y="264" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">in review in Public</text><circle cx="60" cy="280" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="284" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="284" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Informatiemodel met begrippenlijst</text><text x="76" y="304" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">80 objecttypen, 226 relaties</text><circle cx="60" cy="320" r="8" fill="#3D68EC" fill-opacity="0.14"/><text x="60" y="324" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3D68EC" font-weight="600" text-anchor="middle">•</text><text x="76" y="324" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">OKx modeldoorloop per processtap</text><text x="76" y="344" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">leerroute 1, de casus stap voor stap door het model</text><rect x="632" y="118" width="568" height="254" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M642 118H1190" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><text x="650" y="146" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#DD784B" font-weight="600">Openstaande vraagstukken</text><circle cx="652" cy="160" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="652" y="164" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="668" y="164" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Wat een instelling moet kunnen per leerroute</text><text x="668" y="184" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">de taal daarvoor is in aanbouw en begint bruikbaar te worden</text><circle cx="652" cy="200" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="652" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="668" y="204" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Welke functionaliteit bij welk applicatiecomponent hoort</text><text x="668" y="224" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">en wat die knip doet met een koppelvlakspecificatie</text><circle cx="652" cy="240" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="652" y="244" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="668" y="244" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">Optionaliteit in een profiel</text><text x="668" y="264" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">hoe een afnemer ziet wat een instelling implementeert</text><circle cx="652" cy="280" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="652" y="284" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="668" y="284" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">De naamgeving van de lagen</text><text x="668" y="304" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">met welke woorden de set wordt opgedeeld</text><circle cx="652" cy="320" r="8" fill="#DD784B" fill-opacity="0.14"/><text x="652" y="324" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600" text-anchor="middle">?</text><text x="668" y="324" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#374151">De vorm van een release</text><text x="668" y="344" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7280" font-style="italic">wat erin zit, en wie hem beoordeelt</text><text x="40" y="413" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1B2A6B" font-weight="600">De taal opbouwen</text><rect x="40" y="426" width="205" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 426H235" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><g transform="translate(131 444) scale(0.6875)"><path fill="#00AF81" d="M30 30h-2v-5a5.006 5.006 0 0 0-5-5v-2a7.01 7.01 0 0 1 7 7Zm-8 0h-2v-5a5.006 5.006 0 0 0-5-5H9a5.006 5.006 0 0 0-5 5v5H2v-5a7.01 7.01 0 0 1 7-7h6a7.01 7.01 0 0 1 7 7ZM20 2v2a5 5 0 0 1 0 10v2a7 7 0 0 0 0-14m-8 2a5 5 0 1 1-5 5a5 5 0 0 1 5-5m0-2a7 7 0 1 0 7 7a7 7 0 0 0-7-7"/></g><text x="142" y="486" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Persona</text><text x="142" y="504" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">wie is de lerende</text><path d="M253 474H262" stroke="#DD784B" stroke-width="2"/><path d="M271 474l-10 -5v10z" fill="#DD784B"/><rect x="279" y="426" width="205" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M289 426H474" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><g transform="translate(370 444) scale(0.6875)"><path fill="#00AF81" d="M13 13h6v2h-6z"/><path fill="#00AF81" d="m25.44 8l-1.27-4.55A2.01 2.01 0 0 0 22.246 2H9.754a2.01 2.01 0 0 0-1.923 1.45L6.531 8H4v2h2v7a2.003 2.003 0 0 0 2 2v3h2v-3h12v3h2v-3a2.003 2.003 0 0 0 2-2v-7h2V8ZM9.755 4h12.492l1.428 5H8.326ZM24 13h-2v2h2v2H8v-2h2v-2H8v-2h16ZM2 16h2v14H2zm26 0h2v14h-2z"/><path fill="#00AF81" d="M15 21h2v3h-2zm0 5h2v4h-2z"/></g><text x="381" y="486" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Leerroutedocument</text><text x="381" y="504" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">wat de instelling doet per fase</text><path d="M492 474H501" stroke="#DD784B" stroke-width="2"/><path d="M510 474l-10 -5v10z" fill="#DD784B"/><rect x="518" y="426" width="205" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M528 426H712" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><g transform="translate(609 444) scale(0.6875)"><path fill="#00AF81" d="M27 22.14V17a2 2 0 0 0-2-2h-8V9.86a4 4 0 1 0-2 0V15H7a2 2 0 0 0-2 2v5.14a4 4 0 1 0 2 0V17h18v5.14a4 4 0 1 0 2 0M8 26a2 2 0 1 1-2-2a2 2 0 0 1 2 2m6-20a2 2 0 1 1 2 2a2 2 0 0 1-2-2m12 22a2 2 0 1 1 2-2a2 2 0 0 1-2 2"/></g><text x="620" y="486" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Modeldoorloop</text><text x="620" y="504" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">welke objecten bewegen per stap</text><path d="M730 474H739" stroke="#DD784B" stroke-width="2"/><path d="M748 474l-10 -5v10z" fill="#DD784B"/><rect x="756" y="426" width="205" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M766 426H951" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><g transform="translate(848 444) scale(0.6875)"><path fill="#DD784B" d="m29 27.586l-7.552-7.552a11.018 11.018 0 1 0-1.414 1.414L27.586 29ZM4 13a9 9 0 1 1 9 9a9.01 9.01 0 0 1-9-9"/></g><text x="859" y="486" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Ontbrekende begrippen</text><text x="859" y="504" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">wat de reis blootlegt</text><path d="M969 474H978" stroke="#DD784B" stroke-width="2"/><path d="M987 474l-10 -5v10z" fill="#DD784B"/><rect x="995" y="426" width="205" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M1005 426H1190" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(1087 444) scale(0.6875)"><path fill="#3D68EC" d="M29 24.184V7.816A3 3 0 0 0 31 5c0-1.654-1.346-3-3-3s-3 1.346-3 3c0 .392.08.763.217 1.106L16 14.171L6.783 6.106A3 3 0 0 0 7 5c0-1.654-1.346-3-3-3S1 3.346 1 5c0 1.302.838 2.401 2 2.815v16.37A2.995 2.995 0 0 0 1 27c0 1.654 1.346 3 3 3s3-1.346 3-3a2.97 2.97 0 0 0-.595-1.775l5.333-4.668l2.365 4.138A2.98 2.98 0 0 0 13 27c0 1.654 1.346 3 3 3s3-1.346 3-3c0-.931-.435-1.754-1.103-2.305l2.365-4.138l5.333 4.667A2.97 2.97 0 0 0 25 27c0 1.654 1.346 3 3 3s3-1.346 3-3a3 3 0 0 0-2-2.816M28 4a1.001 1.001 0 0 1 0 2a1 1 0 0 1 0-2m-3.822 5.673l-4.44 7.77l-2.22-1.943zM14.482 15.5l-2.22 1.942l-4.44-7.77zM4 4a1.001 1.001 0 0 1 0 2a1 1 0 0 1 0-2m0 24a1.001 1.001 0 0 1 0-2a1.001 1.001 0 0 1 0 2m1-4.204V8.766l5.726 10.02zM16 28a1.001 1.001 0 0 1 0-2a1.001 1.001 0 0 1 0 2m0-4.015l-2.726-4.771L16 16.829l2.726 2.385zm11-15.22v15.031l-5.726-5.01zM28 28a1.001 1.001 0 0 1 0-2a1.001 1.001 0 0 1 0 2"/></g><text x="1098" y="486" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Informatiemodel</text><text x="1098" y="504" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">aangevuld, en de taal groeit</text><path d="M1098 522V538q0 10 -10 10H630q-10 0 -10 -10V531" fill="none" stroke="#6B7280" stroke-width="2"/><path d="M620 523l-5 10h10z" fill="#6B7280"/><text x="859" y="566" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">het aangevulde model gaat opnieuw door de casus</text><text x="40" y="607" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1B2A6B" font-weight="600">Van taal naar specificatie</text><rect x="40" y="620" width="264" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 620H294" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(161 638) scale(0.6875)"><path fill="#3D68EC" d="M27 22.14V17a2 2 0 0 0-2-2h-8V9.86a4 4 0 1 0-2 0V15H7a2 2 0 0 0-2 2v5.14a4 4 0 1 0 2 0V17h18v5.14a4 4 0 1 0 2 0M8 26a2 2 0 1 1-2-2a2 2 0 0 1 2 2m6-20a2 2 0 1 1 2 2a2 2 0 0 1-2-2m12 22a2 2 0 1 1 2-2a2 2 0 0 1-2 2"/></g><text x="172" y="680" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Modeldoorloop</text><text x="172" y="698" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">de casus in het model, per stap</text><path d="M312 668H322" stroke="#DD784B" stroke-width="2"/><path d="M330 668l-10 -5v10z" fill="#DD784B"/><rect x="338" y="620" width="264" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M348 620H593" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(460 638) scale(0.6875)"><path fill="#3D68EC" d="M26 6a3.996 3.996 0 0 0-3.858 3H17.93A7.996 7.996 0 1 0 9 17.93v4.212a4 4 0 1 0 2 0v-4.211a7.95 7.95 0 0 0 3.898-1.62l3.669 3.67A3.95 3.95 0 0 0 18 22a4 4 0 1 0 4-4a3.95 3.95 0 0 0-2.019.567l-3.67-3.67A7.95 7.95 0 0 0 17.932 11h4.211A3.993 3.993 0 1 0 26 6M12 26a2 2 0 1 1-2-2a2 2 0 0 1 2 2m-2-10a6 6 0 1 1 6-6a6.007 6.007 0 0 1-6 6m14 6a2 2 0 1 1-2-2a2 2 0 0 1 2 2m2-10a2 2 0 1 1 2-2a2 2 0 0 1-2 2"/></g><text x="471" y="680" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Interacties en waardeketens</text><text x="471" y="698" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">welke interacties samen waarde opleveren</text><text x="471" y="711" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">voor instelling en student</text><path d="M611 668H620" stroke="#DD784B" stroke-width="2"/><path d="M629 668l-10 -5v10z" fill="#DD784B"/><rect x="637" y="620" width="264" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M647 620H892" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(758 638) scale(0.6875)"><path fill="#3D68EC" d="m25.7 9.3l-7-7c-.2-.2-.4-.3-.7-.3H8c-1.1 0-2 .9-2 2v24c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-.3-.1-.5-.3-.7M18 4.4l5.6 5.6H18zM24 28H8V4h8v6c0 1.1.9 2 2 2h6z"/><path fill="#3D68EC" d="M10 22h12v2H10zm0-6h12v2H10z"/></g><text x="769" y="680" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">Interactieketenspecificatie</text><text x="769" y="698" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">de keten beschreven, van waarde naar</text><text x="769" y="711" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">koppeling</text><path d="M910 668H918" stroke="#DD784B" stroke-width="2"/><path d="M928 668l-10 -5v10z" fill="#DD784B"/><rect x="936" y="620" width="264" height="96" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M946 620H1190" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><g transform="translate(1057 638) scale(0.6875)"><path fill="#00AF81" d="M26 22a3.86 3.86 0 0 0-2 .57l-3.09-3.1a6 6 0 0 0 0-6.94L24 9.43a3.86 3.86 0 0 0 2 .57a4 4 0 1 0-4-4a3.86 3.86 0 0 0 .57 2l-3.1 3.09a6 6 0 0 0-6.94 0L9.43 8A3.86 3.86 0 0 0 10 6a4 4 0 1 0-4 4a3.86 3.86 0 0 0 2-.57l3.09 3.1a6 6 0 0 0 0 6.94L8 22.57A3.86 3.86 0 0 0 6 22a4 4 0 1 0 4 4a3.86 3.86 0 0 0-.57-2l3.1-3.09a6 6 0 0 0 6.94 0l3.1 3.09a3.86 3.86 0 0 0-.57 2a4 4 0 1 0 4-4m0-18a2 2 0 1 1-2 2a2 2 0 0 1 2-2M4 6a2 2 0 1 1 2 2a2 2 0 0 1-2-2m2 22a2 2 0 1 1 2-2a2 2 0 0 1-2 2m10-8a4 4 0 1 1 4-4a4 4 0 0 1-4 4m10 8a2 2 0 1 1 2-2a2 2 0 0 1-2 2"/></g><text x="1068" y="680" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A1A2E" font-weight="600" text-anchor="middle">OKx-profiel</text><text x="1068" y="698" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">gegevensuitwisseling, in OEAPI waar het kan</text><text x="40" y="755" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">De reis stap voor stap doorlopen legt bloot welke begrippen ontbreken. Zo kwam de nominale leerroute boven water. Dat is geen illustratie achteraf maar de manier waarop de</text><text x="40" y="774" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">taal wordt opgebouwd, en die taal draagt daarna de keten en het profiel.</text><path d="M40 812H1200" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="837" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280">Status: wat er ligt is concept en voorstel, en verre van implementatiewaardig. Status 7 is leeg en release 0.0.1 kreeg geen review. Het vastzetten van de vorm wacht op een</text><text x="40" y="855" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280">scherper beeld van wat een instelling moet kunnen.</text></svg>