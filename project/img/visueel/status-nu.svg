ight="20" rx="10" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><text x="770" y="340" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#1A1A2E">7 applicatiecomponenten</text><rect x="918" y="326" width="134" height="20" rx="10" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><text x="928" y="340" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#1A1A2E">3 interactiepatronen</text><rect x="1058" y="326" width="134" height="20" rx="10" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><text x="1068" y="340" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#1A1A2E">24 datamodelschema's</text><rect x="462" y="352" width="203" height="20" rx="10" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><text x="472" y="366" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#1A1A2E">Herziening naar interactieketens</text><rect x="248" y="246" width="972" height="54" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M258 246H1210" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><circle cx="274" cy="273" r="13" fill="#3D68EC"/><text x="274" y="278" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">5</text><text x="298" y="270" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#1A1A2E" font-weight="600">Besloten in OKx</text><rect x="488" y="262" width="209" height="20" rx="10" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><text x="498" y="276" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#1A1A2E">13 principes en de uitgangspunten</text><rect x="703" y="262" width="266" height="20" rx="10" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><text x="713" y="276" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#1A1A2E">De grens bij de les: OKx legt die niet vast</text><rect x="274" y="182" width="946" height="54" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M284 182H1210" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><circle cx="300" cy="209" r="13" fill="#00AF81"/><text x="300" y="214" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">6</text><text x="324" y="206" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#1A1A2E" font-weight="600">Gereleased</text><rect x="514" y="198" width="266" height="20" rx="10" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><text x="524" y="212" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#1A1A2E">Koppelvlakspecificatie 0.0.1, augustus 2026</text><rect x="1125" y="198" width="81" height="22" rx="11" fill="#F4D9DC" stroke="#F4D9DC" stroke-width="1.5"/><text x="1134" y="213" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600">geen review</text><rect x="300" y="118" width="920" height="54" rx="10" fill="#F7F8FB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M310 118H1210" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/><circle cx="326" cy="145" r="13" fill="#6B7280"/><text x="326" y="150" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">7</text><text x="350" y="142" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#6B7280" font-weight="600">Bekrachtigd</text><rect x="1165" y="134" width="41" height="22" rx="11" fill="#F4D9DC" stroke="#F4D9DC" stroke-width="1.5"/><text x="1174" y="149" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DD784B" font-weight="600">leeg</text><path d="M70 310q-10 0 -10 10V632q0 10 10 10" fill="none" stroke="#DD784B" stroke-width="3"/><path d="M60 322l8 -5v10z" fill="#DD784B"/><path d="M60 476l8 -5v10z" fill="#DD784B"/><path d="M60 630l8 -5v10z" fill="#DD784B"/><text x="52" y="476" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#DD784B" font-weight="600" text-anchor="middle" transform="rotate(-90 52 476)">hier beweegt het werk, heen en weer</text><path d="M274 209H122q-10 0 -10 10V595q0 10 10 10H133" fill="none" stroke="#6B7280" stroke-width="2"/><path d="M142 605l-10 -5v10z" fill="#6B7280"/><text x="99" y="407" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280" font-weight="600" text-anchor="middle" transform="rotate(-90 99 407)">de vraag kwam terug</text><text x="40" y="681" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">De koers was: zo snel mogelijk naar het eindproduct, de specificaties. Augustus 2026 leverde release 0.0.1 op. Instellingen en leveranciers hebben die niet beoordeeld, en zij</text><text x="40" y="700" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">is uit gebruik. Elke volgende poging om te specificeren eindigde bij dezelfde vraag, gesteld door instellingen, door leveranciers en door het team zelf: wat maken we</text><text x="40" y="719" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">eigenlijk, en wat moet een instelling kunnen. Specificeren begint bij dat antwoord, dus beweegt het werk sindsdien tussen status 1 en 4.</text><path d="M40 757H1220" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="782" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280">Stand uit Npuls-OKx/meta en Npuls-OKx/Public. Een product schuift zodra zijn eigen Status-regel schuift; de ladder zelf staat in Status van een product.</text></svg>