<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 784" width="1240" height="784" role="img" aria-label="Systemen in een school wisselen de hele dag gegevens uit"><rect width="1240" height="784" fill="#ffffff"/><rect x="0.5" y="0.5" width="1239" height="783" rx="12" fill="none" stroke="#E5E7EB"/><text x="40" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#1A1A2E" font-weight="600">Systemen in een school wisselen de hele dag gegevens uit</text><text x="40" y="90" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6B7280">OKx legt vast hoe dat gaat, zodat elke school en elke leverancier dezelfde afspraak gebruikt</text><rect x="40" y="118" width="568" height="330" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 118H598" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><text x="58" y="146" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#DD784B" font-weight="600">Vandaag richt elke school het zelf in</text><text x="58" y="165" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">zes systemen die elkaar rechtstreeks kennen, dat zijn vijftien koppelingen</text><path d="M324 214L506 264" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M324 214L506 364" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M324 214L324 414" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M324 214L142 364" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M324 214L142 264" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M506 264L506 364" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M506 264L324 414" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M506 264L142 364" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M506 264L142 264" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M506 364L324 414" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M506 364L142 364" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M506 364L142 264" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M324 414L142 364" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M324 414L142 264" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><path d="M142 364L142 264" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.75"/><circle cx="324" cy="214" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(314 204) scale(0.6250)"><path fill="#1A1A2E" d="M26 2H8a2 2 0 0 0-2 2v4H4v2h2v5H4v2h2v5H4v2h2v4a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2m0 26H8v-4h2v-2H8v-5h2v-2H8v-5h2V8H8V4h18Z"/><path fill="#1A1A2E" d="M14 8h8v2h-8zm0 7h8v2h-8zm0 7h8v2h-8z"/></g><text x="324" y="250" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Onderwijscatalogus</text><circle cx="506" cy="264" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(496 254) scale(0.6250)"><path fill="#1A1A2E" d="M26 4h-4V2h-2v2h-8V2h-2v2H6c-1.1 0-2 .9-2 2v20c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2m0 22H6V12h20zm0-16H6V6h4v2h2V6h8v2h2V6h4z"/></g><text x="506" y="300" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Planning en rooster</text><circle cx="506" cy="364" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(496 354) scale(0.6250)"><path fill="#1A1A2E" d="M24 3H8a2 2 0 0 0-2 2v22a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m0 2v6H8V5ZM8 19v-6h16v6Zm0 8v-6h16v6Z"/><circle cx="11" cy="8" r="1" fill="#1A1A2E"/><circle cx="11" cy="16" r="1" fill="#1A1A2E"/><circle cx="11" cy="24" r="1" fill="#1A1A2E"/></g><text x="506" y="400" font-family