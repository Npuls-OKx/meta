I, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Studentinformatie</text><circle cx="916" cy="428" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(906 418) scale(0.6250)"><path fill="#1A1A2E" d="M26 30h-2v-3a5.006 5.006 0 0 0-5-5h-6a5.006 5.006 0 0 0-5 5v3H6v-3a7.01 7.01 0 0 1 7-7h6a7.01 7.01 0 0 1 7 7ZM5 6a1 1 0 0 0-1 1v9h2V7a1 1 0 0 0-1-1"/><path fill="#1A1A2E" d="M4 2v2h5v7a7 7 0 0 0 14 0V4h5V2Zm7 2h10v3H11Zm5 12a5 5 0 0 1-5-5V9h10v2a5 5 0 0 1-5 5"/></g><text x="916" y="464" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Leeromgeving</text><circle cx="734" cy="375" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(724 365) scale(0.6250)"><path fill="#1A1A2E" d="M30 30h-2v-5a5.006 5.006 0 0 0-5-5v-2a7.01 7.01 0 0 1 7 7Zm-8 0h-2v-5a5.006 5.006 0 0 0-5-5H9a5.006 5.006 0 0 0-5 5v5H2v-5a7.01 7.01 0 0 1 7-7h6a7.01 7.01 0 0 1 7 7ZM20 2v2a5 5 0 0 1 0 10v2a7 7 0 0 0 0-14m-8 2a5 5 0 1 1-5 5a5 5 0 0 1 5-5m0-2a7 7 0 1 0 7 7a7 7 0 0 0-7-7"/></g><text x="734" y="411" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Keuzesysteem</text><circle cx="734" cy="268" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(724 258) scale(0.6250)"><path fill="#1A1A2E" d="m24 17l1.912 3.703l4.088.594L27 24l.771 4L24 25.75L20.229 28L21 24l-3-2.703l4.2-.594zM6 16h6v2H6zm0-4h10v2H6zm0-4h10v2H6z"/><path fill="#1A1A2E" d="M16 26H4V6h24v10h2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h12Z"/></g><text x="734" y="304" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Toetsen en examineren</text><text x="40" y="503" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1B2A6B" font-weight="600">Waar dat vandaag pijn doet</text><rect x="40" y="516" width="376" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 516H406" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><g transform="translate(56 534) scale(0.6875)"><path fill="#DD784B" d="M28 26h-3v-2h3V8h-3V6h3a2 2 0 0 1 2 2v16a2.003 2.003 0 0 1-2 2"/><circle cx="23" cy="16" r="2" fill="#DD784B"/><circle cx="16" cy="16" r="2" fill="#DD784B"/><circle cx="9" cy="16" r="2" fill="#DD784B"/><path fill="#DD784B" d="M7 26H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3v2H4v16h3Z"/></g><text x="56" y="576" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Binnen een team</text><text x="56" y="602" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">dezelfde gegevens krijgen een eigen naam en vorm, dus wat</text><text x="56" y="615" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">het ene systeem levert leest het volgende anders</text><rect x="432" y="516" width="376" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M442 516H798" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><g transform="translate(448 534) scale(0.6875)"><path fill="#DD784B" d="M28 2H16a2 2 0 0 0-2 2v10H4a2 2 0 0 0-2 2v14h28V4a2 2 0 0 0-2-2M9 28v-7h4v7Zm19 0H15v-8a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v8H4V16h12V4h12Z"/><path fill="#DD784B" d="M18 8h2v2h-2zm6 0h2v2h-2zm-6 6h2v2h-2zm6 0h2v2h-2zm-6 6h2v2h-2zm6 0h2v2h-2z"/></g><text x="448" y="576" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Tussen teams in een school</text><text x="448" y="602" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">elk team richt het onderwijs anders in, dus een koppeling</text><text x="448" y="615" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">die bij het ene team past, past bij het andere niet</text><rect x="824" y="516" width="376" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M834 516H1190" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><g transform="translate(840 534) scale(0.6875)"><path fill="#DD784B" d="M8 9a4 4 0 1 1 4-4a4 4 0 0 1-4 4m0-6a2 2 0 1 0 2 2a2 2 0 0 0-2-2m16 6a4 4 0 1 1 4-4a4 4 0 0 1-4 4m0-6a2 2 0 1 0 2 2a2 2 0 0 0-2-2m2 27h-4a2 2 0 0 1-2-2v-7h2v7h4v-9h2v-6a1 1 0 0 0-1-1h-6.42L16 20l-4.58-8H5a1 1 0 0 0-1 1v6h2v9h4v-7h2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1-2-2v-6a3 3 0 0 1 3-3h7.58L16 16l3.42-6H27a3 3 0 0 1 3 3v6a2 2 0 0 1-2 2v7a2 2 0 0 1-2 2"/></g><text x="840" y="576" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Bij een leverancier</text><text x="840" y="602" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">hetzelfde product vraagt per school een eigen koppeling, om</text><text x="840" y="615" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">samen te werken met de systemen van die klant</text><text x="40" y="681" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1B2A6B" font-weight="600">Wat een gedeeld profiel oplevert</text><rect x="40" y="694" width="376" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 694H406" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(56 712) scale(0.6875)"><path fill="#3D68EC" d="M26 2H8a2 2 0 0 0-2 2v4H4v2h2v5H4v2h2v5H4v2h2v4a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2m0 26H8v-4h2v-2H8v-5h2v-2H8v-5h2V8H8V4h18Z"/><path fill="#3D68EC" d="M14 8h8v2h-8zm0 7h8v2h-8zm0 7h8v2h-8z"/></g><text x="56" y="754" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Overzichtelijk onderwijsaanbod</text><text x="56" y="780" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">een student ziet wat er te kiezen valt, en de school weet</text><text x="56" y="793" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">wat zij aanbiedt</text><rect x="432" y="694" width="376" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M442 694H798" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(448 712) scale(0.6875)"><path fill="#3D68EC" d="M26 4h-4V2h-2v2h-8V2h-2v2H6c-1.1 0-2 .9-2 2v20c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2m0 22H6V12h20zm0-16H6V6h4v2h2V6h8v2h2V6h4z"/></g><text x="448" y="754" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Haalbare onderwijslogistiek</text><text x="448" y="780" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">plannen en roosteren steunt op gegevens die kloppen, in</text><text x="448" y="793" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">plaats van op overtypen</text><rect x="824" y="694" width="376" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M834 694H1190" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><g transform="translate(840 712) scale(0.6875)"><path fill="#00AF81" d="M8 9a4 4 0 1 1 4-4a4 4 0 0 1-4 4m0-6a2 2 0 1 0 2 2a2 2 0 0 0-2-2m16 6a4 4 0 1 1 4-4a4 4 0 0 1-4 4m0-6a2 2 0 1 0 2 2a2 2 0 0 0-2-2m2 27h-4a2 2 0 0 1-2-2v-7h2v7h4v-9h2v-6a1 1 0 0 0-1-1h-6.42L16 20l-4.58-8H5a1 1 0 0 0-1 1v6h2v9h4v-7h2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1-2-2v-6a3 3 0 0 1 3-3h7.58L16 16l3.42-6H27a3 3 0 0 1 3 3v6a2 2 0 0 1-2 2v7a2 2 0 0 1-2 2"/></g><text x="840" y="754" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Betaalbaar voor de sector</text><text x="840" y="780" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">een leverancier bouwt de koppeling een keer, en elke school</text><text x="840" y="793" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">gebruikt hem</text><text x="40" y="857" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">OKx bouwt geen centrale voorziening waar het verkeer doorheen gaat. De systemen van een school blijven rechtstreeks met elkaar uitwisselen; wat OKx beschrijft en eenduidig</text><text x="40" y="876" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">vastlegt is hoe die uitwisseling eruitziet, als profiel over de koppelvlakken van die systemen heen.</text><path d="M40 914H1200" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="939" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280">De afspraken zijn in concept. Welk landschap OKx beschrijft staat in de hoofdplaat informatiestromen hieronder.</text><text x="1200" y="939" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280" text-anchor="end">v0.2.0</text></svg>