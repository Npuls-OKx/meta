e(0.6250)"><path fill="#1A1A2E" d="m24 17l1.912 3.703l4.088.594L27 24l.771 4L24 25.75L20.229 28L21 24l-3-2.703l4.2-.594zM6 16h6v2H6zm0-4h10v2H6zm0-4h10v2H6z"/><path fill="#1A1A2E" d="M16 26H4V6h24v10h2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h12Z"/></g><text x="142" y="304" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Toetsen en examineren</text><rect x="632" y="118" width="568" height="344" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M642 118H1190" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><text x="650" y="146" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#00AF81" font-weight="600">Met het OKx-profiel</text><text x="650" y="165" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">dezelfde zes systemen, dezelfde lijnen, op elke lijn dezelfde afspraak</text><path d="M916 214L1098 268" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M916 214L1098 374" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M916 214L916 428" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M916 214L734 375" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M916 214L734 268" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M1098 268L1098 374" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M1098 268L916 428" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M1098 268L734 375" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M1098 268L734 268" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M1098 374L916 428" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M1098 374L734 375" stroke="#00AF81" stroke-width="1.2" stroke-opacity="0.75"/><path d="M1098 374L734 268" stroke="#00AF81" stroke-width="1.2" stroke-opa