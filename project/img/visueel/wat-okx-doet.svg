<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 976" width="1240" height="976" role="img" aria-label="Systemen in een school wisselen de hele dag gegevens uit"><rect width="1240" height="976" fill="#ffffff"/><rect x="0.5" y="0.5" width="1239" height="975" rx="12" fill="none" stroke="#E5E7EB"/><text x="40" y="66" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#1A1A2E" font-weight="600">Systemen in een school wisselen de hele dag gegevens uit</text><text x="40" y="90" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6B7280">Elke school beschrijft die gegevens op een eigen manier, en binnen een school verschilt het per team. OKx legt vast hoe die uitwisseling gaat.</text><rect x="40" y="118" width="568" height="344" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 118H598" stroke="#DD784B" stroke-width="4" stroke-linecap="round"/><text x="58" y="146" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#DD784B" font-weight="600">Vandaag</text><text x="58" y="165" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">per school en per team verschillend: elke koppeling draagt een eigen afspraak</text><path d="M324 214L506 268" stroke="#DD784B" stroke-width="1.0" stroke-opacity="0.75"/><path d="M324 214L506 374" stroke="#DD784B" stroke-width="2.2" stroke-opacity="0.75" stroke-dasharray="5 4"/><path d="M324 214L324 428" stroke="#DD784B" stroke-width="1.4" stroke-opacity="0.75" stroke-dasharray="2 3"/><path d="M324 214L142 375" stroke="#DD784B" stroke-width="2.8" stroke-opacity="0.75" stroke-dasharray="8 3"/><path d="M324 214L142 268" stroke="#DD784B" stroke-width="1.2" stroke-opacity="0.75" stroke-dasharray="1 4"/><path d="M506 268L506 374" stroke="#DD784B" stroke-width="1.8" stroke-opacity="0.75" stroke-dasharray="6 2 2 2"/><path d="M506 268L324 428" stroke="#DD784B" stroke-width="1.0" stro