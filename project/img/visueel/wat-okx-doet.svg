ke-width="4" stroke-linecap="round"/><text x="650" y="146" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#00AF81" font-weight="600">Met een koppelvlakstandaard</text><text x="650" y="165" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">dezelfde zes systemen, en een afspraak die overal hetzelfde is</text><path d="M916 314L916 214" stroke="#00AF81" stroke-width="2"/><path d="M916 314L1098 264" stroke="#00AF81" stroke-width="2"/><path d="M916 314L1098 364" stroke="#00AF81" stroke-width="2"/><path d="M916 314L916 414" stroke="#00AF81" stroke-width="2"/><path d="M916 314L734 364" stroke="#00AF81" stroke-width="2"/><path d="M916 314L734 264" stroke="#00AF81" stroke-width="2"/><rect x="846" y="296" width="140" height="36" rx="18" fill="#00AF81" stroke="#00AF81" stroke-width="1.5"/><g transform="translate(859 305) scale(0.5625)"><path fill="#ffffff" d="M30 30h-8v-8h8Zm-6-2h4v-4h-4Zm-4-1H8a6 6 0 0 1 0-12h2v2H8a4 4 0 0 0 0 8h12Z"/><path fill="#ffffff" d="M20 20h-8v-8h8Zm-6-2h4v-4h-4Z"/><path fill="#ffffff" d="M24 17h-2v-2h2a4 4 0 0 0 0-8H12V5h12a6 6 0 0 1 0 12m-14-7H2V2h8ZM4 8h4V4H4Z"/></g><text x="883" y="319" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="600">OKx-koppelvlak</text><circle cx="916" cy="214" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(906 204) scale(0.6250)"><path fill="#1A1A2E" d="M26 2H8a2 2 0 0 0-2 2v4H4v2h2v5H4v2h2v5H4v2h2v4a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2m0 26H8v-4h2v-2H8v-5h2v-2H8v-5h2V8H8V4h18Z"/><path fill="#1A1A2E" d="M14 8h8v2h-8zm0 7h8v2h-8zm0 7h8v2h-8z"/></g><text x="916" y="250" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Onderwijscatalogus</text><circle cx="1098" cy="264" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(1088 254) scale(0.6250)"><path fill="#1A1A2E" d="M26 4h-4V2h-2v2h-8V2h-2v2H6c-1.1 0-2 .9-2 2v20c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2m0 22H6V12h20zm0-16H6V6h4v2h2V6h8v2h2V6h4z"/></g><text x="1098" y="300" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Planning en rooster</text><circle cx="1098" cy="364" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(1088 354) scale(0.6250)"><path fill="#1A1A2E" d="M24 3H8a2 2 0 0 0-2 2v22a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m0 2v6H8V5ZM8 19v-6h16v6Zm0 8v-6h16v6Z"/><circle cx="11" cy="8" r="1" fill="#1A1A2E"/><circle cx="11" cy="16" r="1" fill="#1A1A2E"/><circle cx="11" cy="24" r="1" fill="#1A1A2E"/></g><text x="1098" y="400" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Studentinformatie</text><circle cx="916" cy="414" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(906 404) scale(0.6250)"><path fill="#1A1A2E" d="M26 30h-2v-3a5.006 5.006 0 0 0-5-5h-6a5.006 5.006 0 0 0-5 5v3H6v-3a7.01 7.01 0 0 1 7-7h6a7.01 7.01 0 0 1 7 7ZM5 6a1 1 0 0 0-1 1v9h2V7a1 1 0 0 0-1-1"/><path fill="#1A1A2E" d="M4 2v2h5v7a7 7 0 0 0 14 0V4h5V2Zm7 2h10v3H11Zm5 12a5 5 0 0 1-5-5V9h10v2a5 5 0 0 1-5 5"/></g><text x="916" y="450" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Leeromgeving</text><circle cx="734" cy="364" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(724 354) scale(0.6250)"><path fill="#1A1A2E" d="M30 30h-2v-5a5.006 5.006 0 0 0-5-5v-2a7.01 7.01 0 0 1 7 7Zm-8 0h-2v-5a5.006 5.006 0 0 0-5-5H9a5.006 5.006 0 0 0-5 5v5H2v-5a7.01 7.01 0 0 1 7-7h6a7.01 7.01 0 0 1 7 7ZM20 2v2a5 5 0 0 1 0 10v2a7 7 0 0 0 0-14m-8 2a5 5 0 1 1-5 5a5 5 0 0 1 5-5m0-2a7 7 0 1 0 7 7a7 7 0 0 0-7-7"/></g><text x="734" y="400" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Keuzesysteem</text><circle cx="734" cy="264" r="21" fill="#F7F8FB" stroke="#E5E7EB" stroke-width="1.5"/><g transform="translate(724 254) scale(0.6250)"><path fill="#1A1A2E" d="m24 17l1.912 3.703l4.088.594L27 24l.771 4L24 25.75L20.229 28L21 24l-3-2.703l4.2-.594zM6 16h6v2H6zm0-4h10v2H6zm0-4h10v2H6z"/><path fill="#1A1A2E" d="M16 26H4V6h24v10h2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h12Z"/></g><text x="734" y="300" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Toetsen en examineren</text><text x="40" y="489" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1B2A6B" font-weight="600">Wat dat oplevert</text><rect x="40" y="502" width="376" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M50 502H406" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(56 520) scale(0.6875)"><path fill="#3D68EC" d="M26 2H8a2 2 0 0 0-2 2v4H4v2h2v5H4v2h2v5H4v2h2v4a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2m0 26H8v-4h2v-2H8v-5h2v-2H8v-5h2V8H8V4h18Z"/><path fill="#3D68EC" d="M14 8h8v2h-8zm0 7h8v2h-8zm0 7h8v2h-8z"/></g><text x="56" y="562" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Overzichtelijk onderwijsaanbod</text><text x="56" y="588" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">een student ziet wat er te kiezen valt, en de school weet</text><text x="56" y="601" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">wat zij aanbiedt</text><rect x="432" y="502" width="376" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M442 502H798" stroke="#3D68EC" stroke-width="4" stroke-linecap="round"/><g transform="translate(448 520) scale(0.6875)"><path fill="#3D68EC" d="M26 4h-4V2h-2v2h-8V2h-2v2H6c-1.1 0-2 .9-2 2v20c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2m0 22H6V12h20zm0-16H6V6h4v2h2V6h8v2h2V6h4z"/></g><text x="448" y="562" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Haalbare onderwijslogistiek</text><text x="448" y="588" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">plannen en roosteren steunt op gegevens die kloppen, in</text><text x="448" y="601" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">plaats van op overtypen</text><rect x="824" y="502" width="376" height="124" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/><path d="M834 502H1190" stroke="#00AF81" stroke-width="4" stroke-linecap="round"/><g transform="translate(840 520) scale(0.6875)"><path fill="#00AF81" d="M8 9a4 4 0 1 1 4-4a4 4 0 0 1-4 4m0-6a2 2 0 1 0 2 2a2 2 0 0 0-2-2m16 6a4 4 0 1 1 4-4a4 4 0 0 1-4 4m0-6a2 2 0 1 0 2 2a2 2 0 0 0-2-2m2 27h-4a2 2 0 0 1-2-2v-7h2v7h4v-9h2v-6a1 1 0 0 0-1-1h-6.42L16 20l-4.58-8H5a1 1 0 0 0-1 1v6h2v9h4v-7h2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1-2-2v-6a3 3 0 0 1 3-3h7.58L16 16l3.42-6H27a3 3 0 0 1 3 3v6a2 2 0 0 1-2 2v7a2 2 0 0 1-2 2"/></g><text x="840" y="562" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1A1A2E" font-weight="600">Betaalbaar voor de sector</text><text x="840" y="588" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">een leverancier bouwt de koppeling een keer, en elke school</text><text x="840" y="601" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7280">gebruikt hem</text><text x="40" y="665" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">Elke school doet dit nu op haar eigen manier, en binnen een school verschilt het vaak per team. Een leverancier bouwt daardoor voor elke klant opnieuw. OKx legt de</text><text x="40" y="684" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#374151">afspraken vast waarmee dat verkeer overal hetzelfde loopt.</text><path d="M40 722H1200" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="747" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280">De afspraken zijn in concept. Wat er ligt en wat nog open staat, staat in de plaat hieronder.</text><text x="1200" y="747" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#6B7280" text-anchor="end">v0.1.0</text></svg>