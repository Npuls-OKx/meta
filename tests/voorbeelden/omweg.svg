<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 793 591" width="793" height="591"><rect x="0.5" y="0.5" width="792" height="590" rx="10" fill="#ffffff" stroke="#d8ddda"/><text x="12" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="start">C-04 - Het hbo-kader in de woorden van de sector</text><rect x="12" y="40" width="208" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(198,45)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="5" width="10" height="6" rx="3"/><ellipse cx="12" cy="8" rx="2" ry="3"/></g><text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">rol</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">onderwijsontwerper</text><rect x="230" y="40" width="467" height="48" rx="8" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(675,45)" fill="none" stroke="#444" stroke-width="1.3"><path d="M2 5h8V2l5 6-5 6v-3H2z"/></g><text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">processtap</text><text x="240" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Kwalificatiekader vertalen naar leeruitkomsten</text><path d="M64 88 V108" stroke="#a8a85a" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M59 102 l5 6 5 -6" fill="none" stroke="#a8a85a" stroke-width="1.5"/><rect x="40" y="112" width="439" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(457,117)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Werkveld</text><text x="50" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">beroepen en functies van de hbo-bachelor TN</text><rect x="40" y="188" width="393" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(411,193)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Landelijk opleidingsprofiel</text><text x="50" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">TN 2016: kwalificaties voor de ervaren</text><text x="50" y="242" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">beroepsbeoefenaar</text><rect x="40" y="282" width="282" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(300,287)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Competentie</text><text x="50" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Experimenteren, niveau III</text><rect x="40" y="358" width="402" height="48" rx="0" fill="#ffffb5" stroke="#a8a85a" stroke-dasharray="5 3"/><g transform="translate(420,363)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Opleidingsprofiel van de opleiding</text><text x="50" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">kwalificaties voor de pas afgestudeerde</text><rect x="40" y="434" width="402" height="66" rx="0" fill="#ffffb5" stroke="#a8a85a"/><g transform="translate(420,439)" fill="none" stroke="#444" stroke-width="1.3"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12"/></g><text x="50" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a5a2a" text-anchor="start">Leeruitkomst</text><text x="50" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">Voert experimenten uit volgens een zelf</text><text x="50" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1c1c1c" text-anchor="start">opgestelde opzet (NLQF 6)</text><path d="M100 160V188" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 188l-4 -8h8z" fill="#444"/><text x="108" y="178" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">stelt kwalificaties aan</text><path d="M100 254V282" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 254l-5 7l5 7l5 -7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="108" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">bestaat uit</text><path d="M100 330V358" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 358l-5 -7l5 -7l5 7z" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="108" y="348" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">bestaat uit een selectie van</text><path d="M100 406V434" stroke="#444" stroke-width="1.3" fill="none"/><path d="M100 434l-4 -8h8z" fill="#444"/><text x="108" y="424" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b6663" text-anchor="start">Wordt vertaald naar</text><path d="M442 472H501V306H322" stroke="#1f6fb2" stroke-width="1.3" fill="none"/><path d="M442 472l8 -4v8z" fill="#1f6fb2"/><text x="537" y="310" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1f6fb2" text-anchor="start">wordt ook vertaald naar deze</text><path d="M442 382H497A4 4 0 0 1 505 382H515V212H433" stroke="#b5651d" stroke-width="1.3" fill="none"/><path d="M433 212l8 -4v8z" fill="#b5651d"/><text x="537" y="216" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#b5651d" text-anchor="start">vertaalt naar het moment van afstuderen</text><path d="M442 458H497A4 4 0 0 1 505 458H529V226H519A4 4 0 0 0 511 226H433" stroke="#11776b" stroke-width="1.3" fill="none"/><path d="M442 458l8 -4v8z" fill="#11776b"/><text x="537" y="230" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#11776b" text-anchor="start">wordt ook vertaald naar deze</text><text x="12" y="522" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Het werkveld stelt kwalificaties aan de ervaren beroepsbeoefenaar; dat is het landelijk</text><text x="12" y="541" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">opleidingsprofiel. Het opleidingsprofiel van de opleiding vertaalt die naar wat een pas</text><text x="12" y="560" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">afgestudeerde moet kunnen. Beide bestaan uit competenties, met het niveau als attribuut.</text><text x="12" y="579" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6663" text-anchor="start">Elk van de drie vertaalt naar een leeruitkomst, in dezelfde vorm als in het mbo.</text></svg>